<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d1b2a">
<title>QUACKPOT</title>
<style>
:root{
  --bg:#0d1b2a; --panel:#132a3e; --panel2:#0e2233; --raise:#1c3a52; --ink:#eef6ff; --dim:#7fa8c4;
  --gold:#ffd23c; --cash:#7bd94a; --water2:#3fa0d8; --sun:#ffe08a; --red:#ff5a4d;
  --font:"Trebuchet MS",Verdana,system-ui,sans-serif; --fontnum:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font-family:var(--font);position:fixed;width:100%;-webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.show{display:flex}
.center{align-items:center;justify-content:center}
.disp{font-weight:900;letter-spacing:.05em;text-transform:uppercase}
.btn{background:linear-gradient(160deg,var(--raise),var(--panel2));border:1px solid #2a4a68;color:var(--ink);
  border-radius:14px;padding:13px 20px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
  transition:transform .1s,border-color .15s;box-shadow:0 5px 0 #06131f,0 8px 16px -6px rgba(0,0,0,.5)}
.btn:hover{border-color:var(--gold)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #06131f}
.btn.big{padding:16px 30px;font-size:15px}
.btn.ghost{background:transparent;box-shadow:none}
.btn.ghost:active{transform:translateY(2px)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none;transform:none}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);font-weight:800}
h1.logo{font-size:clamp(38px,10vw,62px);letter-spacing:.03em;line-height:.9;text-align:center;
  animation:logoBounce .7s cubic-bezier(.34,1.56,.64,1) both}
h1.logo .a{color:var(--sun);text-shadow:0 4px 0 #8a6a10}
h1.logo .b{color:var(--water2);text-shadow:0 4px 0 #0d3550}
@keyframes logoBounce{0%{transform:scale(.4) translateY(-30px);opacity:0}60%{transform:scale(1.08) translateY(4px);opacity:1}100%{transform:scale(1)}}
.tag{text-align:center;color:var(--dim);font-size:12px;letter-spacing:.06em;margin-top:6px}
#s-title{padding:20px}
#titleBg{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.tcloud{position:absolute;background:rgba(255,255,255,.06);border-radius:50px;filter:blur(1px)}
.tduck{position:absolute;opacity:.45;animation:tswim linear infinite}
@keyframes tswim{from{transform:translateX(-90px)}to{transform:translateX(calc(100vw + 90px))}}
.tstack{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%;max-width:420px;margin:0 auto}
.statrow{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center}
.statchip{background:rgba(255,255,255,.05);border:1px solid #2a4a68;border-radius:10px;padding:8px 14px;text-align:center;min-width:90px}
.statchip b{display:block;font-family:var(--fontnum);font-size:17px;color:var(--gold)}
.statchip span{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.tbtns{display:flex;flex-direction:column;gap:9px;width:100%;margin-top:10px}
.homelink{position:absolute;top:14px;left:14px;font-size:11px;color:var(--dim);letter-spacing:.1em;
  text-transform:uppercase;text-decoration:none;border:1px solid #2a4a68;border-radius:20px;padding:8px 14px;z-index:2}
.homelink:hover{color:var(--ink);border-color:var(--gold)}

#topBar{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 10px;background:var(--panel);
  border-bottom:1px solid #1a3651;flex-wrap:wrap}
#topBar .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--raise);border:1px solid #2a4a68;
  border-radius:20px;padding:5px 11px;font-size:11.5px;font-weight:700;white-space:nowrap}
.pill b{font-family:var(--fontnum)}
.pill.cash b{color:var(--cash)}
.pill.feath b{color:var(--gold)}
.pill.bag b{color:var(--ink)}
.pill.bag.full{border-color:var(--red);animation:bagPulse .8s ease-in-out infinite}
@keyframes bagPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,77,.5)}50%{box-shadow:0 0 0 6px rgba(255,90,77,0)}}
#sellBtn{background:linear-gradient(160deg,#4a9950,#2f6b34);border:1px solid #7bd94a;border-radius:20px;
  padding:6px 14px;font-size:11.5px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;
  box-shadow:0 4px 0 #1a3d1e;transition:transform .1s}
#sellBtn:active{transform:translateY(3px);box-shadow:0 1px 0 #1a3d1e}
#sellBtn:disabled{opacity:.35;box-shadow:none;transform:none;background:var(--raise);border-color:#2a4a68}
#stageWrap{flex:1;position:relative;min-height:0;overflow:hidden}
#gameCanvas{position:absolute;inset:0;display:block;cursor:crosshair}
#ammoBar{position:absolute;left:10px;bottom:10px;display:flex;gap:3px;z-index:3;pointer-events:none}
.shell{width:7px;height:17px;border-radius:3px;background:#2a4a68;border:1px solid #16324a}
.shell.live{background:linear-gradient(180deg,#ffd23c,#e07d1f);border-color:#8a5a10}
#reloadTxt{position:absolute;left:10px;bottom:32px;font-size:10.5px;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gold);z-index:3;pointer-events:none;display:none}
#weapTag{position:absolute;right:10px;bottom:10px;font-size:10px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;color:rgba(255,255,255,.6);z-index:3;pointer-events:none;text-shadow:0 1px 3px #000}
#zoneTabs{flex:0 0 auto;display:flex;gap:6px;padding:7px 9px;overflow-x:auto;background:var(--panel2);border-top:1px solid #1a3651}
.zoneTab{flex:0 0 auto;background:var(--raise);border:1px solid #2a4a68;border-radius:20px;padding:6px 13px;
  font-size:10.5px;font-weight:800;text-transform:uppercase;white-space:nowrap}
.zoneTab.sel{border-color:var(--gold);color:var(--gold);background:rgba(255,210,60,.12)}
.zoneTab.locked{opacity:.42}
#bottomTabs{flex:0 0 auto;display:flex;background:var(--panel);border-top:1px solid #1a3651;height:56px;position:relative;z-index:7}
.bTab{flex:1;padding:9px 4px;text-align:center;font-size:9.5px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;color:var(--dim);border-top:2px solid transparent}
.bTab.sel{color:var(--gold);border-top-color:var(--gold)}
.bTab .ic{font-size:17px;display:block;margin-bottom:1px}
#panelWrap{position:absolute;left:0;right:0;bottom:56px;background:var(--panel2);border-top:1px solid #1a3651;
  max-height:42vh;display:none;flex-direction:column;z-index:6}
#panelWrap.show{display:flex}
#panelHead{flex:0 0 auto;display:flex;align-items:center;padding:9px 14px 3px}
#panelHead b{font-size:12.5px;text-transform:uppercase;letter-spacing:.08em}
#panelClose{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--raise);border:1px solid #2a4a68;font-size:12px}
#panelBody{flex:1;overflow-y:auto;padding:7px 11px 14px;display:flex;flex-direction:column;gap:7px}
.secLbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:800;margin:5px 0 0}
.row{display:flex;align-items:center;gap:9px;background:var(--raise);border:1px solid #2a4a68;border-radius:10px;padding:8px 10px}
.row.owned{border-color:#3f7a4a;background:linear-gradient(160deg,#1c4a2e,#14321f)}
.row.equipped{border-color:var(--gold);background:linear-gradient(160deg,#3a3218,#241d0d)}
.row .ic{font-size:22px;flex:0 0 auto;width:30px;text-align:center}
.row .info{flex:1;min-width:0}
.row .nm{font-size:11.5px;font-weight:800}
.row .ds{font-size:10px;color:var(--dim);margin-top:1px;line-height:1.35}
.row button{flex:0 0 auto;background:var(--panel2);border:1px solid #2a4a68;border-radius:8px;padding:7px 10px;
  font-size:10px;font-weight:800;text-align:center;min-width:76px;color:var(--ink)}
.row button:disabled{opacity:.35}
.row .maxTag{flex:0 0 auto;color:var(--gold);font-weight:900;font-size:10px;letter-spacing:.08em;min-width:76px;text-align:center}
.cost-cash{color:var(--cash)}
.cost-feath{color:var(--gold)}
#toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,10px);background:var(--panel2);
  border:1px solid var(--gold);font-size:12px;font-weight:700;padding:9px 15px;border-radius:20px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9;max-width:88%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.veil{position:absolute;inset:0;background:rgba(6,12,20,.86);backdrop-filter:blur(3px);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:10;animation:fadeIn .2s ease both}
.veil.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.vcard{background:linear-gradient(160deg,var(--panel),var(--panel2));border:1px solid #2a4a68;border-radius:18px;
  padding:22px 20px;max-width:500px;width:100%;max-height:86vh;overflow-y:auto;box-shadow:0 30px 60px -20px #000;
  animation:rise .25s ease both;position:relative;text-align:center}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.vcard h2{font-size:20px;margin-bottom:8px}
.vcard .desc{color:var(--dim);font-size:13px;line-height:1.6;margin-bottom:14px}
.closeX{position:absolute;top:12px;right:14px;width:28px;height:28px;border-radius:50%;background:var(--raise);border:1px solid #2a4a68;font-size:13px}
.howto{font-size:12.5px;line-height:1.7;color:var(--dim);text-align:left}
.howto .sec{color:var(--sun);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.08em;margin:12px 0 5px;display:block}
.howto .sec:first-child{margin-top:0}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2a4a68;border-radius:4px}
</style>
</head>
<body>
<div id="app">

  <div class="screen show center" id="s-title">
    <div id="titleBg"></div>
    <a class="homelink" href="index.html">&larr; All games</a>
    <div class="tstack">
      <div class="eyebrow">Shoot · Fetch · Sell · Upgrade</div>
      <h1 class="logo"><span class="a">QUACK</span><span class="b">POT</span></h1>
      <div class="tag">One duck at a time. Then a billion.</div>
      <div class="statrow" id="metaStats"></div>
      <div class="tbtns">
        <button class="btn big" id="bContinue">Continue</button>
        <button class="btn big" id="bNewGame">New Hunt</button>
        <button class="btn ghost" id="bHowTo">How to play</button>
      </div>
    </div>
  </div>

  <div class="screen" id="s-game">
    <div id="topBar">
      <div class="pill cash">$ <b id="cashTxt">0</b></div>
      <div class="pill feath">Feathers <b id="feathTxt">0</b></div>
      <div class="pill bag" id="bagPill">Bag <b id="bagTxt">0/10</b></div>
      <button id="sellBtn">Sell</button>
      <div class="spacer"></div>
      <button class="btn ghost" id="bPrestige" style="display:none;padding:6px 10px;font-size:9.5px">Molt</button>
      <button class="btn ghost" id="bRules" style="padding:6px 10px;font-size:9.5px">Rules</button>
    </div>
    <div id="stageWrap">
      <canvas id="gameCanvas"></canvas>
      <div id="reloadTxt">Reloading…</div>
      <div id="ammoBar"></div>
      <div id="weapTag"></div>
    </div>
    <div id="zoneTabs"></div>
    <div id="bottomTabs">
      <button class="bTab sel" data-tab="weapon"><span class="ic">🔫</span>Weapon</button>
      <button class="bTab" data-tab="dog"><span class="ic">🐕</span>Dogs</button>
      <button class="bTab" data-tab="bag"><span class="ic">🎒</span>Bag</button>
      <button class="bTab" data-tab="maps"><span class="ic">🗺️</span>Maps</button>
    </div>
    <div id="panelWrap">
      <div id="panelHead"><b id="panelTitle">Weapon</b><button id="panelClose">&times;</button></div>
      <div id="panelBody"></div>
    </div>
    <div id="toast"></div>
  </div>

  <div class="veil" id="v-rules">
    <div class="vcard" style="max-width:540px">
      <button class="closeX" id="bCloseRules">&times;</button>
      <div class="eyebrow">Reference</div>
      <h2>How to play</h2>
      <div class="howto" id="rulesBody"></div>
    </div>
  </div>

  <div class="veil" id="v-offline">
    <div class="vcard">
      <div class="eyebrow">While you were away</div>
      <h2>Welcome back</h2>
      <div class="desc" id="offlineDesc"></div>
      <button class="btn big" id="bCloseOffline">Nice</button>
    </div>
  </div>

  <div class="veil" id="v-prestige">
    <div class="vcard">
      <div class="eyebrow">A fresh season</div>
      <h2>Molt and start again</h2>
      <div class="desc" id="prestigeDesc"></div>
      <div style="display:flex;gap:10px;justify-content:center">
        <button class="btn ghost" id="bCancelPrestige">Not yet</button>
        <button class="btn big" id="bConfirmPrestige">Molt</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
"use strict";
var $=function(id){return document.getElementById(id);};
function rnd(a,b){return a+Math.random()*(b-a);}
function ri(a,b){return Math.floor(rnd(a,b+1));}
function pick(a){return a[(Math.random()*a.length)|0];}
function weightedPick(t){var s=0,k;for(k in t)s+=t[k];var r=Math.random()*s;
  for(k in t){r-=t[k];if(r<=0)return k;}return Object.keys(t)[0];}
function fmt(n){
  n=Math.floor(n);
  if(n<1000) return String(n);
  var u=["","K","M","B","T","Qa","Qi","Sx","Sp","Oc"],i=0;
  while(n>=1000&&i<u.length-1){n/=1000;i++;}
  return (n>=100?n.toFixed(0):n>=10?n.toFixed(1):n.toFixed(2))+u[i];
}

/* ═══════════ DUCKS ═══════════ */
var DUCK_TYPES={
  common :{name:"Common Duck", hp:1,   cash:3,    feath:0,  body:"#fff6e2",shade:"#e8d2a2",beak:"#ff9d1f",speed:1.0,size:1.0},
  brown  :{name:"Brown Duck",  hp:3,   cash:9,    feath:0,  body:"#c9986a",shade:"#7d5433",beak:"#e07d1f",speed:1.1,size:1.0},
  golden :{name:"Golden Duck", hp:9,   cash:40,   feath:1,  body:"#ffe985",shade:"#d99310",beak:"#ff8a1f",speed:1.3,size:1.0,glow:"#ffd23c"},
  ghost  :{name:"Ghost Duck",  hp:6,   cash:120,  feath:3,  body:"#eefaff",shade:"#9dc9dd",beak:"#ffcf40",speed:1.7,size:.95,ghost:true},
  diamond:{name:"Diamond Duck",hp:26,  cash:260,  feath:6,  body:"#e4fbff",shade:"#63c4e2",beak:"#4fa8ff",speed:1.2,size:1.05,glow:"#8fe6ff"},
  robo   :{name:"Robo Duck",   hp:70,  cash:700,  feath:12, body:"#dfe6ea",shade:"#78858f",beak:"#ffcf40",speed:.85,size:1.15,metal:true},
  rainbow:{name:"Rainbow Duck",hp:150, cash:2200, feath:32, body:"#ffb3e6",shade:"#a34fd6",beak:"#ff8a1f",speed:1.5,size:1.1,rainbow:true},
  king   :{name:"King Duck",   hp:900, cash:16000,feath:180,body:"#ffe985",shade:"#c47a08",beak:"#ff8a1f",speed:.7,size:1.5,glow:"#ffd23c",crown:true}
};

/* ═══════════ MAPS ═══════════ */
var ZONES=[
  {id:"yard",  name:"Backyard",      cost:0,       mult:1,  rate:1.00, desc:"Where every hunter starts. Just the regulars.",
   spawn:{common:74,brown:26}},
  {id:"park",  name:"Park Lake",     cost:2500,    mult:2.4,rate:1.10, desc:"Bigger water, better birds.",
   spawn:{common:40,brown:40,golden:18,ghost:2}},
  {id:"forest",name:"Forest River",  cost:60000,   mult:6,  rate:1.20, desc:"Ducks get shinier the deeper you go.",
   spawn:{brown:36,golden:32,ghost:12,diamond:16,robo:4}},
  {id:"peak",  name:"Frozen Peak",   cost:1200000, mult:16, rate:1.30, desc:"Thin air, thick wallets.",
   spawn:{golden:28,ghost:18,diamond:30,robo:18,rainbow:6}},
  {id:"volcano",name:"Volcano Lagoon",cost:40000000,mult:45, rate:1.40, desc:"Every duck here is a little unreasonable.",
   spawn:{diamond:26,robo:30,ghost:14,rainbow:22,king:8}},
  {id:"space", name:"Space Pond",    cost:2000000000,mult:130,rate:1.55,desc:"Nobody knows how the ducks got up here.",
   spawn:{robo:24,ghost:16,rainbow:38,king:22}}
];

/* ═══════════ WEAPONS (items) ═══════════ */
var WEAPONS=[
  {id:"sling", name:"Slingshot",     ic:"🪃", cost:0,        dmg:1,   rate:2.2, mag:4,  reload:1.5, desc:"A rock and a rubber band."},
  {id:"shotty",name:"Old Shotgun",   ic:"🔫", cost:1500,     dmg:3.5, rate:1.5, mag:6,  reload:1.9, desc:"Loud, slow, and it works."},
  {id:"repeat",name:"Repeater",      ic:"🎯", cost:45000,    dmg:11,  rate:4.0, mag:12, reload:1.4, desc:"Lever action. Keeps going."},
  {id:"auto",  name:"Auto-Blaster",  ic:"⚙️", cost:900000,   dmg:38,  rate:7.5, mag:24, reload:1.1, desc:"Hold on to something."},
  {id:"laser", name:"Laser Quacker", ic:"⚡", cost:25000000, dmg:150, rate:11,  mag:40, reload:.8,  desc:"Legally not a firearm."}
];
/* ═══════════ DOGS (items) ═══════════ */
var DOGS=[
  {id:"jeff",  name:"Jeff",         ic:"🐕", cost:400,      speed:105, carry:1, coat:"#e8b880",ear:"#c9986a",desc:"Good boy. Slow, but good."},
  {id:"bolt",  name:"Bolt",         ic:"🐩", cost:18000,    speed:180, carry:2, coat:"#d9d2c4",ear:"#a89e8c",desc:"Twice the legs, somehow."},
  {id:"ranger",name:"Ranger",       ic:"🦮", cost:400000,   speed:265, carry:4, coat:"#c2872f",ear:"#8a5c14",desc:"Trained. Actually trained."},
  {id:"cyber", name:"Cyber Hound",  ic:"🤖", cost:12000000, speed:400, carry:8, coat:"#b8c4cc",ear:"#7d8a94",desc:"Fetches at industrial scale."}
];

/* ═══════════ SAVE ═══════════ */
var SAVE_KEY="quackpot:save", META_KEY="quackpot:meta";
var meta={bestZone:0,molts:0,bestCash:0};
function loadMeta(){try{var s=localStorage.getItem(META_KEY);if(s)meta=Object.assign(meta,JSON.parse(s));}catch(e){}}
function saveMeta(){try{localStorage.setItem(META_KEY,JSON.stringify(meta));}catch(e){}}

var S=null;
function newState(){
  S={cash:0,feathers:0,lifetime:0,golden:0,
     weapon:"sling", dog:null,
     dmgLvl:0,rateLvl:0,magLvl:0,reloadLvl:0,multiLvl:0,critLvl:0,pierceLvl:0,
     dogSpeedLvl:0,dogCarryLvl:0,
     bagLvl:0,valueLvl:0,autoSell:false,
     falconLvl:0,
     bag:[],zone:"yard",unlocked:["yard"],lastSave:Date.now()};
  saveState();
}
function saveState(){if(!S)return;S.bag=bag;S.lastSave=Date.now();try{localStorage.setItem(SAVE_KEY,JSON.stringify(S));}catch(e){}}
function loadState(){try{var s=localStorage.getItem(SAVE_KEY);if(s){S=JSON.parse(s);return true;}}catch(e){}return false;}
var saveT=null;
function saveSoon(){clearTimeout(saveT);saveT=setTimeout(saveState,700);}

/* ═══════════ DERIVED STATS ═══════════ */
function weaponDef(){return WEAPONS.filter(function(w){return w.id===S.weapon;})[0];}
function dogDef(){return S.dog?DOGS.filter(function(d){return d.id===S.dog;})[0]:null;}
function zoneDef(){return ZONES.filter(function(z){return z.id===S.zone;})[0];}

var MAXLVL=15, MULTI_MAX=5, CRIT_MAX=6, PIERCE_MAX=3, DOGLVL_MAX=12, BAGLVL_MAX=20, VALLVL_MAX=12, FALCON_MAX=10;
var MULTI_NAMES=["Double Shot","Triple Shot","Quad Shot","Penta Shot","Hexa Shot"];

function gunDamage(){return weaponDef().dmg*Math.pow(1.22,S.dmgLvl);}
function gunRate(){return weaponDef().rate*(1+S.rateLvl*0.11);}
function gunMag(){return Math.floor(weaponDef().mag+S.magLvl*3);}
function gunReload(){return Math.max(.28,weaponDef().reload*(1-S.reloadLvl*0.055));}
function pellets(){return 1+S.multiLvl;}
function critChance(){return S.critLvl*5;}
function critMult(){return 4;}
function pierceCount(){return S.pierceLvl;}
function dogSpeed(){var d=dogDef();return d?d.speed*(1+S.dogSpeedLvl*0.1):0;}
function dogCarry(){var d=dogDef();return d?d.carry+S.dogCarryLvl:0;}
function bagCap(){return 10+S.bagLvl*6;}
function valueMult(){return (1+S.valueLvl*0.18)*zoneDef().mult*(1+S.golden*0.02);}
function falconInterval(){return S.falconLvl>0?Math.max(1.1,7-S.falconLvl*0.62):0;}

function dmgCost(){return Math.floor(40*Math.pow(1.55,S.dmgLvl));}
function rateCost(){return Math.floor(70*Math.pow(1.62,S.rateLvl));}
function magCost(){return Math.floor(90*Math.pow(1.6,S.magLvl));}
function reloadCost(){return Math.floor(80*Math.pow(1.6,S.reloadLvl));}
function multiCost(){return Math.floor(3000*Math.pow(6.5,S.multiLvl));}
function critCost(){return Math.floor(900*Math.pow(3.4,S.critLvl));}
function pierceCost(){return Math.floor(20000*Math.pow(7,S.pierceLvl));}
function dogSpeedCost(){return Math.floor(300*Math.pow(1.7,S.dogSpeedLvl));}
function dogCarryCost(){return Math.floor(1200*Math.pow(2.4,S.dogCarryLvl));}
function bagCost(){return Math.floor(120*Math.pow(1.5,S.bagLvl));}
function valueCost(){return Math.floor(2000*Math.pow(2.1,S.valueLvl));}
var AUTOSELL_COST=60;              /* feathers */
function falconCost(){return Math.floor(15*Math.pow(1.85,S.falconLvl));} /* feathers */

/* ═══════════ CANVAS ═══════════ */
var cv,cx,CW=0,CH=0,DPR=1,GROUND=0;
function resizeCanvas(){
  if(!cv)return;
  var r=$("stageWrap").getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  CW=Math.max(1,r.width); CH=Math.max(1,r.height);
  cv.width=CW*DPR; cv.height=CH*DPR;
  cv.style.width=CW+"px"; cv.style.height=CH+"px";
  cx.setTransform(DPR,0,0,DPR,0,0);
  GROUND=CH*0.80;
}

/* ═══════════ ENTITIES ═══════════ */
var ducks=[],downed=[],parts=[],floats=[],flashes=[],dog=null,falconT=0,shake=0;
function resetEntities(){ducks=[];downed=[];parts=[];floats=[];flashes=[];shake=0;
  dog={x:40,y:0,vx:0,state:"idle",carry:[],target:null,legT:0,facing:1};}

function spawnDuck(){
  var z=zoneDef(), key=weightedPick(z.spawn), t=DUCK_TYPES[key];
  var fromLeft=Math.random()<0.5;
  var sp=rnd(55,95)*t.speed;
  ducks.push({
    type:key, hp:t.hp, maxHp:t.hp,
    x:fromLeft?-50:CW+50, y:rnd(CH*0.10,CH*0.58),
    vx:(fromLeft?1:-1)*sp, baseY:0, phase:rnd(0,6.28), wing:rnd(0,6.28),
    scale:t.size*(CH<420?0.78:0.95), hitFlash:0
  });
  ducks[ducks.length-1].baseY=ducks[ducks.length-1].y;
}
function damageDuck(d,amount,isCrit){
  d.hp-=amount; d.hitFlash=0.12;
  addFloat(d.x,d.y-26,(isCrit?"CRIT ":"")+fmt(amount),isCrit?"#ffd23c":"#ffffff",isCrit?17:13);
  burst(d.x,d.y,isCrit?12:5,DUCK_TYPES[d.type]);
  if(d.hp<=0){ downDuck(d); return true; }
  return false;
}
function downDuck(d){
  var i=ducks.indexOf(d); if(i>=0)ducks.splice(i,1);
  downed.push({type:d.type,x:d.x,y:d.y,vy:0,vx:d.vx*0.25,spin:0,
    spinV:rnd(-9,9),landed:false,life:14,scale:d.scale,claimed:false});
  burst(d.x,d.y,14,DUCK_TYPES[d.type]);
  shake=Math.max(shake,DUCK_TYPES[d.type].crown?9:4);
}
function collectDowned(dd){
  var i=downed.indexOf(dd); if(i>=0)downed.splice(i,1);
  addToBag(dd.type,dd.x,dd.y);
}
var bag=[];
function addToBag(type,x,y){
  if(bag.length>=bagCap()){ addFloat(x,y-20,"BAG FULL","#ff5a4d",13); return false; }
  bag.push(type); S.lifetime++;
  addFloat(x,y-20,"+1","#7bd94a",14);
  if(bag.length>=bagCap() && S.autoSell) sellBag();
  updateHud(); return true;
}
function sellBag(){
  if(!bag.length) return;
  var cash=0,feath=0,vm=valueMult();
  bag.forEach(function(k){var t=DUCK_TYPES[k];cash+=t.cash*vm;feath+=t.feath;});
  cash=Math.floor(cash); feath=Math.floor(feath);
  S.cash+=cash; S.feathers+=feath;
  if(S.cash>meta.bestCash){meta.bestCash=S.cash;saveMeta();}
  toast("Sold "+bag.length+" duck"+(bag.length>1?"s":"")+" for $"+fmt(cash)+(feath?" + "+fmt(feath)+" feathers":""));
  bag=[];
  updateHud(); saveSoon();
}

function burst(x,y,n,t){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283, sp=rnd(40,190);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-40,life:rnd(.35,.8),
      c:Math.random()<.5?t.body:t.shade,r:rnd(2,4.5)});
  }
}
function addFloat(x,y,txt,col,size){floats.push({x:x,y:y,t:txt,c:col,s:size||14,life:.9});}

/* ═══════════ SHOOTING ═══════════ */
var ammo=0,reloading=false,reloadT=0,lastShot=0,recoil=0;
function startReload(){
  if(reloading||ammo>=gunMag())return;
  reloading=true; reloadT=gunReload();
  $("reloadTxt").style.display="";
}
function finishReload(){reloading=false;ammo=gunMag();$("reloadTxt").style.display="none";renderAmmo();}

function shootAt(mx,my){
  /* clicking a downed duck picks it up by hand - no ammo used */
  for(var i=downed.length-1;i>=0;i--){
    var dd=downed[i], r=30*dd.scale;
    if(Math.abs(dd.x-mx)<r && Math.abs(dd.y-my)<r){ collectDowned(dd); return; }
  }
  if(reloading) return;
  if(ammo<=0){ startReload(); return; }
  var now=performance.now();
  if(now-lastShot < 1000/gunRate()) return;
  lastShot=now; ammo--; renderAmmo(); recoil=1; shake=Math.max(shake,2);
  flashes.push({x:mx,y:my,life:.12});
  if(ammo<=0) startReload();

  var targets=[];
  var direct=findDuckAt(mx,my);
  if(direct) targets.push(direct);
  /* multi-shot: extra pellets seek out other ducks on screen */
  var extra=pellets()-1;
  if(extra>0){
    var others=ducks.filter(function(d){return targets.indexOf(d)<0;});
    others.sort(function(a,b){return dist2(a,mx,my)-dist2(b,mx,my);});
    for(var e=0;e<extra && e<others.length;e++) targets.push(others[e]);
  }
  if(!targets.length){ addFloat(mx,my-10,"miss","#8fa8bd",11); return; }

  var dmg=gunDamage();
  targets.forEach(function(d){
    var isCrit=Math.random()*100<critChance();
    var amt=Math.max(1,Math.floor(dmg*(isCrit?critMult():1)));
    var killed=damageDuck(d,amt,isCrit);
    /* piercing carries leftover shots into the next duck along */
    if(killed && pierceCount()>0){
      var rest=ducks.filter(function(o){return o!==d;})
        .sort(function(a,b){return dist2(a,d.x,d.y)-dist2(b,d.x,d.y);});
      for(var p=0;p<pierceCount() && p<rest.length;p++) damageDuck(rest[p],Math.floor(amt*0.6),false);
    }
  });
}
function dist2(d,x,y){var a=d.x-x,b=d.y-y;return a*a+b*b;}
function findDuckAt(mx,my){
  var best=null,bd=1e9;
  ducks.forEach(function(d){
    var r=34*d.scale, dx=d.x-mx, dy=d.y-my, dd=dx*dx+dy*dy;
    if(dd<r*r && dd<bd){bd=dd;best=d;}
  });
  return best;
}

/* ═══════════ UPDATE ═══════════ */
var spawnT=0;
function update(dt){
  if(shake>0) shake=Math.max(0,shake-dt*26);
  if(recoil>0) recoil=Math.max(0,recoil-dt*6);
  if(reloading){ reloadT-=dt; if(reloadT<=0) finishReload(); }

  /* spawn */
  var z=zoneDef();
  spawnT-=dt;
  var want=CH<420?5:7;
  if(spawnT<=0 && ducks.length<want){ spawnDuck(); spawnT=rnd(.35,1.1)/z.rate; }

  /* flying ducks */
  for(var i=ducks.length-1;i>=0;i--){
    var d=ducks[i];
    d.x+=d.vx*dt; d.phase+=dt*2.2; d.wing+=dt*11;
    d.y=d.baseY+Math.sin(d.phase)*16;
    if(d.hitFlash>0)d.hitFlash-=dt;
    if(d.x<-90||d.x>CW+90) ducks.splice(i,1);
  }
  /* falling / downed ducks */
  for(var j=downed.length-1;j>=0;j--){
    var dd=downed[j];
    if(!dd.landed){
      dd.vy+=780*dt; dd.y+=dd.vy*dt; dd.x+=dd.vx*dt; dd.spin+=dd.spinV*dt;
      if(dd.y>=GROUND){ dd.y=GROUND; dd.landed=true; dd.spin=0;
        burst(dd.x,GROUND,7,DUCK_TYPES[dd.type]); shake=Math.max(shake,2.5); }
    } else {
      dd.life-=dt;
      if(dd.life<=0) downed.splice(j,1);
    }
  }
  updateDog(dt);
  updateFalcon(dt);

  for(var p=parts.length-1;p>=0;p--){
    var pt=parts[p]; pt.life-=dt;
    pt.vy+=560*dt; pt.x+=pt.vx*dt; pt.y+=pt.vy*dt;
    if(pt.life<=0)parts.splice(p,1);
  }
  for(var f=floats.length-1;f>=0;f--){
    floats[f].life-=dt; floats[f].y-=42*dt;
    if(floats[f].life<=0)floats.splice(f,1);
  }
  for(var fl=flashes.length-1;fl>=0;fl--){
    flashes[fl].life-=dt; if(flashes[fl].life<=0)flashes.splice(fl,1);
  }
}

function updateDog(dt){
  if(!dog) return;
  dog.y=GROUND;
  if(!S.dog){ dog.state="idle"; return; }
  var sp=dogSpeed(), cap=dogCarry();
  dog.legT+=dt*Math.abs(dog.vx)*0.06;

  if(dog.state==="idle"||dog.state==="seek"){
    /* claim the nearest unclaimed landed duck */
    if(!dog.target||downed.indexOf(dog.target)<0){
      dog.target=null;
      var best=null,bd=1e9;
      downed.forEach(function(dd){
        if(dd.claimed||!dd.landed)return;
        var dx=Math.abs(dd.x-dog.x);
        if(dx<bd){bd=dx;best=dd;}
      });
      if(best){best.claimed=true;dog.target=best;dog.state="seek";}
      else if(dog.carry.length>0){dog.state="return";}
      else {dog.state="idle";dog.vx=0;}
    }
    if(dog.target){
      var dx=dog.target.x-dog.x;
      dog.facing=dx<0?-1:1;
      dog.vx=Math.sign(dx)*sp;
      dog.x+=dog.vx*dt;
      if(Math.abs(dx)<14){
        var k=downed.indexOf(dog.target);
        if(k>=0)downed.splice(k,1);
        dog.carry.push(dog.target.type);
        burst(dog.x,GROUND-10,6,DUCK_TYPES[dog.target.type]);
        dog.target=null;
        dog.state=(dog.carry.length>=cap)?"return":"seek";
      }
    }
  } else if(dog.state==="return"){
    var dxh=20-dog.x;
    if(Math.abs(dxh)>=16){
      dog.facing=dxh<0?-1:1;
      dog.vx=Math.sign(dxh)*sp;
      dog.x+=dog.vx*dt;
    } else {
      dog.vx=0;
      /* deposit only while the bag has room. If it is full the dog waits at
         the kennel instead of retrying every frame - retrying re-ran
         addToBag ~60x a second and buried the pond in "BAG FULL" popups. */
      while(dog.carry.length && bag.length<bagCap()) addToBag(dog.carry.shift(),40,GROUND-30);
      if(!dog.carry.length) dog.state="idle";
    }
  }
  dog.x=Math.max(10,Math.min(CW-10,dog.x));
}

function updateFalcon(dt){
  if(S.falconLvl<=0) return;
  falconT-=dt;
  if(falconT<=0){
    falconT=falconInterval();
    if(ducks.length){
      /* falcon strikes the most valuable bird in the sky */
      var best=ducks[0];
      ducks.forEach(function(d){
        if(DUCK_TYPES[d.type].cash>DUCK_TYPES[best.type].cash) best=d;
      });
      addFloat(best.x,best.y-34,"FALCON","#c16cff",12);
      damageDuck(best,Math.max(1,Math.floor(gunDamage()*2.2)),false);
    }
  }
}

/* ═══════════ DRAW ═══════════ */
var ZTHEME={
  yard   :{s1:"#79cfec",s2:"#c8ecff",g1:"#5cb35f",g2:"#3d8a44",sun:"#fff3b0",hill:"#4f9e55",night:false},
  park   :{s1:"#57b6e0",s2:"#b3e2f7",g1:"#4a9e58",g2:"#31753d",sun:"#fff3b0",hill:"#3c8a4c",night:false},
  forest :{s1:"#3f8f6f",s2:"#a5dcbb",g1:"#2f6b45",g2:"#1e4a2f",sun:"#eaf7bd",hill:"#255c3a",night:false},
  peak   :{s1:"#6d84d0",s2:"#d3ddff",g1:"#dfe9ff",g2:"#a9bcd8",sun:"#ffffff",hill:"#93a6cc",night:false},
  volcano:{s1:"#6e1a10",s2:"#e2652f",g1:"#5a190d",g2:"#2e0c06",sun:"#ffcf40",hill:"#3a0f08",night:false},
  space  :{s1:"#0a0620",s2:"#2a1450",g1:"#241247",g2:"#120827",sun:"#c16cff",hill:"#1b0d38",night:true}
};
var stars=[];
function seedStars(){stars=[];for(var i=0;i<50;i++)stars.push({x:Math.random(),y:Math.random()*0.6,r:rnd(.5,1.7),a:rnd(.3,1)});}
var clouds=[];
function seedClouds(){clouds=[];for(var i=0;i<5;i++)clouds.push({x:Math.random(),y:rnd(.05,.34),w:rnd(60,150),sp:rnd(3,10)});}

function draw(){
  var th=ZTHEME[S.zone]||ZTHEME.yard;
  cx.save();
  if(shake>0) cx.translate(rnd(-shake,shake),rnd(-shake,shake));
  cx.clearRect(-20,-20,CW+40,CH+40);

  /* sky */
  var sky=cx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,th.s1); sky.addColorStop(1,th.s2);
  cx.fillStyle=sky; cx.fillRect(-20,-20,CW+40,GROUND+20);

  if(th.night){
    stars.forEach(function(s){
      cx.globalAlpha=s.a; cx.fillStyle="#fff";
      cx.beginPath();cx.arc(s.x*CW,s.y*CH,s.r,0,6.283);cx.fill();
    });
    cx.globalAlpha=1;
  }
  /* sun */
  cx.fillStyle=th.sun; cx.globalAlpha=.85;
  cx.beginPath();cx.arc(CW*0.82,CH*0.15,Math.min(CW,CH)*0.09,0,6.283);cx.fill();
  cx.globalAlpha=1;

  /* clouds - skipped on the night theme, where they read as grey blobs in space */
  cx.fillStyle="rgba(255,255,255,.55)";
  if(!th.night) clouds.forEach(function(c){
    c.x+=c.sp/CW*0.0016; if(c.x>1.2)c.x=-0.25;
    var x=c.x*CW,y=c.y*CH,w=c.w,h=w*0.34;
    cx.beginPath();
    cx.ellipse(x,y,w*.5,h*.5,0,0,6.283);
    cx.ellipse(x-w*.25,y+h*.1,w*.3,h*.38,0,0,6.283);
    cx.ellipse(x+w*.26,y+h*.08,w*.32,h*.4,0,0,6.283);
    cx.fill();
  });

  /* hills */
  cx.fillStyle=th.hill; cx.globalAlpha=.75;
  cx.beginPath();
  cx.moveTo(-20,GROUND);
  cx.quadraticCurveTo(CW*0.18,GROUND-CH*0.20,CW*0.42,GROUND);
  cx.quadraticCurveTo(CW*0.68,GROUND-CH*0.26,CW*1.02,GROUND);
  cx.lineTo(CW+20,GROUND); cx.closePath(); cx.fill();
  cx.globalAlpha=1;

  /* ground */
  var gr=cx.createLinearGradient(0,GROUND,0,CH);
  gr.addColorStop(0,th.g1); gr.addColorStop(1,th.g2);
  cx.fillStyle=gr; cx.fillRect(-20,GROUND,CW+40,CH-GROUND+20);
  cx.fillStyle="rgba(0,0,0,.13)";
  cx.fillRect(-20,GROUND,CW+40,3);

  drawKennel();

  /* downed ducks (shadow then body) */
  downed.forEach(function(dd){
    if(dd.landed){
      cx.fillStyle="rgba(0,0,0,.22)";
      cx.beginPath();cx.ellipse(dd.x,GROUND+3,22*dd.scale,5*dd.scale,0,0,6.283);cx.fill();
    }
    cx.save();
    if(dd.landed){
      /* sit it on the ground with a small flop - a quarter turn made downed
         ducks look like they were standing there waiting */
      cx.translate(dd.x,dd.y-15*dd.scale); cx.rotate(0.16);
    } else {
      cx.translate(dd.x,dd.y-14*dd.scale); cx.rotate(dd.spin);
    }
    cx.scale(dd.scale,dd.scale);
    if(dd.landed && dd.life<3.5) cx.globalAlpha=0.35+0.65*Math.abs(Math.sin(dd.life*7));
    drawDuckShape(DUCK_TYPES[dd.type],0,false,0);
    cx.restore();
  });

  if(dog && S.dog) drawDog();

  /* flying ducks */
  ducks.forEach(function(d){
    var t=DUCK_TYPES[d.type];
    cx.save();
    cx.translate(d.x,d.y);
    cx.scale(d.scale*(d.vx<0?-1:1),d.scale);
    if(t.ghost) cx.globalAlpha=0.45+0.35*Math.sin(d.phase*1.6);
    drawDuckShape(t,d.wing,true,d.hitFlash>0?1:0);
    cx.restore();
    if(d.hp<d.maxHp) drawHpBar(d);
  });

  /* particles */
  parts.forEach(function(p){
    cx.globalAlpha=Math.max(0,Math.min(1,p.life*2));
    cx.fillStyle=p.c;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,6.283);cx.fill();
  });
  cx.globalAlpha=1;

  /* muzzle flashes */
  flashes.forEach(function(f){
    var a=f.life/0.12;
    cx.globalAlpha=a; cx.fillStyle="#fff3b0";
    cx.beginPath();cx.arc(f.x,f.y,26*(1-a)+8,0,6.283);cx.fill();
    cx.globalAlpha=1;
  });

  /* floating text */
  floats.forEach(function(fl){
    cx.globalAlpha=Math.max(0,Math.min(1,fl.life*1.6));
    cx.font="900 "+fl.s+"px "+"ui-monospace,Menlo,Consolas,monospace";
    cx.textAlign="center"; cx.lineWidth=3; cx.strokeStyle="rgba(0,0,0,.75)";
    cx.strokeText(fl.t,fl.x,fl.y); cx.fillStyle=fl.c; cx.fillText(fl.t,fl.x,fl.y);
  });
  cx.globalAlpha=1;
  cx.restore();
}

function drawHpBar(d){
  var w=34*d.scale,h=4,x=d.x-w/2,y=d.y-30*d.scale;
  cx.fillStyle="rgba(0,0,0,.5)";cx.fillRect(x,y,w,h);
  cx.fillStyle=d.hp/d.maxHp>.5?"#7bd94a":(d.hp/d.maxHp>.22?"#ffd23c":"#ff5a4d");
  cx.fillRect(x,y,w*(d.hp/d.maxHp),h);
}

/* cartoony shaded duck, drawn facing left */
function drawDuckShape(t,wingPhase,flying,hit){
  var bodyG=cx.createRadialGradient(-8,-10,3,0,2,30);
  bodyG.addColorStop(0,"#ffffff");
  bodyG.addColorStop(.34,t.body);
  bodyG.addColorStop(1,t.shade);
  cx.lineWidth=2; cx.strokeStyle="rgba(40,25,10,.35)";

  /* tail */
  cx.fillStyle=t.shade;
  cx.beginPath();cx.moveTo(18,2);cx.lineTo(34,-8);cx.lineTo(32,8);cx.closePath();cx.fill();

  /* body */
  cx.fillStyle=bodyG;
  cx.beginPath();cx.ellipse(2,4,22,16,0,0,6.283);cx.fill();cx.stroke();

  /* wing */
  cx.save();
  cx.translate(4,-2);
  var flap=flying?Math.sin(wingPhase)*0.75:0.25;
  cx.rotate(flap);
  var wg=cx.createLinearGradient(0,-8,0,10);
  wg.addColorStop(0,t.body); wg.addColorStop(1,t.shade);
  cx.fillStyle=wg;
  cx.beginPath();cx.ellipse(2,0,15,8,0,0,6.283);cx.fill();cx.stroke();
  cx.restore();

  /* head */
  cx.fillStyle=bodyG;
  cx.beginPath();cx.arc(-14,-10,13,0,6.283);cx.fill();cx.stroke();

  /* highlight */
  cx.fillStyle="rgba(255,255,255,.5)";
  cx.beginPath();cx.ellipse(-18,-16,5.5,3.4,-0.5,0,6.283);cx.fill();

  /* eye */
  cx.fillStyle="#fff";
  cx.beginPath();cx.arc(-18,-11,5,0,6.283);cx.fill();
  cx.fillStyle="#20221f";
  cx.beginPath();cx.arc(-19.4,-11,2.7,0,6.283);cx.fill();
  cx.fillStyle="#fff";
  cx.beginPath();cx.arc(-20.3,-12.3,1,0,6.283);cx.fill();

  /* blush */
  cx.globalAlpha=.5; cx.fillStyle="#ff8fa8";
  cx.beginPath();cx.ellipse(-23,-4,3.6,2.2,0,0,6.283);cx.fill();
  cx.globalAlpha=1;

  /* beak */
  cx.fillStyle=t.beak;
  cx.beginPath();
  cx.moveTo(-24,-8); cx.quadraticCurveTo(-38,-8,-36,-3);
  cx.quadraticCurveTo(-38,2,-24,-1); cx.closePath();
  cx.fill(); cx.stroke();

  if(t.metal){
    cx.fillStyle="#ff5a4d";
    cx.beginPath();cx.arc(2,0,2.6,0,6.283);cx.fill();
  }
  if(t.crown){
    cx.fillStyle="#ffd23c"; cx.strokeStyle="rgba(60,40,0,.5)";
    cx.beginPath();
    cx.moveTo(-22,-22);cx.lineTo(-20,-30);cx.lineTo(-15,-25);cx.lineTo(-11,-31);
    cx.lineTo(-7,-25);cx.lineTo(-5,-22);cx.closePath();
    cx.fill();cx.stroke();
  }
  if(hit){
    cx.globalAlpha=.55; cx.fillStyle="#fff";
    cx.beginPath();cx.ellipse(2,4,23,17,0,0,6.283);cx.fill();
    cx.beginPath();cx.arc(-14,-10,14,0,6.283);cx.fill();
    cx.globalAlpha=1;
  }
}

function drawKennel(){
  var x=22,y=GROUND;
  cx.fillStyle="rgba(0,0,0,.2)";
  cx.beginPath();cx.ellipse(x+8,y+3,26,6,0,0,6.283);cx.fill();
  cx.fillStyle="#8a5f3a";
  cx.fillRect(x-14,y-30,44,30);
  cx.fillStyle="#a9784f";
  cx.beginPath();cx.moveTo(x-20,y-30);cx.lineTo(x+8,y-48);cx.lineTo(x+36,y-30);cx.closePath();cx.fill();
  cx.fillStyle="#3a2a1a";
  cx.beginPath();cx.ellipse(x+8,y-8,11,15,0,Math.PI,0);cx.fill();
  cx.fillRect(x-3,y-12,22,12);
  /* bag counter above kennel */
  var cap=bagCap();
  cx.font="900 11px "+"ui-monospace,Menlo,Consolas,monospace";
  cx.textAlign="center"; cx.lineWidth=3; cx.strokeStyle="rgba(0,0,0,.7)";
  var txt=bag.length+"/"+cap;

function drawDog(){
  var d=dogDef(); if(!d)return;
  var x=dog.x,y=GROUND,f=dog.facing;
  var moving=Math.abs(dog.vx)>1;
  var bob=moving?Math.sin(dog.legT*3)*2:0;
  cx.fillStyle="rgba(0,0,0,.22)";
  cx.beginPath();cx.ellipse(x,y+3,20,5,0,0,6.283);cx.fill();
  cx.save(); cx.translate(x,y-16+bob); cx.scale(f,1);
  cx.lineWidth=2; cx.strokeStyle="rgba(40,25,10,.35)";
  /* legs */
  cx.strokeStyle=d.ear; cx.lineWidth=4; cx.lineCap="round";
  var lp=moving?Math.sin(dog.legT*3):0;
  cx.beginPath();
  cx.moveTo(-8,8);cx.lineTo(-8+lp*6,17);
  cx.moveTo(8,8);cx.lineTo(8-lp*6,17);
  cx.stroke();
  cx.lineWidth=2; cx.strokeStyle="rgba(40,25,10,.35)";
  /* tail */
  cx.strokeStyle=d.coat; cx.lineWidth=4;
  cx.beginPath();cx.moveTo(14,-2);
  cx.quadraticCurveTo(24,-8-(moving?Math.sin(dog.legT*8)*5:0),20,-12);
  cx.stroke();
  cx.lineWidth=2; cx.strokeStyle="rgba(40,25,10,.35)";
  /* body */
  var bg=cx.createLinearGradient(0,-12,0,12);
  bg.addColorStop(0,"#ffffff"); bg.addColorStop(.4,d.coat); bg.addColorStop(1,d.ear);
  cx.fillStyle=bg;
  cx.beginPath();cx.ellipse(2,0,16,11,0,0,6.283);cx.fill();cx.stroke();
  /* head */
  cx.beginPath();cx.arc(-13,-8,11,0,6.283);cx.fill();cx.stroke();
  /* ear */
  cx.fillStyle=d.ear;
  cx.beginPath();cx.ellipse(-9,-15,4.5,8,0.4,0,6.283);cx.fill();cx.stroke();
  /* snout */
  cx.fillStyle=d.coat;
  cx.beginPath();cx.ellipse(-22,-5,7,5,0,0,6.283);cx.fill();cx.stroke();
  cx.fillStyle="#3a2a1a";
  cx.beginPath();cx.arc(-27,-6,2.4,0,6.283);cx.fill();
  /* eye */
  cx.fillStyle="#fff";cx.beginPath();cx.arc(-15,-10,3.4,0,6.283);cx.fill();
  cx.fillStyle="#20221f";cx.beginPath();cx.arc(-16.4,-10,1.8,0,6.283);cx.fill();
  /* carried ducks */
  if(dog.carry.length){
    cx.save(); cx.translate(-26,-2); cx.scale(.42,.42);
    drawDuckShape(DUCK_TYPES[dog.carry[dog.carry.length-1]],0,false,0);
    cx.restore();
    if(dog.carry.length>1){
      cx.font="900 10px ui-monospace,monospace";cx.textAlign="center";
      cx.lineWidth=3;cx.strokeStyle="rgba(0,0,0,.7)";
      cx.scale(f,1);
      cx.strokeText("x"+dog.carry.length,f*-26,-18);
      cx.fillStyle="#ffd23c";cx.fillText("x"+dog.carry.length,f*-26,-18);
    }
  }
  cx.restore();
}

/* ═══════════ LOOP ═══════════ */
var raf=null,lastT=0,running=false;
function loop(ts){
  if(!running)return;
  if(!lastT)lastT=ts;
  var dt=Math.min((ts-lastT)/1000,0.05); lastT=ts;
  update(dt); draw();
  raf=requestAnimationFrame(loop);
}
function startLoop(){if(running)return;running=true;lastT=0;raf=requestAnimationFrame(loop);}
function stopLoop(){running=false;if(raf)cancelAnimationFrame(raf);raf=null;}

/* ═══════════ INPUT ═══════════ */
function canvasPoint(ev){
  var r=cv.getBoundingClientRect();
  var t=(ev.touches&&ev.touches[0])||ev;
  return {x:t.clientX-r.left,y:t.clientY-r.top};
}
function onFire(ev){
  ev.preventDefault();
  var p=canvasPoint(ev);
  shootAt(p.x,p.y);
}

/* ═══════════ OFFLINE ═══════════ */
function idleDucksPerSec(){
  if(!S.falconLvl||!S.dog||!S.autoSell) return 0;
  /* the falcon is the bottleneck: one strike per interval, and only kills
     ducks it can actually finish, so scale by how much of an average duck
     one strike removes */
  var z=zoneDef(),wsum=0,avgHp=0,k;
  for(k in z.spawn) wsum+=z.spawn[k];
  for(k in z.spawn) avgHp+=(z.spawn[k]/wsum)*DUCK_TYPES[k].hp;
  var perStrike=Math.min(1,(gunDamage()*2.2)/Math.max(1,avgHp));
  return (1/falconInterval())*perStrike;
}
function avgDuckCash(){
  var z=zoneDef(),wsum=0,c=0,k;
  for(k in z.spawn) wsum+=z.spawn[k];
  for(k in z.spawn) c+=(z.spawn[k]/wsum)*DUCK_TYPES[k].cash;
  return c*valueMult();
}
function avgDuckFeath(){
  var z=zoneDef(),wsum=0,f=0,k;
  for(k in z.spawn) wsum+=z.spawn[k];
  for(k in z.spawn) f+=(z.spawn[k]/wsum)*DUCK_TYPES[k].feath;
  return f;
}

function startGame(cont){
  document.querySelectorAll(".screen").forEach(function(s){s.classList.remove("show");});
  $("s-game").classList.add("show");
  cv=$("gameCanvas"); cx=cv.getContext("2d");
  resizeCanvas(); seedStars(); seedClouds();
  bag=(cont&&S.bag)?S.bag.slice():[]; resetEntities();
  ammo=gunMag(); reloading=false; $("reloadTxt").style.display="none"; renderAmmo();
  setPanel("weapon"); updateHud(); startLoop();

  if(cont){
    var el=(Date.now()-(S.lastSave||Date.now()))/1000, rate=idleDucksPerSec();
    if(el>20 && rate>0){
      var capped=Math.min(el,8*3600);
      var n=Math.floor(capped*rate);
      if(n>0){
        var cash=Math.floor(n*avgDuckCash()), fe=Math.floor(n*avgDuckFeath());
        S.cash+=cash; S.feathers+=fe; S.lifetime+=n;
        $("offlineDesc").textContent="Your falcon and "+dogDef().name+" kept hunting while you were gone: "+
          fmt(n)+" ducks, sold for $"+fmt(cash)+(fe?" and "+fmt(fe)+" feathers":"")+".";
        $("v-offline").classList.add("show");
        updateHud();
      }
    }
  }
  var zi=ZONES.map(function(z){return z.id;}).indexOf(S.zone);
  meta.bestZone=Math.max(meta.bestZone,zi); saveMeta();
}
$("bContinue").onclick=function(){if(!loadState())return;startGame(true);};
$("bNewGame").onclick=function(){newState();startGame(false);};

window.addEventListener("resize",function(){if(running){resizeCanvas();}});
window.addEventListener("beforeunload",saveState);
document.addEventListener("visibilitychange",function(){if(document.hidden)saveState();});

(function bindCanvasOnce(){
  var c=$("gameCanvas");
  c.addEventListener("mousedown",onFire);
  c.addEventListener("touchstart",onFire,{passive:false});
  c.addEventListener("contextmenu",function(e){e.preventDefault();});
})();

function buildTitleBg(){
  var box=$("titleBg");
  for(var c=0;c<4;c++){
    var cl=document.createElement("div");cl.className="tcloud";
    var w=rnd(70,150);
    cl.style.cssText="width:"+w+"px;height:"+(w*.4)+"px;top:"+ri(4,60)+"%;left:"+ri(-10,90)+"%";
    box.appendChild(cl);
  }
  var svg='<svg viewBox="0 0 64 64" width="42" height="42">'+
    '<ellipse cx="34" cy="38" rx="20" ry="15" fill="#ffe985"/>'+
    '<circle cx="21" cy="23" r="13" fill="#ffe985"/>'+
    '<path d="M10 24 L2 21 L2 28 Z" fill="#ff9d1f"/></svg>';
  for(var d=0;d<3;d++){
    var dk=document.createElement("div");dk.className="tduck";
    dk.style.cssText="top:"+ri(15,75)+"%;left:0;animation-duration:"+ri(18,30)+"s;animation-delay:-"+ri(0,20)+"s";
    dk.innerHTML=svg; box.appendChild(dk);
  }
}
buildTitleBg();
loadMeta();
renderTitleStats();
})();
