name: Apply Futuristic Robot Theme
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: "!contains(github.event.head_commit.message, 'Apply Futuristic Robot Theme')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject theme assets and 2.0 changelog
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('pantry.html')
          s=p.read_text(encoding='utf-8-sig')
          if 'robot-theme.css' not in s:
              s=s.replace('</head>','<link rel="stylesheet" href="robot-theme.css"><script src="robot-theme.js"></script></head>',1)
          item='"ROBOTS VS ALIENS FULL VISUAL REWORK - replaced the old Pantry Panic brown visual identity with a bright blue/white futuristic command theme; rebuilt the title scene as a moon battlefield with moving robots, UFOs, laser fire and ground aliens; removed the old Pantry Panic wording from the visible UI; and gave every map a distinct sci-fi location identity such as Lunar Command, Xeno Jungle, Robot Foundry, Xeno Laboratory, Orbital Dock, Crystal Moon, Terraformer Yard, Scrap City, Bio Reactor, UFO Crash Site, Ice Relay, Alien Hive, Solar Array, Defense Ring, Alien Garden and Core Chamber. Each map now uses a dedicated landmark and themed environment instead of generic pantry props."'
          if 'ROBOTS VS ALIENS FULL VISUAL REWORK' not in s:
              m=re.search(r'(\{v:\\"2\\.0\\.0\\",d:\\"latest\\",items:\\[)',s)
              if m:
                  s=s[:m.end()]+'\n    '+item+','+s[m.end():]
              else:
                  m=re.search(r'(\{v:\"2\\.0\\.0\",[^\n]*items:\\[)',s)
                  if m:s=s[:m.end()]+'\n    '+item+','+s[m.end():]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('pantry.html').read_text(encoding='utf-8-sig')
          assert 'robot-theme.css' in s
          assert 'robot-theme.js' in s
          assert 'ROBOTS VS ALIENS FULL VISUAL REWORK' in s
          print('Robot theme injection verified')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-robot-theme.yml
          git add pantry.html robot-theme.css robot-theme.js
          git add -u .github/workflows/apply-robot-theme.yml
          git commit -m "Apply Futuristic Robot Theme"
          git push
