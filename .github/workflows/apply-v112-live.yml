name: Apply v1.11.2 live
on:
  push:
    branches: [main]
    paths:
      - 'conquest.html'
      - 'js/v112-flight-shipyard.js'
      - 'css/v112-flight-shipyard.css'
      - '.github/workflows/apply-v112-live.yml'
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !startsWith(github.event.head_commit.message, 'ci: apply v1.11.2') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire v1.11.2 into the live game
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('conquest.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="css/v112-flight-shipyard.css?v=1.11.2">'
          js='<script src="js/v112-flight-shipyard.js?v=1.11.2"></script>'
          if 'css/v112-flight-shipyard.css?v=1.11.2' not in s:
              s=s.replace('<!-- V1.11.2-LIVE -->','',1)
              s=s.replace('</head>', '\n'+css+'\n'+js+'\n<!-- V1.11.2-LIVE -->\n</head>', 1)
          extra='''<style id="v112-stability-fix">\n.bldItem.selected,.mchRecipe.selected,.bldDetail{animation:none!important;transition:none!important;}\n.bldItem:hover,.mchRecipe:hover{transform:none!important;}\n</style>'''
          if 'id="v112-stability-fix"' not in s:
              s=s.replace('</head>', extra+'\n</head>', 1)
          s=s.replace('1.11</span>', '1.11.2</span>')
          s=s.replace('1.11</div>', '1.11.2</div>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Record v1.11.2
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conquest.html
          git diff --cached --quiet || git commit -m 'ci: apply v1.11.2 live'
          git push
