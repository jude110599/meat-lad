name: Apply v1.11.2 live
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Wire v1.11.2 assets into conquest.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('conquest.html')
          s = p.read_text(encoding='utf-8')
          tags = '''\n<link rel="stylesheet" href="css/v112-flight-shipyard.css?v=1.11.2">\n<script src="js/v112-flight-shipyard.js?v=1.11.2"></script>\n<!-- V1.11.2-LIVE -->\n'''
          if 'V1.11.2-LIVE' not in s:
              if '</head>' not in s:
                  raise SystemExit('conquest.html has no </head> tag')
              s = s.replace('</head>', tags + '</head>', 1)
          extra = '''<style id="v112-stability-fix">.bldItem.selected,.mchRecipe.selected,.bldDetail{animation:none!important;transition:none!important}.bldItem:hover,.mchRecipe:hover{transform:none!important}</style>'''
          if 'v112-stability-fix' not in s:
              s = s.replace('</head>', extra + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit live patch if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conquest.html
          if git diff --cached --quiet; then
            echo 'v1.11.2 already wired'
            exit 0
          fi
          git commit -m 'ci: apply v1.11.2'
          git push
