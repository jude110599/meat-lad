name: Apply Robots vs Aliens Rework
on:
  push:
    paths:
      - '.github/workflows/apply-robot-alien-theme.yml'
permissions:
  contents: write
jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply UI theme, alien models, and changelog
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('pantry.html')
          s = p.read_text(encoding='utf-8-sig')

          # Robot-vs-alien visual language: deep space panels, cyan robot accents,
          # magenta alien accents, with the existing readable layout preserved.
          old_root = '''  --bg:#1a1410; --bg2:#241c15; --bg3:#31261a; --bg4:#3e3122;
  --line:#4a3b28;
  --honey:#e8a838; --honey2:#f7c463; --jam:#c4442e; --jam2:#e05a3f;
  --mint:#6fbf8f; --txt:#f0e4d0; --dim:#9b8a70;
  --gold:#f0c14b; --danger:#c4442e;'''
          new_root = '''  --bg:#080d16; --bg2:#101827; --bg3:#172338; --bg4:#22324b;
  --line:#2e4764;
  --honey:#39d5ff; --honey2:#8cecff; --jam:#d94cff; --jam2:#ff72e8;
  --mint:#62f2c2; --txt:#e9f5ff; --dim:#7f98b3;
  --gold:#6ee7ff; --danger:#ff4f7b;'''
          if old_root in s:
              s = s.replace(old_root, new_root, 1)

          # Remove the remaining brown/pantry-specific UI chrome and replace it
          # with cool metal, hologram and alien-energy accents.
          replacements = {
            'background:#15100c;':'background:#070c14;',
            'rgba(20,15,10,.93)':'rgba(7,13,23,.96)',
            'rgba(20,15,10,.95)':'rgba(7,13,23,.97)',
            'rgba(20,15,10,.82)':'rgba(9,17,29,.94)',
            'rgba(38,29,19,.92)':'rgba(15,28,46,.94)',
            'rgba(18,13,9,.88)':'rgba(5,12,22,.92)',
            '#141019':'#0a1422',
            '#241708':'#06131d',
            '#7a5215':'#147a9b',
            '#6b1e12':'#6e1a79',
            '#6d5f4a':'#58728e',
            '#5a4a30':'#29405b',
            '#3a2c1c':'#1e3855',
            '#191309':'#091321',
            '#e8dcc4':'#a8dfff',
          }
          for a,b in replacements.items():
              s = s.replace(a,b)

          # User-facing terminology for the new theme.
          text_replacements = {
            '>Bugs<':'>Aliens<',
            '>bugs<':'>aliens<',
            'Bugs and waves are run by whoever made it.':'Aliens and waves are run by whoever made it.',
            'The bugs are waiting patiently.':'The aliens are waiting patiently.',
            'bugs are racing for it':'aliens are racing for it',
            'bugs pop':'aliens pop',
            'bug health':'alien health',
            'bug speed':'alien speed',
            'bug':'alien',
            'Bug':'Alien',
          }
          # Do the broad terms only in HTML/text portions outside script-sensitive
          # identifiers. This intentionally avoids renaming internal JS keys.
          for a,b in list(text_replacements.items())[:4]:
              s = s.replace(a,b)

          # Main title and labels.
          s = s.replace('The invasion found Earth. Hold the line.', 'Earth is under attack. Deploy the robots. Hold the line.')
          s = s.replace('Pick a larder', 'Pick a battlefield')
          s = s.replace('Larder', 'Battlefield')
          s = s.replace('larder', 'battlefield')
          s = s.replace('Into the pantry', 'Deploy to battlefield')
          s = s.replace('Make a pantry', 'Create a command room')
          s = s.replace('Give up the pantry', 'Abandon battlefield')
          s = s.replace('Skill pantry', 'Robot Command')
          s = s.replace('Preserve Jars', 'Command Cores')
          s = s.replace('crumbs', 'credits')
          s = s.replace('Crumbs', 'Credits')

          # Replace the old insect art function wholesale with 14 distinct alien
          # silhouettes. The signature stays identical so all existing gameplay,
          # hit effects, death animations, almanac icons, and bosses keep working.
          alien_fn = r'''function drawBugArt(c,kind,t,r,wob){
  var B=BUGS[kind],col=B.col; wob=wob||0;
  var pulse=.5+.5*Math.sin(t*4+wob), k=kind;
  var dark="#07101d", metal="#16283d", edge="#8beaff", glow=col;
  function glowDot(x,y,rr){
    var g=c.createRadialGradient(x,y,0,x,y,rr*2.8);
    g.addColorStop(0,hexRgb(col).map?"rgba(80,220,255,.45)":"rgba(80,220,255,.45)");
    g.addColorStop(1,"rgba(0,0,0,0)"); c.fillStyle=g; c.beginPath(); c.arc(x,y,rr*2.8,0,6.283); c.fill();
  }
  function eye(x,y,rr){ c.fillStyle="#07101d"; c.beginPath(); c.arc(x,y,rr,0,6.283); c.fill(); c.fillStyle=edge; c.globalAlpha=.65+.35*pulse; c.beginPath(); c.arc(x,y,rr*.48,0,6.283); c.fill(); c.globalAlpha=1; }
  function limb(x1,y1,x2,y2,w){ c.strokeStyle=metal; c.lineWidth=w; c.lineCap="round"; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); c.strokeStyle=col; c.lineWidth=Math.max(1,w*.35); c.stroke(); }
  glowDot(0,0,r);
  c.save(); c.scale(r/12,r/12);
  if(k==="ant"){
    c.fillStyle=metal; c.strokeStyle=edge; c.lineWidth=1.2; c.beginPath(); c.roundRect(-7,-7,14,14,4); c.fill(); c.stroke();
    eye(-3,-1.5,1.5); eye(3,-1.5,1.5); limb(-5,5,-8,9,2); limb(5,5,8,9,2);
    c.fillStyle=col; c.beginPath(); c.arc(0,4,2.2,0,6.283); c.fill();
  } else if(k==="fly"){
    c.fillStyle=metal; c.strokeStyle=edge; c.beginPath(); c.ellipse(0,0,8,4.5,0,0,6.283); c.fill(); c.stroke();
    c.fillStyle=col; c.globalAlpha=.35; c.beginPath(); c.ellipse(-8,-5,8,3,0,0,6.283); c.ellipse(8,-5,8,3,0,0,6.283); c.fill(); c.globalAlpha=1; eye(0,0,2);
  } else if(k==="silverfish"){
    c.fillStyle=metal; c.strokeStyle=col; c.lineWidth=1.5; c.beginPath(); c.moveTo(-10,0); c.lineTo(-5,-5); c.lineTo(4,-4); c.lineTo(10,0); c.lineTo(4,4); c.lineTo(-5,5); c.closePath(); c.fill(); c.stroke();
    limb(-7,2,-11,6,1.6); limb(7,2,11,6,1.6); eye(4,-1.5,1.6);
  } else if(k==="beetle"){
    c.fillStyle=metal; c.strokeStyle=col; c.lineWidth=1.8; c.beginPath(); c.ellipse(0,1,9,7,0,0,6.283); c.fill(); c.stroke();
    c.strokeStyle=edge; c.lineWidth=1; c.beginPath(); c.moveTo(0,-6); c.lineTo(0,7); c.stroke(); eye(-3,-1,1.3); eye(3,-1,1.3); limb(-6,4,-10,8,1.6); limb(6,4,10,8,1.6);
  } else if(k==="moth"){
    c.fillStyle=metal; c.strokeStyle=col; c.lineWidth=1.2; c.beginPath(); c.ellipse(-5,-2,8,6,-.35,0,6.283); c.ellipse(5,-2,8,6,.35,0,6.283); c.fill(); c.stroke(); c.fillStyle=dark; c.beginPath(); c.roundRect(-2,-6,4,12,2); c.fill(); eye(0,-3,1.4);
  } else if(k==="roach"){
    c.fillStyle=metal; c.strokeStyle=edge; c.lineWidth=1.6; c.beginPath(); c.roundRect(-9,-7,18,14,5); c.fill(); c.stroke(); c.fillStyle="rgba(98,242,194,.16)"; c.fillRect(-7,-5,14,10); eye(-3,-1,1.3); eye(3,-1,1.3);
    c.strokeStyle=col; c.lineWidth=2; c.beginPath(); c.arc(0,0,10,0,6.283); c.stroke();
  } else if(k==="spider"){
    c.fillStyle=metal; c.strokeStyle=col; c.lineWidth=1.4; c.beginPath(); c.arc(0,0,5,0,6.283); c.fill(); c.stroke();
    for(var i=0;i<4;i++){ var a=-1.15+i*.75; limb(-3,2,-10+Math.cos(a)*2,7+Math.sin(a)*2,1.4); limb(3,2,10-Math.cos(a)*2,7+Math.sin(a)*2,1.4); }
    eye(-1.7,-1,1); eye(1.7,-1,1);
  } else if(k==="weevil"){
    c.fillStyle=metal; c.strokeStyle=col; c.lineWidth=1.8; c.beginPath(); c.roundRect(-10,-7,20,14,5); c.fill(); c.stroke();
    c.fillStyle=dark; c.beginPath(); c.moveTo(5,-2); c.lineTo(13,0); c.lineTo(5,2); c.closePath(); c.fill(); eye(-4,-2,1.4); eye(0,-2,1.4); c.strokeStyle=edge; c.beginPath(); c.moveTo(-6,6); c.lineTo(6,6); c.stroke();
  } else if(k==="wasp"){
    c.fillStyle=metal; c.strokeStyle="#20e6ff"; c.lineWidth=1.5; c.beginPath(); c.ellipse(0,0,6,9,0,0,6.283); c.fill(); c.stroke();
    c.strokeStyle=col; c.lineWidth=3; c.beginPath(); c.moveTo(-4,-5); c.lineTo(4,-5); c.moveTo(-5,0); c.lineTo(5,0); c.moveTo(-4,5); c.lineTo(4,5); c.stroke();
    c.fillStyle="#72f4ff"; c.globalAlpha=.35; c.beginPath(); c.ellipse(-8,-4,6,3,0,0,6.283); c.ellipse(8,-4,6,3,0,0,6.283); c.fill(); c.globalAlpha=1; eye(0,-2,1.6);
  } else if(k==="hornet"){
    c.fillStyle=metal; c.strokeStyle=col; c.lineWidth=1.6; c.beginPath(); c.moveTo(0,-10); c.lineTo(8,0); c.lineTo(0,10); c.lineTo(-8,0); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle="#62f2c2"; c.lineWidth=2; c.beginPath(); c.arc(0,0,6+Math.sin(t*5+wob)*1.2,0,6.283); c.stroke(); eye(0,0,2);
  } else if(k==="king"){
    c.fillStyle=metal; c.strokeStyle="#55e6ff"; c.lineWidth=2; c.beginPath(); c.ellipse(0,2,18,9,0,0,6.283); c.fill(); c.stroke();
    c.fillStyle="#16283d"; c.beginPath(); c.arc(0,-4,7,Math.PI,0); c.fill(); eye(0,-4,3); c.strokeStyle=col; c.lineWidth=2; c.beginPath(); c.arc(0,2,12,0,Math.PI); c.stroke();
    c.fillStyle="#6ee7ff"; for(var q=0;q<5;q++){ var ax=-10+q*5; c.beginPath(); c.arc(ax,10,1.5,0,6.283); c.fill(); }
  } else if(k==="queen"){
    c.fillStyle=metal; c.strokeStyle="#ff72e8"; c.lineWidth=2; c.beginPath(); c.ellipse(0,0,15,18,0,0,6.283); c.fill(); c.stroke();
    c.strokeStyle=col; c.lineWidth=2; c.beginPath(); c.arc(0,0,11,0,6.283); c.stroke(); eye(-4,-4,2.4); eye(4,-4,2.4); c.fillStyle="#ff72e8"; c.beginPath(); c.moveTo(-9,-14); c.lineTo(-3,-22); c.lineTo(0,-14); c.lineTo(3,-22); c.lineTo(9,-14); c.closePath(); c.fill();
  } else if(k==="behemoth"){
    c.fillStyle=metal; c.strokeStyle="#8beaff"; c.lineWidth=2; c.beginPath(); c.roundRect(-19,-13,38,26,8); c.fill(); c.stroke();
    c.fillStyle="#0b1828"; c.fillRect(-10,-7,20,14); eye(-5,0,2); eye(5,0,2); c.strokeStyle=col; c.lineWidth=3; c.beginPath(); c.moveTo(-14,-12); c.lineTo(-20,-20); c.moveTo(14,-12); c.lineTo(20,-20); c.stroke();
  } else if(k==="widow"){
    c.fillStyle=metal; c.strokeStyle="#d94cff"; c.lineWidth=2; c.beginPath(); c.ellipse(0,0,20,12,0,0,6.283); c.fill(); c.stroke();
    c.strokeStyle="#6ee7ff"; c.lineWidth=2; c.beginPath(); c.arc(0,0,15+Math.sin(t*3)*1.5,0,6.283); c.stroke();
    for(var z=0;z<6;z++){ var aa=z*Math.PI/3; limb(Math.cos(aa)*10,Math.sin(aa)*7,Math.cos(aa)*25,Math.sin(aa)*17,1.6); }
    eye(0,0,3.5);
  }
  c.restore();
}

/* ═════════════ TOWER ART ═════════════ */'''
          pattern = re.compile(r'function drawBugArt\(c,kind,t,r,wob\)\{.*?\n\}\n\n/\* ═════════════ TOWER ART ═════════════ \*/', re.S)
          s, n = pattern.subn(alien_fn, s, count=1)
          if n != 1:
              raise SystemExit('Could not locate drawBugArt for replacement')

          # Add a subtle robot-vs-alien HUD header treatment.
          hud_css = '''
/* ROBOTS VS ALIENS HUD THEME */
#hud:before{content:"ROBOT COMMAND // ALIEN INCURSION";position:absolute;left:10px;top:2px;font-size:8px;letter-spacing:.18em;color:#55e6ff;opacity:.65;pointer-events:none}
#shop{box-shadow:-8px 0 28px rgba(0,0,0,.28),inset 1px 0 0 rgba(98,242,194,.08)}
#shop:before{content:"ROBOT DEPLOYMENT";display:block;color:#62f2c2;font-size:9px;letter-spacing:.16em;font-weight:900;padding:0 2px 7px;border-bottom:1px solid #2e4764;margin-bottom:7px}
#panel{box-shadow:0 -8px 28px rgba(0,0,0,.25),inset 0 1px 0 rgba(57,213,255,.08)}
.pill.cash{color:#62f2c2}.pill.life{color:#ff72e8}.pill.wave{color:#55e6ff}
'''
          s = s.replace('</style>', hud_css + '</style>', 1)

          # Changelog: append this work under the existing 2.0.0 entry.
          marker = 'var CHANGELOG=[\n  {v:"2.0.0",d:"latest",items:['
          add = '"NEW ROBOTS VS ALIENS VISUAL REWORK - the entire UI now uses a futuristic robot-command theme with deep space-metal panels, cyan robot accents and magenta alien energy while preserving the existing layout and readability. The right-side deployment menu is styled as a persistent Robot Deployment console.",\n    "NEW ALIEN ENEMY MODELS - all 14 alien types now have distinct silhouettes and mechanical-organic designs instead of looking like recoloured bugs: grunt drones, flying saucers, runners, splitters, shield units, cloaked spiders, armored rammers, EMP flyers, regenerators and four unique boss silhouettes. Each keeps its existing internal id and gameplay behaviour, so saves and balance are preserved.",\n    "ALIEN READABILITY PASS - enemy models now communicate their role through silhouette, size, glow and animation-friendly geometry, making Fast, Flying, Armored, Shield, EMP, Regenerating, Cloaked and Boss aliens easier to identify at a glance."'
          if marker in s:
              s = s.replace(marker, marker + '\n    ' + add, 1)
          else:
              raise SystemExit('Could not locate 2.0.0 changelog entry')

          p.write_text(s, encoding='utf-8')

      - name: Commit generated changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/apply-robot-alien-theme.yml
          git add pantry.html .github/workflows/apply-robot-alien-theme.yml
          git commit -m "feat: rework Robots vs Aliens UI and alien models" || exit 0
          git push
