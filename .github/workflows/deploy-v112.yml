name: Deploy v1.11.2 patch
on:
  push:
    paths:
      - 'scripts/apply-v112.py'
      - 'js/v112-flight-shipyard.js'
      - 'css/v112-flight-shipyard.css'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/apply-v112.py
      - name: Commit patched game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conquest.html
          git diff --cached --quiet && exit 0
          git commit -m 'release: wire v1.11.2 into conquest game'
          git push
