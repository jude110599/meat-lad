name: v1.11.2 Live Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-version:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - name: Patch live version and load v1.11.2 assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('conquest.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('v1.11.0', 'v1.11.2')
          s = s.replace('v1.11', 'v1.11.2')
          if 'css/v112-flight-shipyard.css' not in s:
              s = s.replace('</head>', '  <link rel="stylesheet" href="css/v112-flight-shipyard.css">\n  <script src="js/v112-flight-shipyard.js"></script>\n</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit live fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add conquest.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: make v1.11.2 visible in live Conquest build'
          git push
