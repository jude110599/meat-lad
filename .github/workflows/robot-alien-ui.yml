name: Apply Robots vs Aliens UI Rework
on:
  push:
    paths:
      - '.github/workflows/robot-alien-ui.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rework UI, alien models, and 2.0 changelog
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('pantry.html')
          s = path.read_text(encoding='utf-8-sig')

          # Futuristic robot-command palette while preserving the existing UI layout.
          s = s.replace('<meta name="theme-color" content="#1a1410">', '<meta name="theme-color" content="#07111f">')
          old = '''  --bg:#1a1410; --bg2:#241c15; --bg3:#31261a; --bg4:#3e3122;\n  --line:#4a3b28;\n  --honey:#e8a838; --honey2:#f7c463; --jam:#c4442e; --jam2:#e05a3f;\n  --mint:#6fbf8f; --txt:#f0e4d0; --dim:#9b8a70;\n  --gold:#f0c14b; --danger:#c4442e;'''
          new = '''  --bg:#07111f; --bg2:#0d1b2d; --bg3:#14263d; --bg4:#1d3652;\n  --line:#2b4968;\n  --honey:#35d8ff; --honey2:#8cecff; --jam:#d84cff; --jam2:#ff72e8;\n  --mint:#5ff0c0; --txt:#e8f6ff; --dim:#7894af;\n  --gold:#66e7ff; --danger:#ff527e;'''
          if old not in s:
              raise SystemExit('UI theme variables were not found')
          s = s.replace(old, new, 1)

          for a,b in {
              '#15100c':'#050b14', '#141019':'#081321', '#241708':'#091827',
              '#7a5215':'#117e9b', '#6b1e12':'#7c1d83', '#6d5f4a':'#56728e',
              '#5a4a30':'#294966', '#3a2c1c':'#1b3550', '#191309':'#071321',
              '#e8dcc4':'#b9eaff', 'rgba(20,15,10,.93)':'rgba(5,13,25,.96)',
              'rgba(20,15,10,.95)':'rgba(5,13,25,.97)', 'rgba(20,15,10,.82)':'rgba(7,17,30,.94)',
              'rgba(38,29,19,.92)':'rgba(12,29,47,.95)', 'rgba(18,13,9,.88)':'rgba(4,10,20,.94)'
          }.items():
              s = s.replace(a,b)

          # Add the visual language without disturbing gameplay positioning.
          css = r'''
/* ===== ROBOTS VS ALIENS COMMAND UI ===== */
body{background:radial-gradient(circle at 35% 15%,#122943 0%,#07111f 48%,#030811 100%)}
.screen{background:radial-gradient(circle at 50% 0%,rgba(38,104,145,.10),transparent 42%),var(--bg)}
#cv{background:#050b14}
#shop{background:linear-gradient(180deg,rgba(7,18,32,.98),rgba(3,10,20,.98));border-left:1px solid #2b617e;box-shadow:-12px 0 35px rgba(0,0,0,.32),inset 1px 0 0 rgba(53,216,255,.10)}
#shop:before{content:"ROBOT DEPLOYMENT";display:block;color:#5ff0c0;font-size:9px;letter-spacing:.18em;font-weight:900;padding:0 2px 8px;border-bottom:1px solid #2b4968;margin-bottom:8px}
#hud{background:linear-gradient(rgba(4,13,25,.96),rgba(4,13,25,0));}
.pill{background:linear-gradient(160deg,rgba(14,35,55,.96),rgba(5,13,25,.94));border-color:#2b4968;box-shadow:0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(130,230,255,.08)}
.pill.cash{color:#66e7ff;border-color:rgba(53,216,255,.45)}
.pill.life{color:#ff72e8;border-color:rgba(255,114,232,.45)}
.pill.wave{color:#5ff0c0;border-color:rgba(95,240,192,.45)}
.hbtn{background:rgba(7,17,30,.92);border-color:#2b4968}
.hbtn.go{border-color:#5ff0c0;color:#5ff0c0}
.hbtn.go.fast{background:#5ff0c0;color:#061b16}
.stab.sel,.tcard.sel{border-color:#35d8ff;background:#142b43}
.tcard:hover,.card:hover,.btn:hover{box-shadow:0 0 18px rgba(53,216,255,.10)}
.logo{color:#35d8ff;text-shadow:0 3px 0 #0b6079}
.logo span{color:#d84cff;text-shadow:0 3px 0 #68126d}
.mainbtn.play{border-bottom-color:#35d8ff;color:#8cecff}
.mainbtn.coop{border-bottom-color:#5ff0c0;color:#9dffe0}
.mainbtn.hero{border-bottom-color:#d84cff;color:#edb4ff}
.homebtn:hover{border-color:#35d8ff;box-shadow:0 4px 18px rgba(53,216,255,.25)}
.btn{border-left-color:#35d8ff}
.card.sel{border-left-color:#35d8ff;box-shadow:0 0 0 1px #8cecff,0 4px 18px rgba(53,216,255,.18)}
.ver{color:#56728e}
.robot-scanline{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(70,220,255,.018) 0,rgba(70,220,255,.018) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}
'''
          s = s.replace('</style>', css + '</style>', 1)

          # Replace the old generic insect drawing with distinct alien silhouettes.
          # Internal enemy ids and gameplay stats remain untouched.
          alien_fn = r'''/* ═════════════ ALIEN ART ═════════════ */
function drawBugArt(c,kind,t,r,wob){
  var B=BUGS[kind], col=(B&&B.col)||"#6ee7ff";
  wob=wob||0;
  var keys=Object.keys(BUGS||{}), idx=Math.max(0,keys.indexOf(kind)), pulse=.65+.35*Math.sin(t*4+wob);
  var dark="#06101d", metal="#152b43", cyan="#62edff", pink="#ef63ff";
  c.save(); c.translate(0,Math.sin(t*3+wob)*.7); c.scale(r/12,r/12);
  function eye(x,y,rr){c.fillStyle="#020812";c.beginPath();c.arc(x,y,rr,0,6.283);c.fill();c.fillStyle=cyan;c.globalAlpha=pulse;c.beginPath();c.arc(x,y,rr*.45,0,6.283);c.fill();c.globalAlpha=1}
  function limb(a,b,d,e,w){c.strokeStyle=metal;c.lineWidth=w;c.lineCap="round";c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke();c.strokeStyle=col;c.lineWidth=Math.max(1,w*.3);c.stroke()}
  c.shadowColor=col;c.shadowBlur=7;c.fillStyle=metal;c.strokeStyle=col;c.lineWidth=1.5;
  var type=idx%14;
  if(type===0){c.beginPath();c.roundRect(-8,-7,16,14,4);c.fill();c.stroke();eye(-3,-1,1.7);eye(3,-1,1.7);limb(-5,5,-10,9,2);limb(5,5,10,9,2)}
  else if(type===1){c.beginPath();c.ellipse(0,1,9,5,0,0,6.283);c.fill();c.stroke();c.fillStyle="rgba(98,237,255,.18)";c.beginPath();c.ellipse(-8,-5,7,3,0,0,6.283);c.ellipse(8,-5,7,3,0,0,6.283);c.fill();eye(0,0,2)}
  else if(type===2){c.beginPath();c.moveTo(-10,0);c.lineTo(-4,-7);c.lineTo(5,-5);c.lineTo(10,0);c.lineTo(5,5);c.lineTo(-4,7);c.closePath();c.fill();c.stroke();eye(4,-1,1.8);limb(-6,3,-12,8,1.6);limb(6,3,12,8,1.6)}
  else if(type===3){c.beginPath();c.ellipse(0,1,9,7,0,0,6.283);c.fill();c.stroke();c.strokeStyle=cyan;c.beginPath();c.moveTo(0,-6);c.lineTo(0,7);c.stroke();eye(-3,-1,1.3);eye(3,-1,1.3);limb(-6,4,-11,9,1.5);limb(6,4,11,9,1.5)}
  else if(type===4){c.beginPath();c.moveTo(-11,5);c.lineTo(-6,-8);c.lineTo(0,-11);c.lineTo(6,-8);c.lineTo(11,5);c.lineTo(0,9);c.closePath();c.fill();c.stroke();eye(0,-2,2.2);c.strokeStyle=pink;c.beginPath();c.arc(0,0,7,0,6.283);c.stroke()}
  else if(type===5){c.beginPath();c.ellipse(0,0,7,10,0,0,6.283);c.fill();c.stroke();for(var q=-5;q<=5;q+=5){c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.moveTo(q,-4);c.lineTo(q+2,5);c.stroke()}eye(0,-3,1.7);limb(-5,5,-9,10,1.5);limb(5,5,9,10,1.5)}
  else if(type===6){c.beginPath();c.roundRect(-10,-7,20,14,5);c.fill();c.stroke();c.fillStyle="rgba(95,240,192,.16)";c.fillRect(-7,-4,14,8);eye(-3,-1,1.4);eye(3,-1,1.4);c.strokeStyle=cyan;c.beginPath();c.arc(0,0,11,0,6.283);c.stroke()}
  else if(type===7){c.beginPath();c.arc(0,0,6,0,6.283);c.fill();c.stroke();for(var i=0;i<4;i++){var a=-1.2+i*.8;limb(-3,2,-11+Math.cos(a)*2,8+Math.sin(a)*2,1.4);limb(3,2,11-Math.cos(a)*2,8+Math.sin(a)*2,1.4)}eye(-2,-1,1);eye(2,-1,1)}
  else if(type===8){c.beginPath();c.roundRect(-10,-6,20,12,4);c.fill();c.stroke();c.beginPath();c.moveTo(6,-2);c.lineTo(14,0);c.lineTo(6,2);c.stroke();eye(-4,-2,1.5);eye(0,-2,1.5);c.strokeStyle=pink;c.beginPath();c.moveTo(-6,6);c.lineTo(6,6);c.stroke()}
  else if(type===9){c.beginPath();c.moveTo(0,-11);c.lineTo(8,0);c.lineTo(0,11);c.lineTo(-8,0);c.closePath();c.fill();c.stroke();c.strokeStyle=cyan;c.beginPath();c.arc(0,0,6+Math.sin(t*5)*1.2,0,6.283);c.stroke();eye(0,0,2)}
  else if(type===10){c.beginPath();c.ellipse(0,3,17,8,0,0,6.283);c.fill();c.stroke();c.fillStyle=dark;c.beginPath();c.arc(0,-4,7,Math.PI,0);c.fill();eye(0,-4,3);c.strokeStyle=col;c.lineWidth=2;c.beginPath();c.arc(0,3,11,0,Math.PI);c.stroke()}
  else if(type===11){c.beginPath();c.ellipse(0,0,14,17,0,0,6.283);c.fill();c.stroke();eye(-4,-4,2.3);eye(4,-4,2.3);c.fillStyle=pink;c.beginPath();c.moveTo(-9,-13);c.lineTo(-3,-21);c.lineTo(0,-13);c.lineTo(3,-21);c.lineTo(9,-13);c.closePath();c.fill()}
  else if(type===12){c.beginPath();c.roundRect(-19,-13,38,26,8);c.fill();c.stroke();c.fillStyle=dark;c.fillRect(-10,-7,20,14);eye(-5,0,2);eye(5,0,2);c.strokeStyle=col;c.lineWidth=3;c.beginPath();c.moveTo(-14,-12);c.lineTo(-20,-20);c.moveTo(14,-12);c.lineTo(20,-20);c.stroke()}
  else{c.beginPath();c.ellipse(0,0,20,12,0,0,6.283);c.fill();c.stroke();c.strokeStyle=pink;c.lineWidth=2;c.beginPath();c.arc(0,0,15+Math.sin(t*3)*1.5,0,6.283);c.stroke();for(var z=0;z<6;z++){var aa=z*Math.PI/3;limb(Math.cos(aa)*10,Math.sin(aa)*7,Math.cos(aa)*25,Math.sin(aa)*17,1.6)}eye(0,0,3.5)}
  c.shadowBlur=0;c.restore();
}

/* ═════════════ TOWER ART ═════════════ */'''
          pattern = re.compile(r'/\* ═════════════ BUG ART ═════════════ \*/.*?/\* ═════════════ TOWER ART ═════════════ \*/', re.S)
          s,n=pattern.subn(alien_fn,s,count=1)
          if n!=1:
              raise SystemExit('Alien art section was not found')

          # Add a small non-interactive HUD scanline overlay if the main wrapper exists.
          if 'class="robot-scanline"' not in s:
              s=s.replace('<div id="wrap">','<div id="wrap"><div class="robot-scanline"></div>',1)

          # Add the visual/model work to the existing 2.0 changelog without replacing prior notes.
          entry='    "UI + ENEMY VISUAL REWORK - the 2.0 Robots vs Aliens theme is now applied across the game UI with a futuristic robot-command palette, cyan robot energy, magenta alien energy, metallic panels, clearer HUD hierarchy and a persistent right-side Robot Deployment shop. Enemy art is also fully redesigned: the 14 enemy slots now use distinct alien silhouettes (drones, flyers, armored creatures, spiders, crystal forms and boss-scale saucers/monsters) instead of generic bug bodies. Internal enemy ids, stats and save compatibility are preserved."\n'
          marker=re.search(r'(\{v:"2\.0\.0",d:"latest",items:\[\n)',s)
          if not marker:
              raise SystemExit('2.0 changelog entry was not found')
          if 'UI + ENEMY VISUAL REWORK' not in s:
              pos=marker.end();s=s[:pos]+entry+s[pos:]

          path.write_text(s,encoding='utf-8')

      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/robot-alien-ui.yml
          git add pantry.html
          git add -u .github/workflows/robot-alien-ui.yml
          git commit -m "feat: apply Robots vs Aliens UI and alien enemy rework"
          git push
