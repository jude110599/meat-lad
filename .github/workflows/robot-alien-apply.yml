name: Apply Robots vs Aliens Rework
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Robots vs Aliens Rework') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply changes
        run: python3 .github/robot_alien_rework.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/robot_alien_rework.py .github/workflows/robot-alien-apply.yml
          git add pantry.html
          git add -u .github/robot_alien_rework.py .github/workflows/robot-alien-apply.yml
          git commit -m "feat: Apply Robots vs Aliens Rework"
          git push
