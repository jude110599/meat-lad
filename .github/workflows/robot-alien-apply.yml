name: Apply Robots vs Aliens Rework
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Robots vs Aliens Rework') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rework pantry game
        run: python3 .github/robot_alien_rework.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pantry.html
          git commit -m "feat: Apply Robots vs Aliens Rework"
          git push
