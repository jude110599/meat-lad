name: Apply Robots vs Aliens Rework
on: [push]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, 'Apply Robots vs Aliens Rework') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rework pantry game
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('pantry.html')
          s=p.read_text(encoding='utf-8-sig')
          s=s.replace('#1a1410','#07111f').replace('#241c15','#0d1b2d').replace('#31261a','#14263d').replace('#3e3122','#1d3652')
          s=s.replace('#4a3b28','#2b4968').replace('#e8a838','#35d8ff').replace('#f7c463','#8cecff').replace('#c4442e','#d84cff').replace('#e05a3f','#ff72e8').replace('#6fbf8f','#5ff0c0').replace('#f0e4d0','#e8f6ff').replace('#9b8a70','#7894af').replace('#f0c14b','#66e7ff')
          s=s.replace('#7a5215','#11627d').replace('#6b1e12','#68126d').replace('#15100c','#050b14').replace('rgba(20,15,10,.93)','rgba(5,13,25,.97)').replace('rgba(20,15,10,.95)','rgba(5,13,25,.98)').replace('rgba(20,15,10,.82)','rgba(7,17,30,.94)').replace('rgba(38,29,19,.92)','rgba(12,29,47,.95)').replace('rgba(18,13,9,.88)','rgba(4,10,20,.94)')
          css='''\n/* ROBOTS VS ALIENS UI */\nbody{background:radial-gradient(circle at 40% 10%,#122943,#07111f 55%,#030811)}\n#shop{background:linear-gradient(180deg,rgba(7,18,32,.99),rgba(3,10,20,.99));border-left-color:#2b617e;box-shadow:-12px 0 35px rgba(0,0,0,.35),inset 1px 0 rgba(53,216,255,.12)}\n#shop:before{content:"ROBOT DEPLOYMENT";display:block;color:#5ff0c0;font-size:9px;letter-spacing:.18em;font-weight:900;padding:0 2px 8px;border-bottom:1px solid #2b4968;margin-bottom:8px}\n#hud{background:linear-gradient(rgba(4,13,25,.97),rgba(4,13,25,0))}\n.pill{background:linear-gradient(160deg,rgba(12,29,47,.96),rgba(4,10,20,.94));border-color:#2b4968}\n.pill.cash{color:#66e7ff;border-color:rgba(53,216,255,.45)}.pill.life{color:#ff72e8;border-color:rgba(255,114,232,.45)}.pill.wave{color:#5ff0c0;border-color:rgba(95,240,192,.45)}\n.hbtn.go{border-color:#5ff0c0;color:#5ff0c0}.hbtn.go.fast{background:#5ff0c0;color:#061b16}\n.tcard.sel,.stab.sel{border-color:#35d8ff;background:#142b43}.btn{border-left-color:#35d8ff}.card.sel{border-left-color:#35d8ff;box-shadow:0 0 0 1px #8cecff,0 4px 14px rgba(53,216,255,.18)}\n.logo{color:#35d8ff;text-shadow:0 3px 0 #11627d}.logo span{color:#d84cff;text-shadow:0 3px 0 #68126d}\n.robot-scanline{position:absolute;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,rgba(70,220,255,.018) 0,rgba(70,220,255,.018) 1px,transparent 1px,transparent 4px);mix-blend-mode:screen}\n'''
          s=s.replace('</style>',css+'</style>',1)
          alien=r'''function drawBugArt(c,kind,t,r,wob){
            var B=BUGS[kind]||{},col=B.col||"#62edff",idx=Math.max(0,Object.keys(BUGS).indexOf(kind)),type=idx%8,p=.65+.35*Math.sin(t*4+(wob||0));
            var M="#142b43",C="#62edff",P="#ef63ff"; c.save(); c.translate(0,Math.sin(t*3+(wob||0))*.6); c.scale(r/12,r/12); c.shadowColor=col;c.shadowBlur=7;
            function eye(x,y,z){c.fillStyle="#020812";c.beginPath();c.arc(x,y,z,0,6.283);c.fill();c.fillStyle=C;c.globalAlpha=p;c.beginPath();c.arc(x,y,z*.45,0,6.283);c.fill();c.globalAlpha=1}
            function limb(a,b,d,e,w){c.strokeStyle=M;c.lineWidth=w;c.lineCap="round";c.beginPath();c.moveTo(a,b);c.lineTo(d,e);c.stroke();c.strokeStyle=col;c.lineWidth=Math.max(1,w*.3);c.stroke()}
            c.fillStyle=M;c.strokeStyle=col;c.lineWidth=1.6;
            if(type===0){c.beginPath();c.roundRect(-8,-7,16,14,4);c.fill();c.stroke();eye(-3,-1,1.7);eye(3,-1,1.7);limb(-5,5,-10,9,2);limb(5,5,10,9,2)}
            else if(type===1){c.beginPath();c.ellipse(0,1,10,5,0,0,6.283);c.fill();c.stroke();c.fillStyle="rgba(98,237,255,.18)";c.beginPath();c.ellipse(-9,-5,7,3,0,0,6.283);c.ellipse(9,-5,7,3,0,0,6.283);c.fill();eye(0,0,2)}
            else if(type===2){c.beginPath();c.moveTo(-10,0);c.lineTo(-4,-7);c.lineTo(5,-5);c.lineTo(10,0);c.lineTo(5,5);c.lineTo(-4,7);c.closePath();c.fill();c.stroke();eye(4,-1,1.8);limb(-6,3,-12,8,1.6);limb(6,3,12,8,1.6)}
            else if(type===3){c.beginPath();c.ellipse(0,1,9,7,0,0,6.283);c.fill();c.stroke();c.strokeStyle=C;c.beginPath();c.moveTo(0,-6);c.lineTo(0,7);c.stroke();eye(-3,-1,1.3);eye(3,-1,1.3);limb(-6,4,-11,9,1.5);limb(6,4,11,9,1.5)}
            else if(type===4){c.beginPath();c.moveTo(-11,5);c.lineTo(-6,-8);c.lineTo(0,-11);c.lineTo(6,-8);c.lineTo(11,5);c.lineTo(0,9);c.closePath();c.fill();c.stroke();eye(0,-2,2.2);c.strokeStyle=P;c.beginPath();c.arc(0,0,7,0,6.283);c.stroke()}
            else if(type===5){c.beginPath();c.ellipse(0,0,7,10,0,0,6.283);c.fill();c.stroke();c.strokeStyle=col;c.lineWidth=2;for(var q=-5;q<=5;q+=5){c.beginPath();c.moveTo(q,-4);c.lineTo(q+2,5);c.stroke()}eye(0,-3,1.7);limb(-5,5,-9,10,1.5);limb(5,5,9,10,1.5)}
            else if(type===6){c.beginPath();c.roundRect(-10,-7,20,14,5);c.fill();c.stroke();eye(-3,-1,1.4);eye(3,-1,1.4);c.strokeStyle=C;c.beginPath();c.arc(0,0,11,0,6.283);c.stroke()}
            else{c.beginPath();c.ellipse(0,0,20,12,0,0,6.283);c.fill();c.stroke();c.strokeStyle=P;c.lineWidth=2;c.beginPath();c.arc(0,0,15+Math.sin(t*3)*1.5,0,6.283);c.stroke();for(var z=0;z<6;z++){var a=z*Math.PI/3;limb(Math.cos(a)*10,Math.sin(a)*7,Math.cos(a)*25,Math.sin(a)*17,1.6)}eye(0,0,3.5)}
            c.shadowBlur=0;c.restore();
          }
          '''
          pat=re.compile(r'/\* ═════════════ BUG ART ═════════════ \*/.*?/\* ═════════════ TOWER ART ═════════════ \*/',re.S)
          s,n=pat.subn('/* ═════════════ ALIEN ART ═════════════ */\n'+alien+'/* ═════════════ TOWER ART ═════════════ */',s,count=1)
          if n!=1: raise SystemExit('enemy art block not found')
          s=s.replace('The invasion found Earth. Hold the line.','Earth is under attack. Deploy the robots. Hold the line.')
          s=s.replace('>Bugs<','>Aliens<').replace('>bugs<','>aliens<')
          if 'UI + ENEMY VISUAL REWORK' not in s:
            m=re.search(r'(\{v:"2\.0\.0",d:"latest",items:\[\n)',s)
            if m:
              text='    "UI + ENEMY VISUAL REWORK - Robots vs Aliens command UI with cyan robot energy, magenta alien energy, metallic panels, clearer HUD hierarchy and a persistent right-side Robot Deployment shop. Enemy visuals are now distinct alien silhouettes rather than generic bugs, including drones, flyers, armored creatures, spiders, crystal forms and boss-scale alien forms. Gameplay ids and stats are preserved."\n'
              s=s[:m.end()]+text+s[m.end():]
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pantry.html
          git commit -m "feat: Apply Robots vs Aliens Rework"
          git push
