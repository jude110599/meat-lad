      const f=a.rebel?a.flag:(G.civs[a.civ]?G.civs[a.civ].flag:null);if(f){const fc=flagCanvas(f);g.drawImage(fc,bx,by-s*.2,s*.75,s*.5);}
    }
    if(z>=5.5||sel||(HOVER&&HOVER.t==='army'&&HOVER.id===a.id)||(a.rebel&&z>=3)){g.font=`600 ${Math.round(clamp(z*.4,10,13))}px ${FONT}`;const lbl=fmt(a.n)+(a.rebel?' rebels':'');const tw=g.measureText(lbl).width;
      g.fillStyle='rgba(10,12,18,.8)';g.fillRect(sx-tw/2-4,sy+s*.55,tw+8,15);g.fillStyle=a.rebel?'#ffb09a':'#f3e8cc';g.textAlign='center';g.textBaseline='top';g.fillText(lbl,sx,sy+s*.55+2);}
    if(sel){g.strokeStyle='rgba(255,230,160,.9)';g.lineWidth=1.5;g.beginPath();g.ellipse(sx,sy+s*.2,s*1.3,s*.55,0,0,TAU);g.stroke();}
  }
  // battles
  for(const bt of G.battles){const[sx,sy]=w2s(bt.x,bt.y);if(sx<-40||sy<-40||sx>VW+40||sy>VH+40)continue;
    const p=.6+Math.sin(TIME*8)*.4;const r=clamp(z*.9,8,26);
    g.strokeStyle=`rgba(255,90,60,${p})`;g.lineWidth=2;g.beginPath();g.arc(sx,sy,r,0,TAU);g.stroke();
    swords(g,sx,sy,r*.7);
    if(GFX.particles&&z>=3&&R()<.5){puff(bt.x+rf(-.8,.8),bt.y+rf(-.8,.8),R()<.5?'dust':'spark',{vy:rf(-.6,-.1),vx:rf(-.3,.3),life:rf(.5,1.2)});}

}
function swords(g,x,y,r){g.strokeStyle='#f3e8cc';g.lineWidth=Math.max(1.5,r*.16);g.lineCap='round';g.beginPath();g.moveTo(x-r*.7,y-r*.7);g.lineTo(x+r*.7,y+r*.7);g.moveTo(x+r*.7,y-r*.7);g.lineTo(x-r*.7,y+r*.7);g.stroke();
  g.strokeStyle='#b08a4a';g.beginPath();g.moveTo(x-r*.55,y+r*.25);g.lineTo(x-r*.25,y+r*.55);g.moveTo(x+r*.55,y+r*.25);g.lineTo(x+r*.25,y+r*.55);g.stroke();}

/* ---------- cities ---------- */
function drawCities(g){
  const z=cam.z;const[wx0,wy0]=s2w(-80,-80),[wx1,wy1]=s2w(VW+80,VH+80);
  const detailed=z>=7;
  const font=FONT;
  const labels=[];
  for(const ct of G.cities){
    if(!ct.alive||ct.x<wx0||ct.x>wx1||ct.y<wy0||ct.y>wy1)continue;
    const c=G.civs[ct.civ];const col=c?c.col:[180,180,180];
    const[sx,sy]=w2s(ct.x+.5,ct.y+.5);
    const sel=SEL&&SEL.t==='city'&&SEL.id===ct.id;
    if(detailed&&GFX.buildings>=1)drawCityDetailed(g,ct,sx,sy,z);
    else if(z>=2.2){
      const s=clamp(z*.9,5,13)*(.8+ct.tier*.12);
      const era=c?c.era:0;
      const n=Math.min(3,1+Math.floor(ct.tier/2));
      for(let k=0;k<n;k++)drawBuilding(g,k===0&&ct.capital?'hall':'house',sx+(k-(n-1)/2)*s*.55,sy+s*.3-(k===1?s*.15:0),s*.8,era,col,ct.id+k);
      if(ct.walls&&z>=3){g.strokeStyle='rgba(160,150,135,.8)';g.lineWidth=1;g.beginPath();g.arc(sx,sy,s*.95,0,TAU);g.stroke();}
    }else{
      if(z<.8&&ct.tier<2&&!ct.capital)continue;
      const r=clamp((1.5+ct.tier*.7)*Math.max(.7,z*.6),1.5,6);
      g.fillStyle=rgbS(col,1.15);g.strokeStyle='rgba(0,0,0,.85)';g.lineWidth=1;
      if(ct.capital){star(g,sx,sy,r*1.5);g.fill();g.stroke();}else{g.fillRect(sx-r/2,sy-r/2,r,r);g.strokeRect(sx-r/2,sy-r/2,r,r);}
    }
    if(ct.siege){const p=.5+Math.sin(TIME*6)*.3;g.strokeStyle=`rgba(255,80,50,${p})`;g.lineWidth=2;g.setLineDash([5,4]);g.beginPath();g.arc(sx,sy,clamp(z*2.2,10,70),0,TAU);g.stroke();g.setLineDash([]);
      if(GFX.particles&&z>=2.5&&R()<.4){puff(ct.x+.5+rf(-1.2,1.2),ct.y+.5+rf(-1.2,1.2),R()<.6?'fire':'smoke',{life:rf(.6,1.6)});}}
    if(ct.plague>0&&z>=2.5&&GFX.particles&&R()<.1)puff(ct.x+.5+rf(-1.5,1.5),ct.y+rf(-1,1),'dust',{life:2});
    if(ct.rebelArmy>=0&&z>=2){g.fillStyle='rgba(255,120,60,.9)';g.font=`bold ${clamp(z,10,14)}px ${font}`;g.textAlign='center';g.fillText('✊',sx+clamp(z*1.3,8,30),sy-clamp(z*1.3,8,30));}
    if(sel){g.strokeStyle='rgba(255,230,160,.95)';g.lineWidth=2;g.beginPath();g.arc(sx,sy,clamp(z*(TIERS[ct.tier].r*.6+1),10,200),0,TAU);g.stroke();}
    // label
    const show=GFX.mapDetail>0&&(z>=6||(z>=4&&ct.tier>=2)||(z>=2.5&&(ct.tier>=3||ct.capital))||(z>=1.2&&(ct.tier>=4||(ct.capital&&ct.tier>=3))&&GFX.mapDetail>=2));

  }

    const txt=ct.name;const tw=g.measureText(txt).width+(ct.capital?fs*1.1:0);

    if(boxes.some(b=>b[0]<box[0]+box[2]&&box[0]<b[0]+b[2]&&b[1]<box[1]+box[3]&&box[1]<b[1]+b[3]))continue;boxes.push(box);
    const c=G.civs[ct.civ];
    g.fillStyle='rgba(12,14,20,.72)';roundRect(g,box[0],box[1],box[2],box[3],4);g.fill();
    g.fillStyle=c?rgbS(c.col,1.25):'#ccc';g.fillRect(box[0],box[1]+box[3]-2,box[2],2);
    let tx=sx;if(ct.capital){g.fillStyle='#f3d796';star(g,box[0]+fs*.65,ly,fs*.38);g.fill();tx+=fs*.55;}

}
function star(g,x,y,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr);}g.closePath();}
function roundRect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- trade routes ---------- */
function drawRoutes(g){
  const z=cam.z;const strong=MODE==='trade';if(!strong&&(z<2||GFX.mapDetail<2))return;
  g.lineWidth=strong?Math.max(1.5,Math.min(4,z*.25)):1.2;g.setLineDash([6,5]);g.lineDashOffset=-TIME*12;
  for(const r of G.routes){
    const p=r.pts;g.strokeStyle=strong?(r.sea?'rgba(120,210,255,.85)':'rgba(250,210,110,.85)'):(r.sea?'rgba(150,210,240,.35)':'rgba(240,210,140,.35)');
    g.beginPath();for(let k=0;k<p.length;k+=2){const sx=(p[k]-cam.x)*z+VW/2,sy=(p[k+1]-cam.y)*z+VH/2;if(k===0)g.moveTo(sx,sy);else g.lineTo(sx,sy);}g.stroke();
    // a merchant travelling along
    if(z>=3&&r.len>0){const f=((TIME*6/r.len)+r.id*.37)%1;let d=f*r.len;for(let k=2;k<p.length;k+=2){const seg=Math.hypot(p[k]-p[k-2],p[k+1]-p[k-1]);if(d<=seg){const t=d/seg;const x=lerp(p[k-2],p[k],t),y=lerp(p[k-1],p[k+1],t);const[sx,sy]=w2s(x,y);
      g.setLineDash([]);if(isWater(ter[idx(clamp(x|0,0,W-1),clamp(y|0,0,H-1))]))drawShip(g,sx,sy,Math.min(z*.45,14),G.civs[r.ca]?G.civs[r.ca].col:[200,200,200],G.civs[r.ca]?G.civs[r.ca].era:0,1,false);
      else{g.fillStyle='#c89a4a';g.fillRect(sx-z*.2,sy-z*.12,z*.4,z*.24);g.fillStyle='#6b4a2e';g.beginPath();g.arc(sx-z*.12,sy+z*.14,z*.07,0,TAU);g.arc(sx+z*.12,sy+z*.14,z*.07,0,TAU);g.fill();}
      g.setLineDash([6,5]);break;}d-=seg;}}
  }
  g.setLineDash([]);
}

/* ---------- labels: nations, lands, seas ---------- */
let civLabels=[],labelT=-9;
function computeCivLabels(){
  civLabels=[];
  for(const c of G.civs){if(!c.alive||!c.cities.length)continue;let sx=0,sy=0,n=0,t=0;
    for(const id of c.cities){const ct=G.cities[id];const w=ct.tiles.length+1;sx+=ct.x*w;sy+=ct.y*w;n+=w;t+=ct.tiles.length;}
    let x=sx/n,y=sy/n;const i=idx(clamp(Math.round(x),0,W-1),clamp(Math.round(y),0,H-1));
    if(tOwn[i]!==c.id+1){const cap=G.cities[c.capital];if(cap){x=cap.x;y=cap.y+2;}}
    civLabels.push({c,x,y,t});}
  civLabels.sort((a,b)=>b.t-a.t);
}
function drawLabels(g){
  const z=cam.z;if(TIME-labelT>1){computeCivLabels();labelT=TIME;}
  const boxes=[];
  // geography at low zoom
  if(z<3&&GFX.mapDetail>0){
    g.textAlign='center';g.textBaseline='middle';
    for(const o of seas.oceanLabels||[]){const[sx,sy]=w2s(o.x,o.y);if(sx<-200||sy<-50||sx>VW+200||sy>VH+50)continue;const fs=clamp(14*Math.sqrt(z)*GFX.labelScale,10,22);
      g.font=`italic ${fs}px Georgia,serif`;g.fillStyle='rgba(190,215,240,.55)';spaced(g,o.name.toUpperCase(),sx,sy,fs*.25);}
    for(const m of landmasses){if(!m.name||m.size<N*.004)continue;if(civLabels.length&&z>1)continue;const[sx,sy]=w2s(m.x,m.y);if(sx<-200||sy<-50||sx>VW+200||sy>VH+50)continue;
      const fs=clamp(Math.sqrt(m.size)*z*.12,10,26);g.font=`italic ${fs}px Georgia,serif`;g.fillStyle='rgba(250,240,210,.45)';g.fillText(m.name,sx,sy);}
  }
  // nation names
  if(z<9&&GFX.mapDetail>0&&(MODE!=='terrain')){
    g.textAlign='center';g.textBaseline='middle';
    for(const L of civLabels){
      const fs=clamp(Math.sqrt(L.t)*z*.2,0,28)*GFX.labelScale;if(fs<9)continue;
      if(z>=5&&fs<18)continue;
      const[sx,sy]=w2s(L.x+.5,L.y+.5);if(sx<-300||sy<-60||sx>VW+300||sy>VH+60)continue;
      const name=L.c.base;
      g.font=`700 ${fs}px "Palatino Linotype","Book Antiqua",Palatino,Georgia,serif`;
      const tw=g.measureText(name).width+fs*.18*name.length;const box=[sx-tw/2,sy-fs/2,tw,fs];
      if(boxes.some(b=>b[0]<box[0]+box[2]&&box[0]<b[0]+b[2]&&b[1]<box[1]+box[3]&&box[1]<b[1]+b[3]))continue;boxes.push(box);
      g.lineWidth=Math.max(2,fs*.16);g.lineJoin='round';g.strokeStyle='rgba(8,10,14,.55)';g.fillStyle=rgba(mix(L.c.col,[255,250,235],.55),.9);
      spaced(g,name.toUpperCase(),sx,sy,fs*.18,true);
    }
  }
}
function spaced(g,txt,x,y,sp,stroke){const w=g.measureText(txt).width+sp*(txt.length-1);let cx=x-w/2;g.textAlign='left';
  for(const ch of txt){if(stroke)g.strokeText(ch,cx,y);g.fillText(ch,cx,y);cx+=g.measureText(ch).width+sp;}g.textAlign='center';}

/* ---------- transient effects ---------- */
function drawFX(g,dt){
  for(let i=FX.length-1;i>=0;i--){const f=FX[i];f.t+=dt;if(f.t>f.life){FX.splice(i,1);continue;}const k=f.t/f.life;const[sx,sy]=w2s(f.x+.5,f.y+.5);const r=(f.r||4)*cam.z;
    if(f.type==='meteor'){if(k<.25){const q=k/.25;g.strokeStyle='rgba(255,200,120,.9)';g.lineWidth=4;g.beginPath();g.moveTo(sx-300*(1-q),sy-400*(1-q));g.lineTo(sx-300*(1-q)+30,sy-400*(1-q)+40);g.stroke();}
      else{const q=(k-.25)/.75;g.fillStyle=`rgba(255,${200-q*150|0},80,${1-q})`;g.beginPath();g.arc(sx,sy,r*(.3+q),0,TAU);g.fill();if(GFX.particles)for(let j=0;j<3;j++)puff(f.x+rf(-f.r,f.r),f.y+rf(-f.r,f.r),'smoke',{life:2});}}
    else if(f.type==='quake'){g.strokeStyle=`rgba(255,220,160,${1-k})`;g.lineWidth=2;for(let j=0;j<3;j++){g.beginPath();g.arc(sx,sy,r*((k*2+j*.3)%1),0,TAU);g.stroke();}}
    else if(f.type==='volcano'){if(GFX.particles&&R()<.6){puff(f.x+.5,f.y,'fire',{vy:rf(-2,-.8),vx:rf(-.5,.5),life:1.2,s:.4});puff(f.x+.5,f.y-1,'smoke',{vy:rf(-1,-.4),life:3,s:.6});}}
    else if(f.type==='plague'){g.fillStyle=`rgba(120,200,90,${.25*(1-k)})`;g.beginPath();g.arc(sx,sy,r,0,TAU);g.fill();}
    else if(f.type==='drought'){g.fillStyle=`rgba(230,180,90,${.22*(1-k)})`;g.beginPath();g.arc(sx,sy,r,0,TAU);g.fill();}
    else if(f.type==='flood'){g.fillStyle=`rgba(90,150,230,${.3*(1-k)})`;g.beginPath();g.arc(sx,sy,r,0,TAU);g.fill();}
    else if(f.type==='fire'){if(GFX.particles&&R()<.8)puff(f.x+rf(-f.r,f.r),f.y+rf(-f.r,f.r),'fire',{life:1});}
    else if(f.type==='bless'){g.strokeStyle=`rgba(255,230,140,${1-k})`;g.lineWidth=3;g.beginPath();g.arc(sx,sy,30+k*80,0,TAU);g.stroke();}
    else if(f.type==='curse'){g.strokeStyle=`rgba(180,60,200,${1-k})`;g.lineWidth=3;g.beginPath();g.arc(sx,sy,110-k*80,0,TAU);g.stroke();}
    else if(f.type==='ping'){g.strokeStyle=`rgba(255,230,160,${1-k})`;g.lineWidth=2;g.beginPath();g.arc(sx,sy,6+k*40,0,TAU);g.stroke();}
  }
}

/* ---------- crisp vector borders when zoomed in ---------- */
function drawBorderLines(g){
  const z=cam.z;const[x0f,y0f]=s2w(0,0),[x1f,y1f]=s2w(VW,VH);
  const x0=Math.max(0,Math.floor(x0f)),y0=Math.max(0,Math.floor(y0f)),x1=Math.min(W-1,Math.ceil(x1f)),y1=Math.min(H-1,Math.ceil(y1f));
  const segs=new Map();const add=(o,ax,ay,bx,by)=>{let l=segs.get(o);if(!l){l=[];segs.set(o,l);}l.push(ax,ay,bx,by);};
  const off=Math.min(.18,2/z);
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const i=y*W+x,o=tOwn[i];
    if(x<W-1){const r=tOwn[i+1];if(r!==o){if(o)add(o,x+1-off,y,x+1-off,y+1);if(r)add(r,x+1+off,y,x+1+off,y+1);}}
    if(y<H-1){const d=tOwn[i+W];if(d!==o){if(o)add(o,x,y+1-off,x+1,y+1-off);if(d)add(d,x,y+1+off,x+1,y+1+off);}}}
  const lw=clamp(z*.12,1.5,4);g.lineCap='round';
  for(const[o,l]of segs){const c=G.civs[o-1];if(!c)continue;const col=GFX.cvd?cvdColor(o-1):c.col;
    g.beginPath();for(let k=0;k<l.length;k+=4){g.moveTo((l[k]-cam.x)*z+VW/2,(l[k+1]-cam.y)*z+VH/2);g.lineTo((l[k+2]-cam.x)*z+VW/2,(l[k+3]-cam.y)*z+VH/2);}
    g.strokeStyle='rgba(10,12,16,.55)';g.lineWidth=lw+2;g.stroke();g.strokeStyle=rgbS(col,1.15);g.lineWidth=lw;g.stroke();}
}
/* ---------- main render ---------- */
function render(dt,alpha){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#16345c';ctx.fillRect(0,0,VW,VH);
  const z=cam.z;
  const[x0,y0]=s2w(0,0);
  // terrain
  if(z>=6&&GFX.terrain>0){
    chunkBuilds=z>=10?5:3;
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(baseC,0,0,W,H,(0-cam.x)*z+VW/2,(0-cam.y)*z+VH/2,W*z,H*z);
    const cx0=Math.max(0,Math.floor(x0/CHK)),cy0=Math.max(0,Math.floor(y0/CHK));const[x1,y1]=s2w(VW,VH);const cx1=Math.min(Math.ceil(W/CHK)-1,Math.floor(x1/CHK)),cy1=Math.min(Math.ceil(H/CHK)-1,Math.floor(y1/CHK));
    ctx.imageSmoothingEnabled=z<chunkPx();
    const gl=[];
    for(let cy=cy0;cy<=cy1;cy++)for(let cx=cx0;cx<=cx1;cx++){const ch=getChunk(cx,cy);if(!ch)continue;const sx=(cx*CHK-cam.x)*z+VW/2,sy=(cy*CHK-cam.y)*z+VH/2;
      ctx.drawImage(ch.c,sx,sy,ch.c.width/ch.P*z,ch.c.height/ch.P*z);if(GFX.water>=1)gl.push(ch.glints);}
    if(GFX.water>=1){ctx.strokeStyle='rgba(230,245,255,.5)';ctx.lineWidth=Math.max(1,z*.08);ctx.beginPath();
      for(const l of gl)for(let k=0;k<l.length;k+=2){const ph=TIME*(GFX.water>=2?1.3:0)+h2(l[k],l[k+1],5)*TAU;const a=Math.sin(ph);if(a<.3)continue;const sx=(l[k]+.5-cam.x)*z+VW/2,sy=(l[k+1]+.5-cam.y)*z+VH/2;ctx.moveTo(sx-z*.25*a,sy);ctx.quadraticCurveTo(sx,sy-z*.12,sx+z*.25*a,sy);}
      ctx.stroke();}
  }else{
    ctx.imageSmoothingEnabled=z<1.5;
    ctx.drawImage(baseC,0,0,W,H,(0-cam.x)*z+VW/2,(0-cam.y)*z+VH/2,W*z,H*z);
  }
  // overlay
  if(MODE!=='terrain'){
    const vec=z>=5&&['political','borders','diplomacy','colonies'].includes(MODE);
    ctx.imageSmoothingEnabled=false;ctx.globalAlpha=vec?(MODE==='political'?.42:.6):1;
    ctx.drawImage(ovC,0,0,W,H,(0-cam.x)*z+VW/2,(0-cam.y)*z+VH/2,W*z,H*z);ctx.globalAlpha=1;
    if(vec)drawBorderLines(ctx);
  }
  drawRoutes(ctx);
  drawCities(ctx);
  if(typeof drawCitizens==='function')drawCitizens(ctx,dt);
  drawArmies(ctx,alpha);
  drawParticles(ctx,dt);
  drawFX(ctx,dt);
  drawLabels(ctx);
  if(typeof drawBrush==='function')drawBrush(ctx);
}

/* ---------- feed & toasts ---------- */
const feedQ=[];let feedDirty=true,lastToast=0;
function onEvent(e){
  if(e.i<1)return;

  const followed=FOLLOW&&FOLLOW.t==='civ'&&e.c.includes(FOLLOW.id);
  if(UIS.toasts&&UIS.cats[e.t]&&(e.i>=3||(followed&&e.i>=2))&&performance.now()-lastToast>(followed?1500:3500)){lastToast=performance.now();toast(e);}
  const ap=UIS.autopause;
  if(running&&((ap.big&&e.i>=3)||(ap.war&&(e.t==='war'||e.t==='civilwar'||e.t==='independence')&&e.i>=2)||(ap.followed&&followed&&e.i>=2&&['war','conquest','independence','civilwar','collapse','rebellion'].includes(e.t)))){running=false;updateSpeedBtns();toastText('Auto-paused',`${EVT[e.t][0]} — ${stripLinks(e.x).slice(0,80)}`);}
}
function stripLinks(t){return t.replace(/\[\[[ctaw]\d+\|([^\]]+)\]\]/g,'$1');}
function feedPass(e){const f=$('#feedFilter').value;if(e.i<1)return false;
  if(f==='major')return e.i>=Math.max(2,UIS.feedImp)&&UIS.cats[e.t];if(f==='all')return e.i>=1&&UIS.cats[e.t];
  if(f==='follow')return FOLLOW&&FOLLOW.t==='civ'&&e.c.includes(FOLLOW.id);return e.t===f;}
function renderFeed(){
  if(!feedDirty)return;feedDirty=false;
  const out=[];for(let k=G.events.length-1;k>=0&&out.length<60;k--){const e=G.events[k];if(feedPass(e))out.push(e);if(G.events.length-k>6000)break;}
  $('#feedList').innerHTML=out.map(e=>{const E=EVT[e.t];return`<div class="fe i${e.i}" data-ev="${e.id}"><div class="ic" style="background:${E[2]}22;color:${E[2]}">${icon(E[1])}</div><div><div>${rich(e.x)}</div><div class="y">${yr(e.y)} · ${E[0]}</div></div></div>`;}).join('')||'<div class="hint" style="padding:.6rem">Nothing yet. History is still being written.</div>';
}
function buildFeed(){
  $('#feedFilter').innerHTML=`<option value="major">Major events</option><option value="all">Everything</option><option value="follow">Followed nation</option>`+Object.entries(EVT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('');

}
function toast(e){const E=EVT[e.t];const d=document.createElement('div');d.className='toast';d.innerHTML=`<div style="color:${E[2]}">${icon(E[1])}</div><div><div class="t1">${E[0]}</div><div>${rich(e.x)}</div></div>`;

/* ---------- selection & inspector ---------- */
const TABS={civ:['Overview','Cities','Military','Economy','Diplomacy','History'],city:['Overview','Buildings','Economy','History'],army:['Overview'],war:['Overview'],citizen:['Overview'],tile:['Overview']};

    if(focus){const p=selPos(s);if(p)flyTo(p[0],p[1],s.t==='civ'?Math.min(cam.z,Math.max(2,cam.z)):Math.max(cam.z,s.t==='city'?7:5));}}

}
function selPos(s){if(s.t==='civ'){const c=G.civs[s.id];const ct=G.cities[c.capital]||(c.cities.length?G.cities[c.cities[0]]:null);if(ct)return[ct.x+.5,ct.y+.5];const lc=c.prevCap;return null;}
  if(s.t==='city'){const ct=G.cities[s.id];return[ct.x+.5,ct.y+.5];}if(s.t==='army'){const a=AMAP.get(s.id);return a?[a.x,a.y]:null;}
  if(s.t==='citizen'){const p=findCitizen(s.id);return p?[p.x,p.y]:null;}if(s.t==='tile')return[s.x+.5,s.y+.5];return null;}

function renderInsp(keepScroll){

    (tabs.length>1?`<div class="tabs">${tabs.map(t=>`<button data-tab="${t}" class="${t===cur?'on':''}">${t}</button>`).join('')}</div>`:'')+`<div class="bd scroll">${o.body}</div>`;

function stripTags(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent.trim();}

function inspContent(s){

const CHARTS=new Map();let chartId=0;
function chartHTML(series,o={}){const id='ch'+(++chartId);CHARTS.set(id,{series,o});if(CHARTS.size>40){CHARTS.delete(CHARTS.keys().next().value);}return`<canvas class="chart" data-ch="${id}" style="${o.h?`height:${o.h}`:''}"></canvas>`;}
function drawChartFromData(c){const d=CHARTS.get(c.dataset.ch);if(d)lineChart(c,d.series,d.o);}
function lineChart(c,series,o={}){
  const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;c.width=Math.max(10,r.width*dpr);c.height=Math.max(10,r.height*dpr);const g=c.getContext('2d');g.scale(dpr,dpr);const w=r.width,h=r.height;
  const pl=36,pr=8,pt=10,pb=18;let x0=1e9,x1=-1e9,y1=0;for(const s of series)for(const p of s.pts){x0=Math.min(x0,p[0]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);}
  if(x0>=x1){x1=x0+1;}if(y1<=0)y1=1;
  g.font=`10px ${FONT}`;g.fillStyle='#7c8390';g.strokeStyle='rgba(255,255,255,.07)';g.lineWidth=1;
  for(let k=0;k<=3;k++){const y=pt+(h-pt-pb)*k/3;g.beginPath();g.moveTo(pl,y);g.lineTo(w-pr,y);g.stroke();g.textAlign='right';g.fillText(fmt(y1*(1-k/3)),pl-4,y+3);}
  g.textAlign='left';g.fillText(yr(Math.round(x0)),pl,h-4);g.textAlign='right';g.fillText(yr(Math.round(x1)),w-pr,h-4);
  const X=v=>pl+(v-x0)/(x1-x0)*(w-pl-pr),Y=v=>pt+(1-v/y1)*(h-pt-pb);

    if(o.fill&&series.length===1){g.lineTo(X(s.pts[s.pts.length-1][0]),Y(0));g.lineTo(X(s.pts[0][0]),Y(0));g.closePath();g.fillStyle=s.color.replace('rgb','rgba').replace(')',',.12)');g.fill();}}
  if(o.legend&&series.length>1){let lx=pl+4;g.textAlign='left';for(const s of series.slice(0,8)){g.fillStyle=s.color;g.fillRect(lx,pt,8,8);g.fillStyle='#c9ced8';g.fillText(s.name,lx+11,pt+8);lx+=g.measureText(s.name).width+22;if(lx>w-60)break;}}
}

      card('Greatest empires ever','crown',top(G.civs,c=>c.stats.peakTiles),c=>c.stats.peakTiles,(v,c)=>fmt(v)+' tiles · '+(c.alive?'living':'fell '+c.fell))+`</div>`;
  }else if(statTab==='Wars'){

function growth50(c){const h=c.hist;if(h.length<2)return 0;const now=h[h.length-1];let old=h[0];for(let k=h.length-1;k>=0;k--){if(now[0]-h[k][0]>=50){old=h[k];break;}}return old[1]>0?(now[1]-old[1])/old[1]:0;}
/* history */
let histTab='Timeline',histCat='all',histImp=2,histQ='',histN=300,atlasIx=-1,atlasPlay=0;
function openHistory(tab){if(tab)histTab=tab;showModal(`${icon('history')} History of ${esc(G.worldName)}`,`${tabsHtml(['Timeline','Chronicle','Atlas','Rise & Fall'],histTab)}<div id="hBody" style="flex:1;min-height:0;display:flex;flex-direction:column"></div>`,m=>{m.querySelectorAll('[data-mt]').forEach(b=>b.onclick=()=>{histTab=b.dataset.mt;openHistory();});renderHistory();});}
function renderHistory(){
  const B=$('#hBody');if(!B)return;
  if(histTab==='Timeline'){
    const ev=[];for(let k=G.events.length-1;k>=0&&ev.length<histN;k--){const e=G.events[k];if(e.i<histImp)continue;if(histCat!=='all'&&e.t!==histCat)continue;if(histQ&&!stripLinks(e.x).toLowerCase().includes(histQ))continue;ev.push(e);}
    B.innerHTML=`<div class="tbar"><select id="hCat"><option value="all">All kinds</option>${Object.entries(EVT).map(([k,v])=>`<option value="${k}" ${histCat===k?'selected':''}>${v[0]}</option>`).join('')}</select><span class="seg">${[1,2,3].map(i=>`<button data-im="${i}" class="${histImp===i?'on':''}">${['','All','Major','Epochal'][i]}</button>`).join('')}</span><input id="hQ" placeholder="Search history…" value="${esc(histQ)}"><span class="hint">${ev.length}${ev.length>=histN?'+':''} events</span></div>
      <div class="scroll" style="flex:1;padding:.8rem 1.2rem"><div class="tl">${ev.map(e=>`<div class="ev i${e.i}"><span class="y">${e.y}</span><span style="color:${EVT[e.t][2]}">${icon(EVT[e.t][1])}</span> ${rich(e.x)}</div>`).join('')}</div>${ev.length>=histN?`<button class="btn sm" id="hMore" style="margin:.5rem 0">Show more</button>`:''}</div>`;
    $('#hCat').onchange=e=>{histCat=e.target.value;renderHistory();};B.querySelectorAll('[data-im]').forEach(b=>b.onclick=()=>{histImp=+b.dataset.im;renderHistory();});
    const q=$('#hQ');q.oninput=()=>{histQ=q.value.toLowerCase();const p=q.selectionStart;renderHistory();const n=$('#hQ');n.focus();n.setSelectionRange(p,p);};
    const mb=$('#hMore');if(mb)mb.onclick=()=>{histN+=500;renderHistory();};
  }else if(histTab==='Chronicle'){
    const byC=new Map();for(const e of G.events){if(e.i<3)continue;const c=Math.floor((e.y-1)/100);if(!byC.has(c))byC.set(c,[]);byC.get(c).push(e);}
    let h='<div class="scroll story" style="flex:1;padding:1rem 1.6rem;max-width:62rem">';
    h+=`<p>${esc(G.worldName)} was shaped in the first year of its reckoning. ${G.civs.filter(c=>c.founded<=2).length} peoples walked its lands at the dawn of history.</p>`;
    for(const[c,list]of[...byC].sort((a,b)=>a[0]-b[0])){h+=`<h3 style="font-family:var(--serif);color:var(--gold2);margin:1rem 0 .3rem">The ${ordinal(c+1)} Century <span class="dim" style="font-size:.85rem">(${c*100+1}–${c*100+100})</span></h3>`;
      const alive=G.wstats.find(s=>s[0]>=c*100+100);if(alive)h+=`<p class="dim" style="font-size:.9rem">By its end: ${alive[2]} nations, ${fmt(alive[1])} people, ${alive[3]} wars raging.</p>`;
      h+=list.slice(0,40).map(e=>`<p><b style="color:var(--gold2)">${e.y}.</b> ${rich(e.x)}</p>`).join('');if(list.length>40)h+=`<p class="dim">…and ${list.length-40} more great events.</p>`;}
    B.innerHTML=h+'</div>';
  }else if(histTab==='Atlas'){
    if(atlasIx<0||atlasIx>=G.snaps.length)atlasIx=G.snaps.length-1;
    B.innerHTML=`<div class="tbar"><button class="btn sm" id="aPlay">${icon(atlasPlay?'pause':'play')} ${atlasPlay?'Pause':'Play'}</button><input type="range" id="aR" min="0" max="${Math.max(0,G.snaps.length-1)}" value="${atlasIx}" style="flex:1;min-width:10rem"><b id="aY" class="serif" style="min-width:6rem;text-align:right"></b></div>
      <div style="flex:1;min-height:0;display:flex;gap:1rem;padding:1rem"><div style="flex:3;min-width:0;display:flex;align-items:center;justify-content:center"><canvas id="aC" style="max-width:100%;max-height:100%;border-radius:8px;image-rendering:pixelated"></canvas></div><div id="aL" class="scroll" style="flex:1;min-width:14rem"></div></div>`;
    const draw=()=>{const s=G.snaps[atlasIx];if(!s)return;const c=$('#aC');if(!c)return;c.width=s.w;c.height=s.h;const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.drawImage(baseC,0,0,s.w,s.h);
      const img=g.getImageData(0,0,s.w,s.h);const cnt=new Map();for(let i=0;i<s.d.length;i++){const o=s.d[i];if(!o)continue;const cv=G.civs[o-1];if(!cv)continue;const p=i*4;img.data[p]=img.data[p]*.35+cv.col[0]*.65;img.data[p+1]=img.data[p+1]*.35+cv.col[1]*.65;img.data[p+2]=img.data[p+2]*.35+cv.col[2]*.65;cnt.set(o-1,(cnt.get(o-1)||0)+1);}
      g.putImageData(img,0,0);const bw=Math.min(innerWidth*.6,s.w*4);c.style.width=bw+'px';c.style.height=bw*s.h/s.w+'px';
      $('#aY').textContent=yr(s.y);
      $('#aL').innerHTML=`<div class="sec" style="margin-top:0">Great powers of ${s.y}</div><div class="list">${[...cnt].sort((a,b)=>b[1]-a[1]).slice(0,16).map(([id,n])=>`<div class="li">${flagImg(G.civs[id].flag,.85)} ${civLink(G.civs[id])}<span class="r">${Math.round(n/s.d.length*1000)/10}%</span></div>`).join('')}</div>`;};
    draw();$('#aR').oninput=e=>{atlasIx=+e.target.value;draw();};
    $('#aPlay').onclick=()=>{atlasPlay=!atlasPlay;renderHistory();};
    if(atlasPlay){const tick=()=>{if(!atlasPlay||histTab!=='Atlas'||!$('#aR'))return;atlasIx=(atlasIx+1)%G.snaps.length;$('#aR').value=atlasIx;draw();setTimeout(tick,450);};setTimeout(tick,450);}
  }else if(histTab==='Rise & Fall'){
    const list=G.civs.filter(c=>c.stats.peakCities>=2||((c.alive?G.year:c.fell)-c.founded)>=60).sort((a,b)=>a.founded-b.founded);
    B.innerHTML=`<div class="tbar"><span class="hint">Every nation's lifespan, from founding to fall. Bar height shows peak size. Click a bar to open the nation.</span></div><div class="scroll" style="flex:1;padding:.5rem 1rem"><canvas id="gC" style="width:100%;display:block"></canvas></div>`;
    const c=$('#gC');const rowH=14;const r=c.getBoundingClientRect();const dpr=window.devicePixelRatio||1;const w=r.width;const h=Math.max(100,list.length*rowH+30);
    c.style.height=h+'px';c.width=w*dpr;c.height=h*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);const Y=G.year;const X=y=>150+(y/Y)*(w-160);
    g.font=`11px ${FONT}`;g.fillStyle='#7c8390';for(let k=0;k<=5;k++){const y=Math.round(Y*k/5);g.textAlign=k===5?'right':k===0?'left':'center';g.fillText(yr(y),X(y),12);g.textAlign='left';g.fillStyle='rgba(255,255,255,.05)';g.fillRect(X(y),16,1,h);g.fillStyle='#7c8390';}
    const maxP=Math.max(1,...list.map(c=>c.stats.peakTiles));
    list.forEach((cv,i)=>{const y=22+i*rowH;const x0=X(cv.founded),x1=X(cv.alive?Y:cv.fell);const bh=Math.max(3,(rowH-3)*Math.sqrt(cv.stats.peakTiles/maxP));
      g.fillStyle=rgbS(cv.col,cv.alive?1.1:.75);g.fillRect(x0,y+(rowH-bh)/2,Math.max(2,x1-x0),bh);g.fillStyle=cv.alive?'#e9e6dd':'#80868f';g.textAlign='right';g.fillText(cv.base.slice(0,20),144,y+10);g.textAlign='left';});
    c.onclick=e=>{const rr=c.getBoundingClientRect();const i=Math.floor((e.clientY-rr.top-22)/rowH);if(list[i]){closeModal();select({t:'civ',id:list[i].id},true);}};
  }
}

  for(const ct of G.cities)if(ct.name.toLowerCase().includes(q))out.push({k:ct.alive?'City':'Ruins',h:`${icon('city')} ${esc(ct.name)} <span class="dim">${ct.alive?esc(G.civs[ct.civ].base):''}</span>`,s:{t:'city',id:ct.id},sc:ct.alive?1.5+ct.tier*.1:.5});

  for(const c of G.civs)if(c.alive&&c.leader&&c.leader.name.toLowerCase().includes(q))out.push({k:'Ruler',h:`${icon('crown')} ${esc(leaderStr(c))} <span class="dim">${esc(c.base)}</span>`,s:{t:'civ',id:c.id},sc:1.2});
  for(const p of allCitizens())if(p.name.toLowerCase().includes(q))out.push({k:'Citizen',h:`${icon('person')} ${esc(p.name)} <span class="dim">${esc(p.job)}</span>`,s:{t:'citizen',id:p.id},sc:.8});
  for(const w of G.wars)if(w.name.toLowerCase().includes(q))out.push({k:'War',h:`${icon('sword')} ${esc(w.name)}`,s:{t:'war',id:w.id},sc:.9});
  for(const m of landmasses)if(m.name&&m.name.toLowerCase().includes(q))out.push({k:'Land',h:`${icon('globe')} ${esc(m.name)}`,s:{t:'tile',x:Math.round(m.x),y:Math.round(m.y)},sc:.7});
  out.sort((a,b)=>b.sc-a.sc);srList=out.slice(0,30);srIx=clamp(srIx,0,Math.max(0,srList.length-1));

}

function buildSearch(){const q=$('#q');q.oninput=()=>{srIx=0;doSearch(q.value);};q.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){srIx=clamp(srIx+(e.key==='ArrowDown'?1:-1),0,Math.max(0,srList.length-1));doSearch(q.value);e.preventDefault();}else if(e.key==='Enter')pickSearch(srIx);else if(e.key==='Escape'){q.value='';$('#searchRes').classList.add('hide');q.blur();}e.stopPropagation();};

/* ======================= CITIZENS (detailed simulation near the camera) ======================= */
const CIT=new Map();
const JOBS={Farmer:[150,110,60],Miner:[90,90,100],Woodcutter:[110,80,50],Fisher:[70,120,170],Merchant:[140,80,160],Priest:[235,230,215],Soldier:null,Artisan:[190,140,80],Builder:[200,160,90],Child:[230,190,120],Elder:[160,160,160],'Factory worker':[80,80,90],Clerk:[60,70,110],Sailor:[40,70,130],Herder:[160,130,70]};
function citizensFor(ct){
  let e=CIT.get(ct.id);const c=G.civs[ct.civ];
  const want=clamp(Math.round(Math.sqrt(ct.pop)/2.2),3,GFX.citizens>=2?42:18);
  if(e&&e.n===want&&e.civ===ct.civ){e.t=TIME;return e.list;}
  const list=[];const cu=G.cultures[ct.culture];const era=c?c.era:0;
  const farms=[],mines=[],lumb=[],past=[];for(const i of ct.tiles){const m=impr[i];if(m===IM.FARM)farms.push(i);else if(m===IM.MINE||m===IM.QUARRY)mines.push(i);else if(m===IM.LUMBER)lumb.push(i);else if(m===IM.PASTURE)past.push(i);}
  const wp=ct.port?waterNear(ct):null;const blds=cityBuildings(ct);
  const jobs=[['Farmer',farms.length?4:0],['Miner',mines.length?2:0],['Woodcutter',lumb.length?1.2:0],['Herder',past.length?1:0],['Fisher',wp?1.5:0],['Merchant',blds.includes('market')?1.5:0],['Priest',blds.includes('temple')?.5:0],['Soldier',blds.includes('barracks')||ct.walls?1:.3],['Artisan',era>=2?1:.2],['Builder',1],['Child',1.5],['Elder',.8],['Factory worker',era>=6?3:0],['Clerk',era>=7?2:0],['Sailor',wp&&era>=2?.8:0]];
  for(let k=0;k<want;k++){
    const r=localRng(ct.id*7919+k*104729+ct.civ);
    const job=(()=>{let t=0;for(const j of jobs)t+=j[1];let x=r()*t;for(const j of jobs){x-=j[1];if(x<=0)return j[0];}return'Builder';})();
    const home=ct.urb.length?ct.urb[Math.floor(r()*ct.urb.length)]:ct.y*W+ct.x;
    const pickT=a=>a.length?a[Math.floor(r()*Math.min(a.length,12))]:home;
    let work=home;
    if(job==='Farmer')work=pickT(farms);else if(job==='Miner')work=pickT(mines);else if(job==='Woodcutter')work=pickT(lumb);else if(job==='Herder')work=pickT(past);
    else if((job==='Fisher'||job==='Sailor')&&wp)work=wp[1]*W+wp[0];else work=ct.urb.length?ct.urb[Math.floor(r()*Math.min(ct.urb.length,6))]:home;
    const age=job==='Child'?1+Math.floor(r()*13):job==='Elder'?60+Math.floor(r()*25):16+Math.floor(r()*44);
    const name=personName(cu.L,r)+' '+personName(cu.L,r);
    const kids=age>22?Math.floor(r()*5):0;
    const family=age<16?'Lives with parents':(r()<.7?`Married${kids?`, ${kids} child${kids>1?'ren':''}`:''}`:(kids?`Widowed, ${kids} child${kids>1?'ren':''}`:'Unmarried'));
    const hx=home%W+.5+(r()-.5)*.6,hy=((home/W)|0)+.5+(r()-.5)*.6;
    list.push({id:ct.id*1000+k,city:ct.id,name,age,job,home,work,family,x:hx,y:hy,tx:hx,ty:hy,wait:r()*3,go:0,skin:hsl(20+r()*25,.45,.35+r()*.4),seed:r()});
  }
  e={list,n:want,civ:ct.civ,t:TIME};CIT.set(ct.id,e);
  if(CIT.size>30){let o=null,ot=1e18;for(const[k,v]of CIT)if(v.t<ot){ot=v.t;o=k;}CIT.delete(o);}
  return list;
}
function citizenMood(ct){const s=unrestStage(ct.unrest);return['Content','Grumbling','Protesting','Resentful','Sympathises with rebels','Rebellious','Fighting for independence'][s];}
function findCitizen(id){const e=CIT.get(Math.floor(id/1000));if(!e)return null;const p=e.list.find(x=>x.id===id);if(!p)return null;decorate(p);return p;}
function allCitizens(){const o=[];for(const e of CIT.values())for(const p of e.list){decorate(p);o.push(p);}return o;}
function decorate(p){const ct=G.cities[p.city];if(!ct)return;p.mood=citizenMood(ct);
  const c=G.civs[ct.civ];const born=G.year-p.age;
  p.story=`Born in ${yr(born)} in ${ct.name}${ct.prev.length&&ct.prev[ct.prev.length-1].to>born?`, back when the city belonged to ${ct.prev[ct.prev.length-1].n}`:''}. ${p.job==='Soldier'?`Serves in the ${c?c.adj:''} garrison.`:p.job==='Child'?'Too young to work.':`Works as a ${p.job.toLowerCase()}.`} ${ct.siege?'Frightened by the siege.':ct.plague>0?'Fears the plague.':ct.famine>0?'Hungry this year.':''}`;}
function drawCitizens(g,dt){
  if(!GFX.citizens||cam.z<9||!G)return;
  const[wx0,wy0]=s2w(0,0),[wx1,wy1]=s2w(VW,VH);

    for(const p of list){

      const[sx,sy]=w2s(p.x,p.y);if(sx<-10||sy<-10||sx>VW+10||sy>VH+10)continue;
      const col=JOBS[p.job]||(c?c.col:[150,150,150]);const small=p.job==='Child'?.7:1;const bob=(p.wait<=0&&GFX.anim)?Math.abs(Math.sin(TIME*9+p.seed*9))*s*.15:0;
      if(GFX.shadows){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(sx-s*.3,sy,s*.6,s*.12);}
      g.fillStyle=rgbS(col,.75);g.fillRect(sx-s*.22*small,sy-s*.35*small-bob,s*.16*small,s*.35*small);g.fillRect(sx+s*.06*small,sy-s*.35*small-bob,s*.16*small,s*.35*small);
      g.fillStyle=rgbS(col);g.fillRect(sx-s*.25*small,sy-s*.85*small-bob,s*.5*small,s*.52*small);
      g.fillStyle=rgbS(p.skin);g.fillRect(sx-s*.17*small,sy-s*1.12*small-bob,s*.34*small,s*.3*small);
      if(SEL&&SEL.t==='citizen'&&SEL.id===p.id){g.strokeStyle='#f3d796';g.lineWidth=1.5;g.beginPath();g.arc(sx,sy-s*.5,s*1.1,0,TAU);g.stroke();}
    }}
  // boats working the waters of port cities
  for(const ct of cs){if(!ct.port)continue;const wp=waterNear(ct);if(!wp)continue;const c=G.civs[ct.civ];
    for(let k=0;k<Math.min(3,1+ct.tier);k++){const a=TIME*.15+k*2.1+ct.id;const x=wp[0]+.5+Math.cos(a)*(1.5+k),y=wp[1]+.5+Math.sin(a*1.3)*(1+k*.5);if(!isWater(ter[idx(clamp(x|0,0,W-1),clamp(y|0,0,H-1))]))continue;const[sx,sy]=w2s(x,y);drawShip(g,sx,sy,z*.3,c?c.col:[200,200,200],c?c.era:0,Math.cos(a)>0?1:-1,false);}}
}

let fly=null,mouse={x:0,y:0,in:false},drag=null,pinch=null,uiHidden=false;
function minZ(){return Math.min(VW/W,VH/H)*.92;}
function clampCam(){cam.z=clamp(cam.z,minZ(),64);const mx=VW/2/cam.z,my=VH/2/cam.z;cam.x=W*cam.z<VW?W/2:clamp(cam.x,mx*.5,W-mx*.5);cam.y=H*cam.z<VH?H/2:clamp(cam.y,my*.5,H-my*.5);}
function fitView(){cam.z=minZ();cam.x=W/2;cam.y=H/2;fly=null;}
function flyTo(x,y,z){fly={x,y,z:clamp(z||cam.z,minZ(),64),sx:cam.x,sy:cam.y,sz:cam.z,t:0};}
function zoomAt(sx,sy,f){const[wx,wy]=s2w(sx,sy);cam.z=clamp(cam.z*f,minZ(),64);cam.x=wx-(sx-VW/2)/cam.z;cam.y=wy-(sy-VH/2)/cam.z;clampCam();fly=null;}
function updateCamera(dt){
  if(fly){fly.t=Math.min(1,fly.t+dt*1.6);const e=fly.t<.5?2*fly.t*fly.t:1-Math.pow(-2*fly.t+2,2)/2;
    const lz=Math.log(fly.sz)+(Math.log(fly.z)-Math.log(fly.sz))*e;cam.z=Math.exp(lz);cam.x=lerp(fly.sx,fly.x,e);cam.y=lerp(fly.sy,fly.y,e);if(fly.t>=1)fly=null;}
  else if(FOLLOW){const p=selPos(FOLLOW);if(p){cam.x=lerp(cam.x,p[0],Math.min(1,dt*3));cam.y=lerp(cam.y,p[1],Math.min(1,dt*3));}else FOLLOW=null;}
  // keyboard pan
  const k=KEYS;const sp=600/cam.z*dt;if(k.has('KeyW')||k.has('ArrowUp'))cam.y-=sp;if(k.has('KeyS')&&!k.has('ControlLeft')||k.has('ArrowDown'))cam.y+=sp;if(k.has('KeyA')||k.has('ArrowLeft'))cam.x-=sp;if(k.has('KeyD')||k.has('ArrowRight'))cam.x+=sp;
  if(k.has('KeyQ'))zoomAt(VW/2,VH/2,Math.pow(.25,dt));if(k.has('KeyE'))zoomAt(VW/2,VH/2,Math.pow(4,dt));
  clampCam();
}
const KEYS=new Set();

const BIOME={grass:[150,120,.25],plains:[112,70,.2],forest:[140,172,.22],jungle:[222,225,.14],desert:[205,20,.2],tundra:[55,60,.2],snow:[15,110,.25],swamp:[150,242,.03],hills:[null,null,.52],mountain:[null,null,.68]};

function useTool(tx,ty,brush){

    scorch(tx,ty,Math.max(0,r-1),(i,f)=>{if(!ri_){res[i]=0;resAmt[i]=0;return;}if(f>0&&R()>.25)return;const water=isWater(ter[i]);if((ri_===RK.fish)!==water)return;res[i]=ri_;resAmt[i]=220;});return;}

      const nc=spawnTribe(i,{techs,pop,gov,origin:'spawn',imp:2});if(k==='nation'){const ct=G.cities[nc.capital];for(let q=0;q<8;q++)growTerritory(ct,40);nc.st.gold=100;nc.st.food=300;nc.st.wood=120;nc.st.stone=80;}
      fx('bless',tx,ty,{life:1.2});select({t:'civ',id:nc.id});return;}
    if(k==='remove'){if(!c){toastText('No nation here','Click inside a nation\'s borders.');return;}
      askConfirm(`Erase ${c.name} from the world? Its cities will fall to ruin.`,()=>{const nm=c.name;for(const id of c.cities.slice())destroyCity(G.cities[id],'was abandoned');if(c.alive)killCiv(c,'erased',null);logEv('collapse',3,`[[c${c.id}|${nm}]] was erased from the world by an unseen hand.`,{civs:[c.id]});closeInsp();});return;}

    else if(k==='famine')doFamine(tx,ty,Math.max(8,r*2));else if(k==='flood')doFlood(tx,ty,Math.max(6,r*2));else if(k==='fire')doFire(tx,ty,Math.max(4,r));
    return;}

      if(k==='incite'){near.unrest=Math.min(100,near.unrest+45);near.grievance+=20;near.support[-1]=(near.support[-1]||0);logEv('rebellion',1,`Agitators stirred unrest in ${TN(near)}.`,{civs:[near.civ],city:near.id,x:near.x,y:near.y});fx('curse',near.x,near.y,{life:1.2});}

function paintTerrain(k,cx,cy,r){
  const drown=[];

    const wasW=isWater(ter[i]);

    else if(k==='water'){elev[i]=Math.min(elev[i],SEA-14);}
    else if(k==='river'){if(f>.35||isWater(ter[i]))return;river[i]=Math.max(river[i],2);moist[i]=Math.min(255,moist[i]+40);}
    else{const b=BIOME[k];const lh=b[2];const target=SEA+Math.round(lh*(255-SEA));
      if(k==='hills'||k==='mountain')elev[i]=Math.max(elev[i],target);else if(wasW||landH(i)>.42||k==='swamp'||k==='jungle')elev[i]=target;
      if(b[0]!=null){temp[i]=b[0];moist[i]=b[1];}if(k==='hills'||k==='mountain'){if(temp[i]<35)temp[i]=60;}}
    if(!isWater(ter[i])||elev[i]>=SEA)ter[i]=classify(i);else if(elev[i]<SEA&&!wasW)ter[i]=T.SHALLOW;
    if(ter[i]===T.LAKE&&elev[i]>=SEA)ter[i]=classify(i);
    if(isWater(ter[i])){river[i]=0;if(impr[i]&&impr[i]!==IM.URBAN)impr[i]=0;road[i]=0;if(tCity[i]>=0){const ct=G.cities[tCity[i]];if(ct&&ct.x===i%W&&ct.y===((i/W)|0))drown.push(ct);else{tCity[i]=-1;setOwner(i,0);}}}
  });

const DB={db:null,
  open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('risefall',1);r.onupgradeneeded=()=>r.result.createObjectStore('saves');r.onsuccess=()=>{this.db=r.result;res(this.db);};r.onerror=()=>rej(r.error);});},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('saves',mode);const s=t.objectStore('saves');const q=fn(s);t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);});},
  put(k,v){return this.tx('readwrite',s=>s.put(v,k));},get(k){return this.tx('readonly',s=>s.get(k));},del(k){return this.tx('readwrite',s=>s.delete(k));},
  metas(){return this.tx('readonly',s=>s.get('__meta')).then(m=>m||{});},

    const p=(y*w+x)*4;img.data[p]=col[0];img.data[p+1]=col[1];img.data[p+2]=col[2];img.data[p+3]=255;}
  g.putImageData(img,0,0);
  c.animate?c.animate([{transform:'scale(1.15) translate(0,0)'},{transform:'scale(1.25) translate(-3%,-2%)'}],{duration:60000,iterations:Infinity,direction:'alternate'}):0;
}
function placeStartCivs(opt){
  const S0=SIZES.find(s=>s.k===opt.size);const n=Math.max(2,Math.round(S0.civs*{few:.6,normal:1,many:1.6}[opt.civs]));
  const lms=landmasses.filter(m=>m.size>150).sort((a,b)=>b.size-a.size);const total=lms.reduce((s,m)=>s+m.size,0);
  const cradle=new Set();let acc=0;for(const m of lms){if(acc<total*.42||(!cradle.size)){cradle.add(m.id);acc+=m.size;}}
  G.cradle=[...cradle];
  const cands=[];for(let k=0;k<6000;k++){const i=Math.floor(R()*N);if(isWater(ter[i])||!cradle.has(lmass[i])||TER[ter[i]].hab<.6)continue;
    const x=i%W,y=(i/W)|0;let s=0;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=ny*W+nx;s+=TER[ter[j]].hab+TER[ter[j]].food*.5+(river[j]?.8:0)+(ter[j]===T.SHALLOW?.2:0)+(res[j]?.3:0);}
    cands.push([s+R()*6,i]);}
  cands.sort((a,b)=>b[0]-a[0]);
  const minD=Math.sqrt(acc/n)*.6;const picked=[];
  for(const[s,i]of cands){if(picked.length>=n)break;const x=i%W,y=(i/W)|0;if(picked.every(p=>Math.hypot(p%W-x,((p/W)|0)-y)>=minD))picked.push(i);}
  for(const i of picked){const c=spawnTribe(i,{pop:ri(30,60),imp:1});c.st.food=40;}
  return picked.length;
}
async function createWorld(opt){
  $('#loadScr').classList.remove('hide');const bar=$('#loadBar'),msg=$('#loadMsg');
  const prog=(p,t)=>{bar.style.width=Math.round(p*100)+'%';msg.textContent=t;};
  running=false;baseImg=null;ovFlag=null;SEL=null;FOLLOW=null;CIT.clear();FX.length=0;PT.length=0;
  await yieldTick();
  G=newState(opt);AMAP=new Map();
  await generateWorld(opt,prog);
  const r=localRng(hashStr(String(opt.seed))^0x9e37);G.worldName=placeName(makeLang(r),r);
  prog(.84,'Charting paths');await yieldTick();pfInit();
  prog(.9,'Peopling the world');await yieldTick();
  const n=placeStartCivs(opt);
  prog(.96,'Painting the map');await yieldTick();
  initRender();
  logEv('found',3,`History begins on ${G.worldName}. ${n} peoples take their first steps.`,{});
  snapshot();
  $('#loadScr').classList.add('hide');$('#newWorld').classList.add('hide');
  startUI();fitView();running=true;speedIx=1;updateSpeedBtns();
}
let uiBuilt=false;
function startUI(){
  if(!uiBuilt){buildTop();buildTools();buildModes();buildFeed();buildSearch();uiBuilt=true;}
  ['#top','#tools','#feed','#modes','#mini'].forEach(s=>$(s).classList.remove('hide'));
  $('#worldName').textContent=`${G.worldName} · ${SIZES.find(s=>s.k===G.opt.size).n}`;
  setMode(MODE);feedDirty=true;closeInsp();setTool('inspect',null);
}
function onArmyRemoved(a){if(FOLLOW&&FOLLOW.t==='army'&&FOLLOW.id===a.id)FOLLOW=null;}

/* ======================= MAIN LOOP ======================= */
let lastT=performance.now(),simAcc=0,visT=0,uiT=0,inspRT=0,autoT=performance.now(),effWin=[];
function afterTicks(n){feedDirty=true;}
function updateVis(){
  const[x0,y0]=s2w(-60,-60),[x1,y1]=s2w(VW+60,VH+60);const near=cam.z>=3;
  for(const c of G.civs)c.vis=false;
  for(const ct of G.cities){if(!ct.alive)continue;ct.vis=near&&ct.x>x0&&ct.x<x1&&ct.y>y0&&ct.y<y1;if(ct.vis)G.civs[ct.civ].vis=true;}
  for(const a of G.armies)a.vis=near&&a.x>x0&&a.x<x1&&a.y>y0&&a.y<y1;
}
function frame(now){
  requestAnimationFrame(frame);
  const realDt=Math.min(1,(now-lastT)/1000);const dt=Math.min(.1,realDt);lastT=now;TIME+=dt;
  if(!G||!baseC||!baseImg)return;
  updateCamera(dt);
  let alpha=1;
  if(running&&$('#loadScr').classList.contains('hide')){
    const sp=SPEEDS[speedIx].m;const max=sp>=1e9;
    simAcc+=realDt*(max?1e6:sp);let n=Math.floor(simAcc);
    const t0=performance.now();const budget=max?22:14;let done=0;
    try{while(done<n){simTick();done++;if(performance.now()-t0>budget)break;}}catch(err){console.error(err);running=false;updateSpeedBtns();toastText('Simulation error',String(err.message||err));}
    simAcc=max?0:Math.min(simAcc-done,Math.max(1.5,sp*.25));
    effWin.push([now,done]);while(effWin.length&&now-effWin[0][0]>1500)effWin.shift();
    const tot=effWin.reduce((s,x)=>s+x[1],0);effYears=tot/12/Math.max(.3,(now-(effWin[0]?effWin[0][0]:now))/1000+dt);
    if(done)afterTicks(done);
    alpha=max?1:clamp(simAcc,0,1);
  }
  if(TIME-visT>.3){visT=TIME;updateVis();}
  if(rebuildT&&performance.now()>rebuildT)doRebuild();
  ovProcess(180000);
  const dyn=['population','culture','religion','technology','military','trade','diplomacy','colonies'].includes(MODE);
  if(dyn&&ovRow<0&&TIME-ovLast>3){ovRefreshAll(false);ovLast=TIME;}
  flushBase();
  render(dt,alpha);
  drawMini();
  if(TIME-uiT>.25){uiT=TIME;updateTop();renderFeed();}
  if(SEL&&TIME-inspRT>1.2&&!$('#insp').matches(':hover')){inspRT=TIME;renderInsp(true);}
  if(UIS.autosave&&running&&performance.now()-autoT>UIS.autosave*60000){autoT=performance.now();saveTo('auto',true);}
}
$('#mini').addEventListener('pointerdown',e=>{if(!G)return;const r=miniC.getBoundingClientRect();const f=W/r.width;cam.x=(e.clientX-r.left)*f;cam.y=(e.clientY-r.top)*f;fly=null;FOLLOW=null;clampCam();
  const mv=ev=>{cam.x=(ev.clientX-r.left)*f;cam.y=(ev.clientY-r.top)*f;clampCam();};const up=()=>{removeEventListener('pointermove',mv);removeEventListener('pointerup',up);};addEventListener('pointermove',mv);addEventListener('pointerup',up);});

/* ---------- boot ---------- */
loadSettings();resize();showNewWorld();requestAnimationFrame(frame);

</script>
