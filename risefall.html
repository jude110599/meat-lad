<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0c1017">
<title>Rise &amp; Fall</title>
<style>
:root{
  --ui:13px;
  --bg:#0c1017; --panel:rgba(17,22,31,.94); --panel2:#161c27; --panel3:#1d2431;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#e9e6dd; --mute:#99a0ad; --dim:#666d7a;
  --gold:#e0b862; --gold2:#f3d796; --red:#e5584f; --green:#6fc36b; --blue:#5aa9e6; --purple:#b48cf0; --orange:#f0994a; --teal:#4fc7b8;
  --serif:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
html.hc{--panel:rgba(6,8,12,.98);--line:rgba(255,255,255,.28);--line2:rgba(255,255,255,.45);--mute:#c9ced8;--dim:#a2a9b6;--text:#fff}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:var(--ui)}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{position:fixed;inset:0;font-family:var(--sans);color:var(--text);-webkit-user-select:none;user-select:none;touch-action:none}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
canvas#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
canvas#map.drag{cursor:grabbing}
canvas#map.brush{cursor:crosshair}
.hide{display:none!important}
svg.i{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-.22em}
svg.i.f{fill:currentColor;stroke:none}
.serif{font-family:var(--serif)}
.pn{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.35);backdrop-filter:blur(6px)}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:.4em;height:2.3rem;min-width:2.3rem;padding:0 .6rem;border-radius:8px;color:var(--mute);transition:background .12s,color .12s}
.ib:hover{background:rgba(255,255,255,.07);color:var(--text)}
.ib.on{background:rgba(224,184,98,.16);color:var(--gold2)}
.ib:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45em;padding:.55rem 1rem;border-radius:8px;background:rgba(255,255,255,.06);border:1px solid var(--line2);font-weight:600;color:var(--text)}
.btn:hover{background:rgba(255,255,255,.11)}
.btn.pri{background:linear-gradient(180deg,#e7c16f,#c99a3e);color:#1d1406;border-color:#f0d08a}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:.3rem .6rem;font-size:.9rem}
.btn.danger{border-color:rgba(229,88,79,.5);color:#ffb3ad}
.chip{display:inline-flex;align-items:center;gap:.35em;padding:.15rem .5rem;border-radius:99px;background:rgba(255,255,255,.06);font-size:.88rem;color:var(--mute);white-space:nowrap}
.flag{display:inline-block;vertical-align:middle;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.5);image-rendering:auto}
.sw{display:inline-block;width:.8em;height:.8em;border-radius:3px;vertical-align:-.05em}
.lnk{color:var(--gold2);cursor:pointer;border-bottom:1px dotted rgba(243,215,150,.35)}
.lnk:hover{color:#fff}
.mute{color:var(--mute)} .dim{color:var(--dim)} .good{color:var(--green)} .bad{color:var(--red)} .warn{color:var(--orange)}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#3a4252 transparent}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#3a4252;border-radius:4px}

/* ---------- top bar ---------- */
#top{position:absolute;left:8px;right:8px;top:8px;height:3.2rem;display:flex;align-items:center;gap:.5rem;padding:0 .4rem;z-index:5}
#brand{font-family:var(--serif);font-weight:700;letter-spacing:.08em;color:var(--gold2);font-size:1.15rem;padding:0 .5rem;white-space:nowrap;cursor:pointer}
#brand small{display:block;font-family:var(--sans);font-weight:400;letter-spacing:.02em;color:var(--dim);font-size:.72rem;margin-top:-.1rem}
.sep{width:1px;height:1.8rem;background:var(--line)}
#dateBox{min-width:9.5rem;text-align:center;line-height:1.05}
#dateBox b{font-family:var(--serif);font-size:1.2rem;color:var(--text)}
#dateBox span{display:block;font-size:.75rem;color:var(--mute)}
#speeds{display:flex;gap:2px}
#speeds .ib{min-width:2.1rem;padding:0 .35rem;font-size:.85rem;font-weight:700}
#effSpeed{font-size:.72rem;color:var(--dim);min-width:4.5rem}
#worldStats{display:flex;gap:.35rem;margin-left:auto;flex-wrap:nowrap;overflow:hidden}
#topBtns{display:flex;gap:2px}
#search{position:relative}
#search input{width:13rem;height:2.2rem;border-radius:8px;border:1px solid var(--line2);background:rgba(0,0,0,.3);padding:0 .6rem 0 2rem;outline:none}
#search input:focus{border-color:var(--gold)}
#search svg{position:absolute;left:.6rem;top:.55rem;color:var(--dim)}
#searchRes{position:absolute;top:2.6rem;right:0;width:22rem;max-height:60vh;padding:.3rem;z-index:30}
.sr{display:flex;align-items:center;gap:.55rem;padding:.4rem .5rem;border-radius:6px;cursor:pointer}
.sr:hover,.sr.act{background:rgba(255,255,255,.07)}
.sr .k{margin-left:auto;font-size:.75rem;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}

/* ---------- left toolbar ---------- */
#tools{position:absolute;left:8px;top:4.2rem;width:3rem;padding:.3rem;display:flex;flex-direction:column;gap:3px;z-index:5}
#tools .ib{width:2.3rem;padding:0}
#toolFly{position:absolute;left:3.8rem;top:4.2rem;width:15.5rem;padding:.7rem;z-index:6}
#toolFly h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin-bottom:.45rem}
.tgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:.6rem}
.tgrid button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:.45rem .2rem;border-radius:7px;background:rgba(255,255,255,.04);font-size:.76rem;color:var(--mute);border:1px solid transparent}
.tgrid button:hover{background:rgba(255,255,255,.09);color:var(--text)}
.tgrid button.on{border-color:var(--gold);color:var(--gold2);background:rgba(224,184,98,.12)}
.tgrid .tsw{width:1.4rem;height:1.1rem;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.3)}
.row{display:flex;align-items:center;gap:.5rem}
input[type=range]{accent-color:var(--gold);width:100%}
.hint{font-size:.8rem;color:var(--dim);line-height:1.4}

/* ---------- inspector ---------- */
#insp{position:absolute;left:3.9rem;top:4.2rem;bottom:4.6rem;width:24rem;display:flex;flex-direction:column;z-index:4;overflow:hidden}
#insp .hd{padding:.8rem .9rem .5rem;border-bottom:1px solid var(--line);position:relative}
#insp .hd h2{font-family:var(--serif);font-size:1.35rem;font-weight:700;line-height:1.15;padding-right:4.5rem}
#insp .hd .sub{color:var(--mute);font-size:.88rem;margin-top:.2rem}
#insp .hdBtns{position:absolute;right:.4rem;top:.45rem;display:flex}
#insp .tabs{display:flex;gap:2px;padding:.35rem .5rem 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs button{padding:.45rem .6rem;font-size:.86rem;color:var(--mute);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
#insp .bd{flex:1;padding:.7rem .9rem 1rem}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:.35rem .8rem;margin:.3rem 0 .7rem}
.kv div{font-size:.9rem;display:flex;justify-content:space-between;gap:.4rem;border-bottom:1px dashed rgba(255,255,255,.05);padding:.15rem 0}
.kv div span:first-child{color:var(--mute)}
.kv div span:last-child{text-align:right;font-weight:600}
.sec{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;color:var(--gold);margin:.9rem 0 .4rem;display:flex;align-items:center;gap:.4rem}
.sec:after{content:"";flex:1;height:1px;background:var(--line)}
.bar{height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.list .li{display:flex;align-items:center;gap:.5rem;padding:.35rem .3rem;border-radius:6px;font-size:.9rem}
.list .li:hover{background:rgba(255,255,255,.05)}
.list .li .r{margin-left:auto;color:var(--mute);font-size:.84rem;text-align:right}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:.35rem}
.res div{background:rgba(255,255,255,.035);border-radius:7px;padding:.4rem .45rem;font-size:.82rem}
.res div b{display:block;font-size:1rem;margin-top:.1rem}
.res div .d{font-size:.74rem}
.tl{position:relative;padding-left:1rem;border-left:2px solid rgba(224,184,98,.25);margin-left:.3rem}
.tl .ev{position:relative;padding:.25rem 0 .45rem;font-size:.88rem;line-height:1.35}
.tl .ev:before{content:"";position:absolute;left:-1.37rem;top:.5rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--panel3);border:2px solid var(--gold)}
.tl .ev.i3:before{background:var(--gold)}
.tl .ev .y{color:var(--gold2);font-weight:700;margin-right:.35rem;font-variant-numeric:tabular-nums}
.story{font-family:var(--serif);font-size:1rem;line-height:1.55;color:#d9d4c7}
.story p{margin-bottom:.6rem}
.badge{display:inline-block;padding:.05rem .4rem;border-radius:4px;font-size:.74rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:.05em}
canvas.chart{width:100%;height:9rem;display:block;background:rgba(0,0,0,.18);border-radius:8px}

/* ---------- feed ---------- */
#feed{position:absolute;right:8px;top:4.2rem;width:21rem;max-height:calc(100% - 22rem);display:flex;flex-direction:column;z-index:4}
#feed .fh{display:flex;align-items:center;gap:.4rem;padding:.45rem .6rem;border-bottom:1px solid var(--line)}
#feed .fh b{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);flex:1}
#feed select{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:6px;padding:.15rem .3rem;font-size:.82rem}
#feedList{padding:.3rem;flex:1;min-height:0}
.fe{display:flex;gap:.5rem;padding:.4rem .45rem;border-radius:6px;font-size:.87rem;line-height:1.35;cursor:pointer;animation:fin .35s ease}
.fe:hover{background:rgba(255,255,255,.05)}
.fe .ic{width:1.6rem;height:1.6rem;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.fe .y{font-size:.74rem;color:var(--dim)}
.fe.i3{background:rgba(224,184,98,.07)}
@keyframes fin{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
html.rm .fe,html.rm .toast{animation:none}
#feed.min #feedList{display:none}

/* ---------- bottom ---------- */
#modes{position:absolute;left:50%;transform:translateX(-50%);bottom:8px;display:flex;gap:2px;padding:.3rem;z-index:5}
#modes .ib{flex-direction:column;height:auto;padding:.3rem .45rem;gap:1px;font-size:.68rem;min-width:3.4rem}
#modes .ib svg{width:1.35em;height:1.35em}
#legend{position:absolute;left:3.9rem;bottom:8px;max-width:22rem;padding:.5rem .7rem;z-index:4;font-size:.82rem}
#legend .lg{display:flex;flex-wrap:wrap;gap:.25rem .8rem}
#legend .lg span{display:inline-flex;align-items:center;gap:.3rem;color:var(--mute)}
#legend .grad{height:8px;border-radius:4px;margin:.3rem 0 .15rem}
#mini{position:absolute;right:8px;bottom:8px;padding:4px;z-index:4}
#mini canvas{display:block;border-radius:6px;cursor:pointer}
#tileInfo{position:absolute;right:8px;padding:.35rem .6rem;font-size:.8rem;color:var(--mute);z-index:4;pointer-events:none;white-space:nowrap}

/* ---------- toasts / tooltip ---------- */
#toasts{position:absolute;top:4.4rem;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.4rem;z-index:20;pointer-events:none}
.toast{pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:.6rem;padding:.45rem .8rem;border-radius:10px;background:rgba(14,18,26,.94);border:1px solid rgba(224,184,98,.4);box-shadow:0 8px 30px rgba(0,0,0,.45);font-size:.88rem;max-width:30rem;animation:tin .4s ease}
.toast .t1{font-family:var(--serif);font-weight:700;color:var(--gold2)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#tip{position:fixed;z-index:50;pointer-events:none;background:rgba(10,13,19,.97);border:1px solid var(--line2);border-radius:7px;padding:.4rem .6rem;font-size:.84rem;max-width:20rem;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#tip b{color:var(--gold2)}
#tip kbd,kbd{font-family:var(--sans);font-size:.75rem;background:rgba(255,255,255,.1);border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 .3rem;margin-left:.3rem}

/* ---------- modals ---------- */
.modal{position:absolute;inset:0;background:rgba(5,7,11,.6);display:flex;align-items:center;justify-content:center;z-index:30}
.modal>.pn{width:min(78rem,94vw);height:min(52rem,88vh);display:flex;flex-direction:column;overflow:hidden}
.modal .mh{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.modal .mh h2{font-family:var(--serif);font-size:1.4rem;flex:1}
.modal .mb{flex:1;min-height:0;display:flex;flex-direction:column}
.tbar{display:flex;gap:.5rem;align-items:center;padding:.6rem 1rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar input,.tbar select{background:rgba(0,0,0,.3);border:1px solid var(--line2);border-radius:6px;padding:.3rem .5rem}
table.st{width:100%;border-collapse:collapse;font-size:.9rem}
table.st th{position:sticky;top:0;background:#171d28;text-align:left;font-weight:600;color:var(--mute);padding:.5rem .6rem;cursor:pointer;white-space:nowrap;border-bottom:1px solid var(--line2);font-size:.82rem}
table.st th:hover{color:var(--text)}
table.st th.s{color:var(--gold2)}
table.st td{padding:.4rem .6rem;border-bottom:1px solid rgba(255,255,255,.04);white-space:nowrap}
table.st tr:hover td{background:rgba(255,255,255,.035)}
table.st td.n{text-align:right;font-variant-numeric:tabular-nums}
table.st tr.dead td{opacity:.55}
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(20rem,1fr));gap:.4rem 2rem;padding:1rem 1.2rem}
.set h3{grid-column:1/-1;font-family:var(--serif);font-size:1.1rem;color:var(--gold2);margin-top:.6rem;border-bottom:1px solid var(--line);padding-bottom:.3rem}
.set label{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.35rem 0;font-size:.92rem}
.set label small{display:block;color:var(--dim);font-size:.78rem}
.set select{background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:6px;padding:.25rem .4rem;min-width:8rem}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:7px;overflow:hidden}
.seg button{padding:.25rem .6rem;font-size:.84rem;color:var(--mute)}
.seg button.on{background:rgba(224,184,98,.2);color:var(--gold2)}
.slot{display:flex;align-items:center;gap:1rem;padding:.8rem 1rem;border-bottom:1px solid var(--line)}
.slot canvas{border-radius:6px;background:#000;flex-shrink:0}
.slot .meta{flex:1;font-size:.9rem;line-height:1.5}
.slot .meta b{font-family:var(--serif);font-size:1.05rem}

/* ---------- new world ---------- */
#newWorld{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#0a0d13}
#nwBg{position:absolute;inset:0;width:100%;height:100%;opacity:.55;filter:saturate(1.1)}
#nwVeil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(10,13,19,.35) 0%,rgba(10,13,19,.92) 75%)}
#nwBox{position:relative;width:min(62rem,94vw);max-height:94vh;padding:1.6rem 2rem 1.4rem}
#nwBox h1{font-family:var(--serif);font-size:3.4rem;letter-spacing:.14em;text-align:center;color:var(--gold2);text-shadow:0 3px 24px rgba(224,184,98,.25);line-height:1}
#nwBox .tag{text-align:center;color:var(--mute);letter-spacing:.3em;text-transform:uppercase;font-size:.78rem;margin:.5rem 0 1.3rem}
.sizes{display:grid;grid-template-columns:repeat(7,1fr);gap:.45rem;margin-bottom:1rem}
.sizes button{padding:.7rem .3rem .6rem;border-radius:9px;background:rgba(255,255,255,.04);border:1px solid var(--line);text-align:center;transition:.15s}
.sizes button:hover{background:rgba(255,255,255,.08)}
.sizes button.on{border-color:var(--gold);background:rgba(224,184,98,.12)}
.sizes b{display:block;font-family:var(--serif);font-size:1.02rem}
.sizes small{display:block;color:var(--dim);font-size:.72rem;margin-top:.15rem}
.sizes .sq{margin:0 auto .45rem;border:1.5px solid var(--gold);border-radius:3px;opacity:.7}
.nwOpts{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem 1.2rem;margin-bottom:1.2rem}
.nwOpts label{font-size:.8rem;color:var(--mute);text-transform:uppercase;letter-spacing:.08em;display:flex;flex-direction:column;gap:.3rem}
.nwOpts .seg{width:100%}
.nwOpts .seg button{flex:1;text-transform:none;letter-spacing:0}
.nwOpts input{background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:7px;padding:.35rem .5rem;text-transform:none;letter-spacing:0;font-size:.95rem}
#nwGo{display:flex;gap:.6rem;justify-content:center}
#nwGo .btn{padding:.75rem 1.6rem;font-size:1.05rem}
#loadScr{position:absolute;inset:0;z-index:45;background:#0a0d13;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem}
#loadScr h3{font-family:var(--serif);font-size:1.5rem;color:var(--gold2);letter-spacing:.1em}
#loadScr .bar{width:22rem;height:8px}
#loadScr .bar i{background:linear-gradient(90deg,#c99a3e,#f3d796);transition:width .15s}
#loadMsg{color:var(--mute);font-size:.9rem;min-height:1.2em}

@media (max-width:900px){
  #feed{width:16rem} #insp{width:calc(100vw - 5rem)} #worldStats{display:none} #search input{width:8rem}
  .sizes{grid-template-columns:repeat(4,1fr)} .nwOpts{grid-template-columns:1fr 1fr} #nwBox h1{font-size:2.4rem}
  #modes .ib span{display:none} #modes .ib{min-width:2.3rem}
}
</style>
</head>
<body>
<canvas id="map"></canvas>

<div id="top" class="pn hide">
  <div id="brand" title="Main menu">RISE &amp; FALL<small id="worldName">—</small></div>
  <div class="sep"></div>
  <div id="dateBox"><b id="dYear">Year 1</b><span id="dSub">Early Spring · Primitive</span></div>
  <div id="speeds"></div>
  <div id="effSpeed"></div>
  <div id="worldStats"></div>
  <div id="search"><svg class="i" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M20 20l-4.8-4.8"/></svg><input id="q" placeholder="Search nations, cities, people…  /" autocomplete="off" spellcheck="false"><div id="searchRes" class="pn scroll hide"></div></div>
  <div id="topBtns"></div>
</div>

<div id="tools" class="pn hide"></div>
<div id="toolFly" class="pn hide"></div>
<div id="insp" class="pn hide"></div>
<div id="feed" class="pn hide">
  <div class="fh"><b>Chronicle</b>
    <select id="feedFilter" title="Filter events"></select>
    <button class="ib" id="feedMin" title="Collapse feed" style="height:1.8rem;min-width:1.8rem"></button>
  </div>
  <div id="feedList" class="scroll"></div>
</div>
<div id="legend" class="pn hide"></div>
<div id="modes" class="pn hide"></div>
<div id="tileInfo" class="pn hide"></div>
<div id="mini" class="pn hide"><canvas id="miniC"></canvas></div>
<div id="toasts"></div>
<div id="tip" class="hide"></div>
<div id="modal" class="modal hide"></div>

<div id="newWorld">
  <canvas id="nwBg"></canvas><div id="nwVeil"></div>
  <div id="nwBox" class="pn scroll">
    <h1>RISE &amp; FALL</h1>
    <div class="tag">A living history generator</div>
    <div class="sizes" id="nwSizes"></div>
    <div class="nwOpts" id="nwOpts"></div>
    <div id="nwGo">
      <button class="btn" id="nwLoad">Load world</button>
      <button class="btn pri" id="nwCreate">Create world</button>
    </div>
    <p class="hint" style="text-align:center;margin-top:.9rem">You are the observer. Nations are founded, colonize, trade, conquer, rebel and fall on their own. Shape the land and nudge history with the sandbox tools.</p>
  </div>
</div>
<div id="loadScr" class="hide"><h3>Shaping the world</h3><div class="bar"><i id="loadBar" style="width:0"></i></div><div id="loadMsg"></div></div>

<script>
'use strict';
/* ======================================================================
   RISE & FALL — a living history generator
   Everything below runs in one page: world generation, an abstract
   statistical simulation of every nation/city (with detailed agents
   only near the camera), a chunked pixel-art renderer, and the UI.
   ====================================================================== */

/* ---------- multipliers from technology ---------- */

function techProgress(c,dt){

/* ---------- city simulation ---------- */
function stageFor(ct){return unrestStage(ct.unrest);}
function updateCity(ct,dt){

  const era=c.era,P=ct.pop,w=PERS[c.pers].w;

  const spec=ct.spec;
  // --- food & capacity ---

  if(ct.famine>0){foodPot*=.35;ct.famine-=dt;}

  const imp=ct.tier>=3&&c.st.food>1?localCap*(.25+(ct.capital?.35:0)+(spec==='trade'||spec==='port'?.2:0)+era*.04):0;

  ct.cap=cap;
  const prodF=(stageFor(ct)>=2?.85:1)*(ct.siege?.4:1);
  const foodProd=Math.min(P,localCap)*.0115*prodF+ (ct.plague>0?-P*.001:0);
  const foodUse=P*.01;
  let bal=foodProd-foodUse;
  // colonies ship a share of their surplus home; the rest stays local
  c.flowAcc.food=(c.flowAcc.food||0)+bal*dt;
  c.st.food+=bal*dt;
  ct.fb=bal;
  // --- growth ---
  const r=.0032*(1+traitSum(c,'growth'))*(1-ext*.45)*(ct.capital?1.1:1);
  let dP;
  if(c.famine>0&&P>localCap)dP=-P*.012*dt;                       // starvation

  const tax=ct.pop*.001*E_WEALTH[era]*c.tax*(GOVS[c.gov].tax)*(1+c.m.gold+traitSum(c,'gold'))*(stageFor(ct)>=3?.6:1)*indB*colonyShare;

function tierFor(p){let t=0;for(let k=0;k<TIERS.length;k++)if(p>=TIERS[k].p)t=k;return t;}

function layoutUrban(ct){

function buildRoad(a,b,kind){

/* ---------- unrest, identity, rebellion pressure ---------- */
const _noWhy={};
function unrestTarget(ct,c,ext,wantWhy){
  const cap=G.cities[c.capital];
  let t=0;const why=wantWhy?{}:_noWhy;
  const add=wantWhy?(k,v)=>{t+=v;if(Math.abs(v)>=1)why[k]=(why[k]||0)+v;}:(k,v)=>{t+=v;};
  add('Status',{core:0,colony:8,occupied:18,autonomous:-4}[ct.status]);
  if(cap&&!ct.capital){let d=dist(ct.x,ct.y,cap.x,cap.y);if(ct.lm!==cap.lm)d*=1.5;add('Distance from capital',Math.min(28,d/(E_ADMIN[c.era]*(GOVS[c.gov].admin+c.m.admin))*8));}
  add('Taxation',c.tax*12+ext*26);
  if(ct.culture!==c.culture)add('Foreign culture',(culturesRelated(ct.culture,c.culture)?6:12)*(1-ct.assim*.8));
  if(G.tick-(ct.lastReb||-9999)<(ct.rebN||1)*120)add('Fear of reprisals',-12);
  if(ct.religion!==c.religion&&ct.religion>=0)add('Foreign faith',6);
  if(c.famine>0||ct.famine>0)add('Famine',15);
  add('Instability',(50-c.stab)/3);
  add('War weariness',c.exh*.12);
  add('Grievances',ct.grievance*.35);
  if(ct.formerCap>=0&&G.civs[ct.formerCap]&&ct.formerCap!==c.id)add('Lost nationhood',10);
  let sup=0;for(const k in ct.support)sup+=ct.support[k];if(sup>0)add('Foreign agitation',Math.min(18,sup*.4));
  if(ct.pop>5000&&ct.status!=='core')add('Local power',Math.min(10,Math.log10(ct.pop/5000)*8+2));

}
function updateUnrest(ct,c,dt,ext){

    if(up&&s>=2&&s<=4&&s>(ct.logSt||0)&&G.year-(ct.logY||-99)>=12){ct.logSt=s;ct.logY=G.year;const big=ct.pop>2500||(ct.status!=='core'&&ct.pop>600);
      if(big)logEv('rebellion',s>=4?2:1,[,,`Protests broke out in ${TN(ct)} against ${CN(c)} rule.`,`Organised resistance to ${CN(c)} spread through ${TN(ct)}.`,`Rebel groups took up arms in the hills around ${TN(ct)}.`][s],{civs:[c.id],city:ct.id,x:ct.x,y:ct.y});}

/* ---------- nations: monthly & yearly ---------- */
function civMonth(c,dt=1){
  // army upkeep
  const era=c.era;
  const sold=c._sold||0;
  c.soldiers=sold;
  const up=sold*.004*E_WEALTH[era]*(GOVS[c.gov].mil?0.85:1)*dt;
  c.st.gold-=up;c.flowAcc.gold=(c.flowAcc.gold||0)-up;
  const fu=sold*.012*dt;c.st.food-=fu;c.flowAcc.food=(c.flowAcc.food||0)-fu;
  if(era>=3){c.st.iron-=Math.min(c.st.iron,sold*.0006*dt);}
  // caps
  const store=1+c.m.store;
  c.st.food=Math.min(c.st.food,(80+c.pop*.25)*store);
  for(const k of['wood','stone','iron','coal','horses','lux','oil'])c.st[k]=clamp(c.st[k],0,(60+c.pop*.06)*store);
  if(c.st.food<0){c.famine=6;c.st.food=0;}else if(c.famine>0)c.famine=Math.max(0,c.famine-dt);
  techProgress(c,dt);
  let atw=false;for(const k in c.enemies){atw=true;break;}if(!atw)c.exh=Math.max(0,c.exh-.4*dt);
}
function civYear(c){

  c.pop=pop;c.tiles=tiles;

  c.power=civPower(c);c.wealth=c.st.gold+ (c.flow.gold||0)*12;
  const S=c.stats;if(pop>S.peakPop){S.peakPop=pop;S.peakPopY=G.year;}if(tiles>S.peakTiles){S.peakTiles=tiles;S.peakTilesY=G.year;}if(c.cities.length>S.peakCities)S.peakCities=c.cities.length;

  if(c.hist.length>600)c.hist.splice(0,c.hist.length-600);

function cityYearIdentity(ct,c){

  if(ct.formerCap>=0&&(!G.civs[ct.formerCap]||!G.civs[ct.formerCap].alive)&&G.year-ct.statusSince>150)ct.formerCap=-1;

function considerGov(c,newTech){

    if(c.cities.length>=2)logEv('leader',1,`${CN(c)} adopted a new form of government: ${GOVS[best].n}.`,{civs:[c.id]});}
}
function leaderYear(c){
  const l=c.leader;if(!l)return;const age=G.year-l.born;

  const g=GOVS[c.gov];
  if(g.elect&&G.year-l.from>=g.elect){endReign(c,'left office');newReign(c);return;}
  if(R()<p){endReign(c,'died');

function endReign(c,how){const l=c.leader;const yrs=G.year-l.from;

  if(c.cities.length>=5&&yrs>=20&&how==='died')logEv('leader',1,`${leaderStr(c)} of ${CN(c)} died after ${yrs} years of rule.`,{civs:[c.id]});}
function newReign(c){
  const g=GOVS[c.gov];const dyn=!g.elect&&c.leader&&R()<.75;
  const nl=newLeader(c,{age:g.elect?ri(40,60):ri(16,40)});

/* ---------- power ---------- */
function unitPow(c,k,def){const u=UNITS[k];return(def?u.d:u.p)*E_POW[c?c.era:0];}
function civPower(c){let p=0;for(const a of(ARMS_BY.size?ARMS_BY.get(c.id)||[]:G.armies.filter(a=>a.civ===c.id&&a.type==='army')))if(AMAP.has(a.id))p+=armyPower(a,false);for(const id of c.cities){const ct=G.cities[id];p+=ct.garrison*E_POW[c.era]*(1+ct.walls*.3)*.5;}return p;}

/* ---------- city transfer, nation birth & death ---------- */
function transferCity(ct,nc,how,byCiv){
  const old=G.civs[ct.civ];if(!nc||old===nc)return;
  old.cities=old.cities.filter(id=>id!==ct.id);
  nc.cities.push(ct.id);
  ct.prev.push({c:old.id,n:old.name,to:G.year,how});
  const wasCap=ct.capital;ct.capital=false;
  if(wasCap){ct.formerCap=ct.formerCap>=0?ct.formerCap:old.id;}
  ct.civ=nc.id;ct.siege=null;ct.garrison=Math.max(3,ct.garrison*.2);
  const reclaim=ct.culture===nc.culture||ct.founder===nc.id;
  const cap=G.cities[nc.capital];
  if(how==='conquest'){ct.status=reclaim?'core':'occupied';ct.unrest=reclaim?15:Math.max(ct.unrest,45);ct.grievance+=reclaim?0:(nc.leader&&nc.leader.traits.includes('cruel')?35:12);ct.pop*=nc.leader&&nc.leader.traits.includes('cruel')?.82:.93;}
  else if(how==='cession'){ct.status=reclaim?'core':'occupied';ct.unrest=Math.max(20,ct.unrest*.8);}
  else{ct.status=cap&&cap.lm===ct.lm?'core':'colony';ct.unrest=Math.min(ct.unrest,20);}
  if(ct.status==='core'&&cap&&cap.lm!==ct.lm)ct.status='colony';
  if(ct.formerCap===nc.id)ct.formerCap=-1;
  ct.statusSince=G.year;ct.assim=ct.culture===nc.culture?1:0;ct.walls=Math.max(0,ct.walls-(how==='conquest'?1:0));
  ct.rebelArmy=-1;ct.support={};ct.roadTo=-1;
  cleanTiles(ct);for(const i of ct.tiles)setOwner(i,nc.id+1);
  if(nc.capital<0||!G.cities[nc.capital]||G.cities[nc.capital].civ!==nc.id)setCapital(nc,ct);
  if(wasCap&&old.cities.length){
    const nb=old.cities.map(id=>G.cities[id]).sort((a,b)=>b.pop-a.pop)[0];
    old.capital=-1;setCapital(old,nb,`after losing ${TN(ct)}`);old.capLostY=G.year;old.stab-=15;
  }
  // trade routes touching this city lapse
  for(const r of G.routes)if(r.a===ct.id||r.b===ct.id)r.dead=1;
  G.routes=G.routes.filter(r=>!r.dead);
  if(!old.cities.length)killCiv(old,how,nc);
}
function killCiv(c,how,by){
  if(!c.alive)return;c.alive=false;c.fell=G.year;c.capital=-1;
  const age=G.year-c.founded;const big=c.stats.peakCities>=4||age>150;
  const txt=by?(how==='conquest'?`${CN(c)} was conquered by ${CN(by)} and ceased to exist after ${age} years.`:`${CN(c)} was absorbed into ${CN(by)} after ${age} years.`):`${CN(c)} collapsed and vanished from history after ${age} years.`;
  logEv('collapse',big?3:2,txt,{civs:[c.id].concat(by?[by.id]:[])});
  for(const w of G.wars)if(w.active&&(w.A.includes(c.id)||w.D.includes(c.id)))leaveWar(w,c);
  for(const a of G.armies.slice())if(a.civ===c.id)removeArmy(a);
  for(const s of c.subjects){const o=G.civs[s];if(o&&o.overlord===c.id)freeSubject(o,'overlord fell');}
  if(c.overlord>=0){const o=G.civs[c.overlord];if(o)o.subjects=o.subjects.filter(x=>x!==c.id);}
  for(const k in c.rel){const o=G.civs[k];if(o)delete o.rel[c.id];}
  c.rel={};c.enemies={};
}
function freeSubject(c,why){const o=G.civs[c.overlord];c.overlord=-1;c.subType=null;if(o)o.subjects=o.subjects.filter(x=>x!==c.id);
  if(why==='tribute ended')logEv('diplomacy',1,`${CN(c)} completed its tribute payments${o?` to ${CN(o)}`:''}.`,{civs:[c.id]});}
function spawnCivFromCities(ids,o){
  const cs=ids.map(i=>G.cities[i]).filter(x=>x&&x.alive);if(!cs.length)return null;
  const par=o.from!=null?G.civs[o.from]:null;
  cs.sort((a,b)=>b.pop-a.pop);const capCity=cs[0];
  const cul=o.culture!=null?o.culture:capCity.culture;
  let base=o.base,restored=false;
  if(!base&&capCity.formerCap>=0){const fc=G.civs[capCity.formerCap];if(fc&&!fc.alive&&fc.culture===cul){base=fc.base;restored=true;}}
  if(!base)base=cul!==(par?par.culture:-1)&&R()<.5?G.cultures[cul].name.replace(/(ian|ish|ese|ic|an|ite|ean|ar|ene)$/,'')+pick(['ia','a','land','']):capCity.name;
  const pers=o.pers||(par&&R()<.35?par.pers:pick(PK));
  const nc=makeCiv({culture:cul,religion:capCity.religion,base,gov:o.gov||'provisional',pers,origin:{t:o.origin,from:par?par.id:-1,y:G.year},techs:par?Array.from(par.tech):null,col:restored?G.civs[capCity.formerCap].col:null,flag:restored?G.civs[capCity.formerCap].flag:null});
  if(par){nc.future=par.future;recalcMult(nc);nc.know=0;}
  if(restored){nc.name=formalName(nc);}
  for(const ct of cs){if(ct.civ===nc.id)continue;const oc=G.civs[ct.civ];transferCity(ct,nc,o.origin==='civilwar'?'civilwar':'independence');}
  for(const ct of cs){ct.status='core';ct.unrest=Math.min(ct.unrest,25);ct.grievance*=.5;ct.formerCap=-1;ct.diverge=0;}
  if(nc.capital!==capCity.id){nc.capital=-1;setCapital(nc,capCity);}
  // take a share of the parent's stores
  if(par&&par.pop>0){const f=Math.min(.6,nc.cities.reduce((s,id)=>s+G.cities[id].pop,0)/(par.pop+1));for(const k of STK){const v=Math.max(0,par.st[k])*f;par.st[k]-=v;nc.st[k]=v;}}
  if(o.overlord!=null){nc.overlord=o.overlord;nc.subType=o.subType;nc.subSince=G.year;G.civs[o.overlord].subjects.push(nc.id);}
  nc.stab=o.origin==='civilwar'?40:55;
  civYear(nc);
  return nc;
}

/* ======================= SIMULATION: MOVEMENT, WAR, DIPLOMACY ======================= */
const SET={ // replaced by settings module on load
  sim:{distInt:4,ai:2,think:6,tribes:1,disasters:1,citizens:1,path:1,pop:1},
};

/* ---------- coarse-grid A* (land / amphibious / sea) ---------- */
const PF={g:null,from:null,stamp:null,wr:null,st:0,heap:new Heap(8192),cache:new Map(),budget:0};
function pfInit(){const n=CW*CH;PF.g=new Float32Array(n);PF.from=new Int32Array(n);PF.stamp=new Uint32Array(n);PF.wr=new Uint16Array(n);PF.st=0;PF.cache.clear();}
function cellOf(x,y){return clamp((y/CS)|0,0,CH-1)*CW+clamp((x/CS)|0,0,CW-1);}
function passable(c,mode){return mode===0?cellLand[c]:mode===2?cellWater[c]:(cellLand[c]|cellWater[c]);}
function nearestPass(c,mode){if(passable(c,mode))return c;const cx=c%CW,cy=(c/CW)|0;
  for(let r=1;r<7;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){if(Math.max(Math.abs(dx),Math.abs(dy))!==r)continue;const nx=cx+dx,ny=cy+dy;if(nx<0||ny<0||nx>=CW||ny>=CH)continue;const n=ny*CW+nx;if(passable(n,mode))return n;}return -1;}
function findPath(sx,sy,tx,ty,mode,range){
  let s=nearestPass(cellOf(sx,sy),mode),t=nearestPass(cellOf(tx,ty),mode);
  if(s<0||t<0)return null;
  if(mode===1&&compLand[s]>=0&&compLand[s]===compLand[t]){mode=0;}
  const fk=mode===1?`f|${compLand[s]}|${compLand[t]}|${Math.round(range/10)}`:null;if(fk&&PF.cache.get(fk)===null)return null;
  if(mode===0&&compLand[s]!==compLand[t])return null;
  if(mode===2&&compSea[s]!==compSea[t])return null;
  const key=s*4+mode+'|'+t+'|'+(mode===1?Math.min(999,Math.round(range)):0);
  let cells=PF.cache.get(key);
  if(cells===undefined){
    if(PF.budget<=0)return undefined;       // out of budget this tick: try later
    PF.budget--;
    cells=astar(s,t,mode,range);
    if(PF.cache.size>800){const k=PF.cache.keys().next().value;PF.cache.delete(k);}
    PF.cache.set(key,cells);
    if(!cells&&fk)PF.cache.set(fk,null);
  }
  if(!cells)return null;
  const out=[];
  for(let k=1;k<cells.length-1;k++){const c=cells[k];out.push((c%CW)*CS+CS/2,((c/CW)|0)*CS+CS/2);}
  out.push(tx,ty);
  return out;
}
function astar(s,t,mode,range){
  const {g,from,stamp,wr,heap}=PF;const st=++PF.st;heap.clear();
  const tx=t%CW,ty=(t/CW)|0;const hm=mode===0?1:.45;
  const hfn=c=>{const dx=Math.abs(c%CW-tx),dy=Math.abs(((c/CW)|0)-ty);return(Math.max(dx,dy)+.414*Math.min(dx,dy))*hm;};
  g[s]=0;stamp[s]=st;from[s]=-1;wr[s]=0;heap.push(s,hfn(s));
  const maxRun=mode===1?Math.max(1,range/CS):1e9;let n=0;
  while(heap.n){
    const cur=heap.pop();if(cur===t)break;
    if(++n>(mode===1?25000:40000))return null;
    const cx=cur%CW,cy=(cur/CW)|0;const gc=g[cur];
    const curW=cellWater[cur]&&!cellLand[cur];
    for(let k=0;k<8;k++){const nx=cx+DX8[k],ny=cy+DY8[k];if(nx<0||ny<0||nx>=CW||ny>=CH)continue;const nb=ny*CW+nx;
      if(!passable(nb,mode))continue;
      const nw=cellWater[nb]&&!cellLand[nb];
      let cost;
      if(mode===2)cost=.45;
      else if(mode===0)cost=cellCost[nb];
      else{cost=nw?.45:(cellWater[nb]?Math.min(cellCost[nb],.7):cellCost[nb]);if(nw&&!curW)cost+=7;if(!nw&&curW)cost+=3;}
      if(k>=4)cost*=1.414;
      const run=nw?(curW?wr[cur]+1:1):0;
      if(run>maxRun)continue;
      const ng=gc+cost;
      if(stamp[nb]!==st||ng<g[nb]){stamp[nb]=st;g[nb]=ng;from[nb]=cur;wr[nb]=run;heap.push(nb,ng+hfn(nb));}
    }
  }
  if(stamp[t]!==st)return null;
  const path=[];let c=t;while(c!==-1&&path.length<20000){path.push(c);c=from[c];}
  return path.reverse();
}
function waterNear(ct){for(let r=1;r<=3;r++)for(let k=0;k<8;k++){const nx=ct.x+DX8[k]*r,ny=ct.y+DY8[k]*r;if(inb(nx,ny)&&ter[ny*W+nx]<=T.SHALLOW)return[nx,ny];}return null;}

/* ---------- armies ---------- */
function newCommander(cul){const cu=G.cultures[cul]||G.cultures[0];const r=localRng(rng.s^(G.nextArmy*9973));rng.next();
  return{name:personName(cu.L,r)+' '+personName(cu.L,r),skill:ri(0,3),trait:pick(Object.keys(CTRAITS)),born:G.year-ri(22,45)};}
function makeArmy(civId,x,y,u,o={}){
  const id=G.nextArmy++;const c=civId>=0?G.civs[civId]:null;
  const type=o.type||'army';
  let name=o.name;
  if(!name&&c){if(type==='fleet'){c.fleetN=(c.fleetN||0)+1;name=`${ordinal(c.fleetN)} ${c.adj} Fleet`;}else{c.armyN=(c.armyN||0)+1;name=`${ordinal(c.armyN)} ${c.adj} Army`;}}
  const a={id,civ:civId,type,name:name||'Band',cmd:newCommander(o.culture!=null?o.culture:(c?c.culture:0)),u:Object.assign({inf:0,arch:0,spear:0,cav:0,heavy:0,siege:0,ship:0},u),
    n:0,n0:0,x,y,px:x,py:y,path:null,pi:0,obj:'idle',tgt:-1,tx:x,ty:y,morale:80,exp:0,home:o.home!=null?o.home:-1,battle:0,pop:o.pop||0,
    rebel:!!o.rebel,against:o.against!=null?o.against:-1,rcity:o.rcity!=null?o.rcity:-1,col:o.col||null,flag:o.flag||null,era:o.era||0,next:G.tick+ri(1,4),born:G.year,bad:[],wait:0};
  recount(a);G.armies.push(a);AMAP.set(id,a);return a;
}
function recount(a){let n=0;for(const k in a.u)n+=a.u[k];a.n=n;if(n>a.n0)a.n0=n;}
function removeSoldiers(a,k){if(a.n<=0)return 0;k=Math.min(k,a.n);const f=k/a.n;let t=0;for(const u in a.u){const d=a.u[u]*f;a.u[u]-=d;t+=d;}recount(a);return t;}
function removeArmy(a){
  const i=G.armies.indexOf(a);if(i>=0)G.armies.splice(i,1);AMAP.delete(a.id);
  if(a.type==='settlers'&&a.civ>=0&&G.civs[a.civ])G.civs[a.civ].settlers=Math.max(0,G.civs[a.civ].settlers-1);
  if(a.rebel&&a.rcity>=0)onRebelsDestroyed(a);
  if(typeof onArmyRemoved==='function')onArmyRemoved(a);
}
function armyEra(a){return a.civ>=0&&G.civs[a.civ]?G.civs[a.civ].era:a.era||0;}
function armyPower(a,def){
  const c=a.civ>=0?G.civs[a.civ]:null;const era=armyEra(a);
  let p=0;
  if(a.type==='fleet')p=a.u.ship*2.6;
  else if(a.type==='settlers')p=a.pop*.05;
  else for(const k of UK)p+=a.u[k]*(def?UNITS[k].d:UNITS[k].p);
  p*=E_POW[era];
  const eq=c?(1+c.m.mil+.25*Math.min(1,c.st.iron/(a.n*.02+1))+(c.famine>0?-.2:0)):1.05;
  const cm=1+a.cmd.skill*.07+(CTRAITS[a.cmd.trait]?CTRAITS[a.cmd.trait][1]:0);
  return p*eq*cm*(.45+a.morale/180)*(1+Math.min(.4,a.exp*.08));
}
function atWar(x,y){const c=G.civs[x];return!!(c&&c.enemies[y]!=null);}
function hostile(a,b){
  if(a.rebel)return b.civ===a.against&&!b.rebel;
  if(b.rebel)return a.civ===b.against;
  if(a.civ===b.civ)return false;
  if(a.type==='settlers'&&b.type==='settlers')return false;
  return atWar(a.civ,b.civ);
}
const onWater=a=>isWater(ter[idx(clamp(a.x|0,0,W-1),clamp(a.y|0,0,H-1))]);
function armySpeed(a){
  const era=armyEra(a);const i=idx(clamp(a.x|0,0,W-1),clamp(a.y|0,0,H-1));const t=ter[i];
  if(isWater(t)||a.type==='fleet')return E_SHIP[era];
  let s=E_MOVE[era]/Math.max(1,TER[t].move*.8);
  if(road[i])s*=road[i]===2?2.6:1.5;
  if(a.type==='settlers')s*=.85;
  if(a.n>0&&a.u.cav/a.n>.4)s*=1.3;
  if(a.morale<25)s*=.85;
  return s;
}
function setDest(a,tx,ty,mode){
  const c=a.civ>=0?G.civs[a.civ]:null;
  const range=c?navalRange(c):0;
  if(mode===1&&range<=0)mode=0;
  const p=findPath(a.x,a.y,tx+.5,ty+.5,mode,range);
  if(p===undefined){a.next=G.tick+ri(1,3);a.pend={tx,ty,mode};return 'wait';}
  a.pend=null;
  if(!p){a.path=null;return false;}
  a.path=p;a.pi=0;a.tx=tx;a.ty=ty;return true;
}
function armyStep(a){
  a.px=a.x;a.py=a.y;
  if(a.battle||!a.path)return;
  let rem=armySpeed(a);
  while(rem>0&&a.pi<a.path.length){const tx=a.path[a.pi],ty=a.path[a.pi+1];const dx=tx-a.x,dy=ty-a.y;const d=Math.hypot(dx,dy);
    if(d<=rem){a.x=tx;a.y=ty;rem-=d;a.pi+=2;}else{a.x+=dx/d*rem;a.y+=dy/d*rem;rem=0;}}
  if(a.pi>=a.path.length){a.path=null;arrive(a);}
}
function armyUpkeep(a){
  if(a.type==='settlers'||a.battle)return;
  const i=idx(clamp(a.x|0,0,W-1),clamp(a.y|0,0,H-1));const own=tOwn[i]-1;
  const c=a.civ>=0?G.civs[a.civ]:null;
  if(!a.path){a.morale=Math.min(85+a.cmd.skill*3,a.morale+(own===a.civ?2.5:1));}
  if(c&&own>=0&&own!==a.civ&&atWar(a.civ,own)){
    removeSoldiers(a,a.n*.002);
    if((impr[i]===IM.FARM||impr[i]===IM.MINE||impr[i]===IM.PASTURE)&&R()<.25){impr[i]=0;onTile(i);c.st.gold+=2*E_WEALTH[c.era];}
  }
  if(c&&c.famine>0)removeSoldiers(a,a.n*.01);
  if(c&&own===a.civ&&!a.path){const ct=G.cities[tCity[i]];if(ct&&Math.abs(ct.x-a.x)<3&&Math.abs(ct.y-a.y)<3){ct.occ=a.n;ct.occT=G.tick;}}
  if(a.n<1)removeArmy(a);
}
function arrive(a){
  if(a.type==='settlers'){settle(a);return;}
  if(a.obj==='reinforce'){const t=AMAP.get(a.tgt);if(t&&dist(a.x,a.y,t.x,t.y)<3&&!t.battle){for(const k in a.u)t.u[k]+=a.u[k];recount(t);t.morale=(t.morale*t.n+a.morale*a.n)/(t.n+a.n);removeArmy(a);return;}a.obj='idle';}
  if(a.obj==='retreat'||a.obj==='return'||a.obj==='patrol'||a.obj==='garrison')a.obj=a.obj==='garrison'?'garrison':'idle';
  a.next=Math.min(a.next,G.tick+1);
}

/* ---------- spatial hash, battles ---------- */
const SH=new Map();
function buildHash(){SH.clear();for(const a of G.armies){const k=((a.y/4)|0)*8192+((a.x/4)|0);let l=SH.get(k);if(!l){l=[];SH.set(k,l);}l.push(a);}}
function near(x,y,r,fn){const x0=((x-r)/4)|0,x1=((x+r)/4)|0,y0=((y-r)/4)|0,y1=((y+r)/4)|0;
  for(let cy=y0;cy<=y1;cy++)for(let cx=x0;cx<=x1;cx++){const l=SH.get(cy*8192+cx);if(!l)continue;for(const a of l)if(Math.abs(a.x-x)<=r&&Math.abs(a.y-y)<=r)fn(a);}}
function detectBattles(){
  for(const a of G.armies){
    if(a.type==='settlers'||a.n<1)continue;
    const aw=a.type==='fleet'||onWater(a);
    near(a.x,a.y,1.6,b=>{
      if(b===a||b.n<1)return;if(a.battle&&a.battle===b.battle)return;
      if(!hostile(a,b))return;
      const bw=b.type==='fleet'||onWater(b);
      if(b.type==='settlers'){if(aw===bw){logEv('colony',1,`${CN(G.civs[b.civ])} settlers were slaughtered by ${a.rebel?'rebels':CN(G.civs[a.civ])} before reaching their new home.`,{civs:[b.civ],x:b.x,y:b.y});removeArmy(b);}return;}
      if(aw!==bw&&!(a.type==='fleet'&&bw)&&!(b.type==='fleet'&&aw))return;
      if(a.type==='fleet'&&!bw)return;if(b.type==='fleet'&&!aw)return;
      engage(a,b,aw&&bw);
    });
  }
}
function battleOf(id){return G.battles.find(b=>b.id===id);}
function engage(a,b,naval){

function terrainDef(x,y){const i=idx(clamp(x|0,0,W-1),clamp(y|0,0,H-1));const t=ter[i];let m=1;

function casualty(civId,n,byId){const c=civId>=0?G.civs[civId]:null;if(!c)return;c.exh=Math.min(100,c.exh+n/(c.pop*.004+60));
  for(const wid of new Set(Object.values(c.enemies))){const w=G.wars[wid];if(!w||!w.active)continue;if(w.A.includes(civId))w.casA+=n;else if(w.D.includes(civId))w.casD+=n;}}
function retreat(a){const c=a.civ>=0?G.civs[a.civ]:null;a.obj='retreat';a.morale=Math.max(a.morale,12);

function endBattle(bt,win){

function battleName(bt){

/* ---------- sieges & capture ---------- */
function resolveSieges(){
  // mark sieges from armies camped at hostile cities
  for(const a of G.armies){
    if(a.type!=='army'||a.battle||a.path||a.obj!=='siege')continue;
    const ct=G.cities[a.tgt];if(!ct||!ct.alive)continue;
    if(Math.abs(ct.x+.5-a.x)>2.2||Math.abs(ct.y+.5-a.y)>2.2)continue;
    const ok=a.rebel?ct.civ===a.against:atWar(a.civ,ct.civ);if(!ok){a.obj='idle';continue;}
    if(!ct.siege)ct.siege={c:a.civ,reb:a.rebel,prog:0,t0:G.tick};
    ct.siege.seen=G.tick;
  }
  for(const ct of G.cities){
    if(!ct.siege)continue;
    if(ct.siege.seen!==G.tick){ct.siege.prog-=5;if(ct.siege.prog<=0)ct.siege=null;continue;}
    const bes=[];near(ct.x+.5,ct.y+.5,2.3,a=>{if(a.type==='army'&&!a.battle&&!a.path&&a.obj==='siege'&&a.tgt===ct.id)bes.push(a);});
    if(!bes.length)continue;
    const owner=G.civs[ct.civ];
    let att=0,sg=0,n=0;for(const a of bes){att+=armyPower(a,false);sg+=a.u.siege;n+=a.n;}
    att*=1+Math.min(1.5,sg/Math.max(1,n)*UNITS.siege.wall);
    const def=ct.garrison*E_POW[owner.era]*1.25*(1+ct.walls*.8)*(ct.capital?1.2:1)*terrainDef(ct.x,ct.y)+1;
    ct.garrison-=ct.garrison*clamp(.05*att/def,.006,.45);
    const lf=clamp(.012*def/(att+1),0,.08);for(const a of bes){const l=removeSoldiers(a,a.n*lf);casualty(a.civ,l,ct.civ);}
    ct.siege.prog+=clamp(att/def,0,6)*1.7*(sg>0?1.5:1)/(1+ct.walls*.45);
    owner.exh=Math.min(100,owner.exh+.15);
    if(ct.garrison<2||ct.siege.prog>=100){captureCity(ct,bes.sort((a,b)=>b.n-a.n)[0]);}
  }
}
function captureCity(ct,a){

  const cap=G.civs[a.civ];if(!cap)return;
  const war=G.wars.find(w=>w.active&&((w.A.includes(cap.id)&&w.D.includes(old.id))||(w.D.includes(cap.id)&&w.A.includes(old.id))));

  // --- liberation? ---
  const foreign=ct.culture!==old.culture||ct.status==='occupied'||(ct.status==='colony'&&ct.diverge>=1)||ct.formerCap>=0;

  transferCity(ct,cap,'conquest');

}

/* ---------- relations ---------- */
function relOf(c,o){let r=c.rel[o.id];if(!r)r=c.rel[o.id]={op:0,t:0,truce:0,mem:[],rival:0};return r;}
function addMem(c,o,type,val,hl){if(!c||!o||!c.alive||c===o)return;const r=relOf(c,o);r.mem.push([type,val,G.year,hl]);if(r.mem.length>14)r.mem.shift();r.op=clamp(r.op+val*.5,-100,100);}
function memVal(r){let s=0;r.mem=r.mem.filter(m=>{const v=m[1]*Math.pow(.5,(G.year-m[2])/m[3]);if(Math.abs(v)<1)return false;s+=v;return true;});return s;}
function setTreaty(a,b,f,on){const ra=relOf(a,b),rb=relOf(b,a);if(on){ra.t|=f;rb.t|=f;}else{ra.t&=~f;rb.t&=~f;}}
function alliesPower(o){let p=0;for(const k in o.rel){const r=o.rel[k];if(r.t&(REL.ALLY|REL.DEF)){const x=G.civs[k];if(x&&x.alive)p+=x.power||0;}}if(o.overlord>=0&&G.civs[o.overlord])p+=G.civs[o.overlord].power||0;return p;}
function knownCivs(c){

  c._knT=G.tick;c._kn=knownCivs0(c);return c._kn;
}
function knownCivs0(c){
  const s=new Set(Object.keys(c.bd).map(Number));for(const k in c.rel)s.add(+k);
  const nav=navalRange(c);const cap=G.cities[c.capital];
  if(cap){const far=[];const R2=Math.max(35,nav*1.2+40);for(const o of ALIVE){if(o===c||s.has(o.id))continue;const oc=G.cities[o.capital];if(!oc)continue;
    const d=dist(cap.x,cap.y,oc.x,oc.y);if(d<R2)far.push([d,o.id]);}far.sort((a,b)=>a[0]-b[0]);for(const f of far.slice(0,14))s.add(f[1]);}

function updateOpinions(c){

    const b=c.bd[k]||0;if(b)t-=Math.min(16,4+b/10);

/* ---------- war ---------- */
function warName(w,a,d){
  if(w.goal==='independence')return`${a.adj} War of Independence`;
  if(w.goal==='civil')return`${d.adj} Civil War`;
  if(w.goal==='liberation'){const ct=G.cities[w.tgt];return ct?`War for the Liberation of ${ct.name}`:`${a.adj} War of Liberation`;}
  if(w.goal==='subjugation')return`${a.adj} Conquest of ${d.base}`;
  if(w.goal==='holy')return`${G.religions[a.religion]?G.religions[a.religion].name.replace(/^(The|Faith of|Cult of|Church of|Order of) /,''):a.adj} Holy War`;
  if(w.goal==='reconquest')return`${a.adj} War of Reconquest`;
  const same=G.wars.filter(x=>x.name.startsWith(`${a.adj}–${d.adj} War`)).length;
  return`${same?ordinal(same+1)+' ':''}${a.adj}–${d.adj} War`;
}
function sideVal(ids){let v=0;for(const id of ids){const c=G.civs[id];if(c)for(const cid of c.cities)v+=cityValue(G.cities[cid]);}return v;}
function declareWar(att,def,goal,tgt,o={}){
  if(!att.alive||!def.alive||att===def||atWar(att.id,def.id))return null;
  const w={id:G.wars.length,name:'',A:[att.id],D:[def.id],la:att.id,ld:def.id,start:G.year,end:null,goal,tgt:tgt!=null?tgt:-1,active:true,occ:[],bA:0,bD:0,casA:0,casD:0,res:'',score:0,valA:0,valD:0};
  w.name=warName(w,att,def);
  const r=relOf(att,def);
  if(r.t&(REL.NAP|REL.ALLY|REL.DEF)&&goal!=='independence'&&goal!=='civil'){
    logEv('diplomacy',2,`${CN(att)} betrayed its ${r.t&REL.ALLY?'alliance':r.t&REL.DEF?'defensive pact':'non-aggression pact'} with ${CN(def)}.`,{civs:[att.id,def.id]});
    addMem(def,att,'betrayal',-65,120);for(const k in att.rel){const x=G.civs[k];if(x&&x!==def)addMem(x,att,'backstabber',-10,50);}

  if(goal==='independence'&&att.overlord===def.id){freeSubject(att,'war');}

  addSide(w,att,'A');addSide(w,def,'D');
  att.stats.wars++;def.stats.wars++;att.lastWarY=G.year;
  const big=att.cities.length+def.cities.length;
  if(!o.quiet){
    const why={conquest:'',reconquest:' to reclaim lost lands',liberation:' to free an occupied people',subjugation:' seeking to subjugate it',holy:' in the name of its faith',independence:'',civil:''}[goal]||'';
    logEv('war',big>=8||goal==='independence'?3:2,goal==='independence'?`${CN(att)} took up arms against ${CN(def)} to win its independence.`:`${CN(att)} declared war on ${CN(def)}${why}. The ${w.name} began.`,{civs:[att.id,def.id]});
  }
  callAllies(w);
  w.valA=sideVal(w.A);w.valD=sideVal(w.D);

function addSide(w,c,side){
  const arr=side==='A'?w.A:w.D,oth=side==='A'?w.D:w.A;if(!arr.includes(c.id))arr.push(c.id);
  for(const e of oth){const o=G.civs[e];if(!o||!o.alive)continue;c.enemies[e]=w.id;o.enemies[c.id]=w.id;setTreaty(c,o,REL.TRADE|REL.NAP|REL.ALLY|REL.DEF,false);}

function joinWar(w,c,side,quiet){

  const oth=side==='A'?w.D:w.A;for(const e of oth)if(atWar(c.id,e)&&G.civs[c.id].enemies[e]!==w.id)return;

  if(!quiet)logEv('war',c.cities.length>=5?2:1,`${CN(c)} entered the ${w.name} on the side of ${CN(lead)}.`,{civs:[c.id,lead.id]});

function callAllies(w){
  const A=G.civs[w.la],D=G.civs[w.ld];
  const cand=(c,side,defensive)=>{
    for(const k in c.rel){const r=c.rel[k];const o=G.civs[k];if(!o||!o.alive)continue;
      const ok=defensive?(r.t&(REL.ALLY|REL.DEF)):(r.t&REL.ALLY);
      if(ok&&!atWar(o.id,c.id)){const other=G.civs[side==='A'?w.ld:w.la];const ro=relOf(o,other);if(ro.t&REL.ALLY)continue;if(R()<(defensive?.85:.55))joinWar(w,o,side);}}

  if(far&&newLand&&a.over)logEv('colony',firstEver?3:2,firstEver?`${CN(c)} colonists became the first people to settle ${ln}, founding ${TN(ct)}.`:`${CN(c)} established the colony of ${TN(ct)} on ${ln}.`,{civs:[c.id],city:ct.id,x:ct.x,y:ct.y});
  else if(far)logEv('colony',1,`${CN(c)} founded the colony of ${TN(ct)}.`,{civs:[c.id],city:ct.id,x:ct.x,y:ct.y});
  else logEv('city',1,`${CN(c)} settlers founded ${TN(ct)}.`,{civs:[c.id],city:ct.id,x:ct.x,y:ct.y});
  removeArmy(a);
}

/* ---------- military management ---------- */
function mixUnits(c,n,war){
  const w=PERS[c.pers].w;const opts=[['inf',1]];
  if(unitOK(c,'arch'))opts.push(['arch',.7]);if(unitOK(c,'spear'))opts.push(['spear',.8]);
  if(unitOK(c,'cav'))opts.push(['cav',.55*Math.min(1,c.st.horses/(n*.05+1))+.1]);
  if(unitOK(c,'heavy'))opts.push(['heavy',.8*Math.min(1,c.st.iron/(n*.05+1))+.1]);
  if(unitOK(c,'siege')&&(war||w.agg>1.2))opts.push(['siege',.14]);
  let t=0;for(const o of opts)t+=o[1];const u={};for(const o of opts)u[o[0]]=n*o[1]/t;
  if(u.cav)c.st.horses=Math.max(0,c.st.horses-u.cav*.05);if(u.heavy)c.st.iron=Math.max(0,c.st.iron-u.heavy*.05);
  return u;
}
function manageMilitary(c){
  const w=PERS[c.pers].w;const war=Object.keys(c.enemies).length>0;
  let threat=0;for(const k in c.bd){const o=G.civs[k];if(o&&o.alive&&relOf(c,o).op<-25)threat=Math.max(threat,(o.power||0)/(c.power+1));}
  let rebels=false;for(const a of REBELS)if(a.against===c.id){rebels=true;break;}
  const rate=.011*w.mil*(1+traitSum(c,'mil'))*(GOVS[c.gov].mil||1)*(war?2.4:1)*(rebels?1.6:1)*(1+Math.min(1,threat*.3))*(c.era===0?.55:1);
  const desired=c.pop*rate+(war?25:0);
  const cur=c.soldiers;
  const myArmies=(ARMS_BY.get(c.id)||[]).filter(a=>AMAP.has(a.id));
  if(cur<desired*.9&&c.st.gold>3&&c.st.food>3){
    const costPer=.02*E_WEALTH[c.era];
    let batch=Math.min(desired-cur,c.pop*.012+12,c.st.gold/costPer);
    if(batch<8)return;
    let src=G.cities[c.capital];
    if(war){let bd=1e9;for(const id of c.cities){const ct=G.cities[id];if(ct.pop<batch*3||ct.siege)continue;for(const e in c.enemies){const ec=G.cities[G.civs[e].capital];if(!ec)continue;const d=dist(ct.x,ct.y,ec.x,ec.y);if(d<bd){bd=d;src=ct;}}}}
    if(!src||src.pop<batch*2.5){src=c.cities.map(id=>G.cities[id]).sort((a,b)=>b.pop-a.pop)[0];if(!src||src.pop<batch*2.5)return;}
    const u=mixUnits(c,batch,war);
    c.st.gold-=batch*costPer;src.pop-=batch*.6;
    if(src.status==='colony'||src.status==='occupied')src.unrest+=3;
    let host=myArmies.find(a=>!a.battle&&Math.abs(a.x-src.x)<4&&Math.abs(a.y-src.y)<4);
    if(!host&&myArmies.length>=1+Math.ceil(c.cities.length/5))host=myArmies.filter(a=>!a.battle&&a.obj!=='siege').sort((a,b)=>dist(a.x,a.y,src.x,src.y)-dist(b.x,b.y,src.x,src.y))[0];
    if(host&&dist(host.x,host.y,src.x,src.y)<6){for(const k in u)host.u[k]+=u[k];recount(host);}
    else{const a=makeArmy(c.id,src.x+.5+rf(-1,1),src.y+.5+rf(-1,1),u,{home:src.id});a.morale=70;}
  }else if(!war&&!rebels&&cur>desired*1.8&&cur>60){
    const a=myArmies.filter(a=>!a.battle&&!a.path).sort((a,b)=>a.n-b.n)[0];
    if(a){const h=G.cities[a.home]&&G.cities[a.home].civ===c.id?G.cities[a.home]:G.cities[c.capital];if(h)h.pop+=a.n*.6;removeArmy(a);}
  }
  // navy
  if(c.m.naval>0&&c.era>=1){
    const fleets=G.armies.filter(a=>a.civ===c.id&&a.type==='fleet');
    const want=Math.floor((w.nav>1.2?1:0)+(war?1:0)+(c.cities.length>=8?1:0));
    const port=c.cities.map(id=>G.cities[id]).find(ct=>ct.port&&ct.tier>=2);
    if(port&&fleets.length<want&&c.st.wood>30&&c.st.gold>20){const wp=waterNear(port);if(wp){const n=Math.round(8+c.pop*.0008*w.nav);c.st.wood-=20;c.st.gold-=15;const f=makeArmy(c.id,wp[0]+.5,wp[1]+.5,{ship:n},{type:'fleet',home:port.id});f.morale=80;}}
  }
}
function nearestOwnCity(c,x,y,sameLm){let best=null,bd=1e9;const lm=lmass[idx(clamp(x|0,0,W-1),clamp(y|0,0,H-1))];for(const id of c.cities){const ct=G.cities[id];if(sameLm&&ct.lm!==lm)continue;const d=dist(x,y,ct.x,ct.y);if(d<bd){bd=d;best=ct;}}return best;}
function armyThink(a){
  if(a.pend&&!a.battle){const p=a.pend;if(setDest(a,p.tx,p.ty,p.mode)==='wait')return;a.next=G.tick+ri(3,6);return;}
  const c=a.civ>=0?G.civs[a.civ]:null;
  const busy=a.rebel||(c&&Object.keys(c.enemies).length);
  a.next=G.tick+(busy?(a.vis?ri(2,3):ri(4,7)):ri(8,14));
  if(a.battle)return;
  if(a.type==='settlers'){if(!a.path){const r=setDest(a,a.tgt%W,(a.tgt/W)|0,a.over?1:0);if(r===false)abortSettlers(a);}return;}
  if(a.rebel){rebelThink(a);return;}
  if(!c){removeArmy(a);return;}
  if(a.type==='fleet'){fleetThink(a,c);return;}
  const mode=navalRange(c)>0?1:0;
  if(a.obj==='retreat'&&a.path)return;
  if((a.morale<28||a.n<a.n0*.22)&&busy&&a.obj!=='retreat'){retreat(a);return;}
  // rebels in our lands
  let reb=null,rd=1e9;for(const b of REBELS)if(b.against===c.id){const d=dist(a.x,a.y,b.x,b.y);if(d<rd&&d<150){rd=d;reb=b;}}
  if(reb&&armyPower(a,false)>armyPower(reb,true)*.6){a.obj='hunt';a.tgt=reb.id;setDest(a,reb.x|0,reb.y|0,mode);return;}
  const enemies=Object.keys(c.enemies);
  if(enemies.length){
    // relieve a besieged city
    for(const id of c.cities){const ct=G.cities[id];if(ct.siege&&dist(a.x,a.y,ct.x,ct.y)<70){a.obj='defend';a.tgt=ct.id;setDest(a,ct.x,ct.y,mode);return;}}
    // hunt an enemy army inside our territory
    let tgt=null,td=1e9;for(const e of enemies)for(const b of ARMS_BY.get(+e)||[]){const own=tOwn[idx(clamp(b.x|0,0,W-1),clamp(b.y|0,0,H-1))]-1;if(own!==c.id)continue;const d=dist(a.x,a.y,b.x,b.y);if(d<td&&d<60&&armyPower(a,false)>armyPower(b,true)*.8){td=d;tgt=b;}}
    if(tgt){a.obj='hunt';a.tgt=tgt.id;setDest(a,tgt.x|0,tgt.y|0,mode);return;}
    // strike an enemy city (keep marching on a still-valid target; re-plan occasionally)
    const cur=a.obj==='siege'?G.cities[a.tgt]:null;
    if(cur&&cur.alive&&atWar(c.id,cur.civ)&&(a.path||Math.abs(a.x-cur.x)<2.5&&Math.abs(a.y-cur.y)<2.5)&&G.tick<(a.replan||0))return;
    a.replan=G.tick+ri(18,30);
    const t=pickTarget(a,c,mode);
    if(t){if(a.obj==='siege'&&a.tgt===t.id&&(a.path||Math.abs(a.x-t.x)<2.5))return;
      // too weak? join forces
      const my=armyPower(a,false),def=t.garrison*E_POW[G.civs[t.civ].era]*(1+t.walls*.8);
      if(my<def*.7){const f=(ARMS_BY.get(c.id)||[]).filter(b=>b!==a&&AMAP.has(b.id)&&!b.battle&&b.obj!=='reinforce').sort((x,y)=>dist(a.x,a.y,x.x,x.y)-dist(a.x,a.y,y.x,y.y))[0];
        if(f&&dist(a.x,a.y,f.x,f.y)<50){a.obj='reinforce';a.tgt=f.id;setDest(a,f.x|0,f.y|0,mode);return;}}
      a.obj='siege';a.tgt=t.id;if(!setDest(a,t.x,t.y,mode)&&a.path===null)a.bad.push(t.id);if(a.bad.length>12)a.bad.shift();return;}
    if(a.obj!=='idle'||a.path)return;
  }
  if(a.obj==='return'||(!enemies.length&&(a.obj==='siege'||a.obj==='hunt'||a.obj==='defend'))){const h=nearestOwnCity(c,a.x,a.y,mode===0);if(h){a.obj='return';setDest(a,h.x,h.y,mode);}else a.obj='idle';return;}
  if(a.path)return;
  // peacetime: garrison restless provinces, otherwise patrol
  const hot=c.cities.map(id=>G.cities[id]).filter(ct=>ct.stage>=3&&G.tick-(ct.occT||-99)>8&&(ct.lm===lmass[idx(a.x|0,a.y|0)]||mode)).sort((x,y)=>y.unrest-x.unrest)[0];
  if(hot&&R()<.7){a.obj='garrison';setDest(a,hot.x,hot.y,mode);return;}
  if(R()<.25){const cs=c.cities.map(id=>G.cities[id]).filter(ct=>ct.lm===lmass[idx(a.x|0,a.y|0)]&&dist(ct.x,ct.y,a.x,a.y)<60);if(cs.length){const t=pick(cs);a.obj='patrol';setDest(a,t.x+ri(-2,2),t.y+ri(-2,2),0);}}
}
function targetList(c){
  if(c._tgT===G.tick>>2&&c._tg)return c._tg;const L=[];
  for(const e in c.enemies){const o=G.civs[e];if(!o||!o.alive)continue;const w=G.wars[c.enemies[e]];
    const cs=o.cities.length>40?o.cities.map(id=>G.cities[id]).sort((x,y)=>(y._val||0)-(x._val||0)).slice(0,40).map(x=>x.id):o.cities;
    for(const id of cs)L.push([id,o,w]);}
  c._tg=L;c._tgT=G.tick>>2;return L;
}
function pickTarget(a,c,mode){
  let best=null,bs=0;const my=armyPower(a,false);const lm=lmass[idx(clamp(a.x|0,0,W-1),clamp(a.y|0,0,H-1))];
  for(const[id,o,w]of targetList(c)){{const ct=G.cities[id];if(!ct.alive||ct.civ!==o.id||a.bad.includes(id))continue;
      if(mode===0&&ct.lm!==lm)continue;
      const d=dist(a.x,a.y,ct.x,ct.y);if(d>(mode?300:220))continue;
      const def=ct.garrison*E_POW[o.era]*(1+ct.walls*.8)+1;
      let s=(ct._val||cityValue(ct))/(1+d/22)*Math.min(2.2,my/def)*(ct.lm!==lm?.55:1);
      if(w&&w.tgt===ct.id)s*=3;
      if(ct.culture===c.culture||ct.prev.some(p=>p.c===c.id))s*=1.8;
      if(ct.siege&&ct.siege.c===c.id)s*=1.5;
      if(s>bs){bs=s;best=ct;}}}
  return best;
}
function rebelThink(a){
  const ct=G.cities[a.rcity];if(!ct||!ct.alive||ct.civ!==a.against){removeArmy(a);return;}
  if(a.n<8){removeArmy(a);return;}
  a.obj='siege';a.tgt=ct.id;if(!a.path&&(Math.abs(a.x-ct.x-.5)>2||Math.abs(a.y-ct.y-.5)>2))setDest(a,ct.x,ct.y,0);
}
function fleetThink(a,c){
  const enemies=Object.keys(c.enemies);
  if(enemies.length){
    let best=null,bd=1e9;
    for(const b of G.armies){if(b.type!=='fleet'||!atWar(c.id,b.civ))continue;const d=dist(a.x,a.y,b.x,b.y);if(d<bd&&d<160){bd=d;best=b;}}
    if(best&&armyPower(a)>armyPower(best)*.7){a.obj='hunt';a.tgt=best.id;setDest(a,best.x|0,best.y|0,2);return;}
    let port=null;bd=1e9;for(const e of enemies){for(const id of G.civs[e].cities){const ct=G.cities[id];if(!ct.port)continue;const d=dist(a.x,a.y,ct.x,ct.y);if(d<bd&&d<300){bd=d;port=ct;}}}
    if(port){const wp=waterNear(port);if(wp){a.obj='blockade';a.tgt=port.id;setDest(a,wp[0],wp[1],2);return;}}
  }
  if(!a.path){const h=G.cities[a.home];if(h&&h.civ===c.id&&dist(a.x,a.y,h.x,h.y)>6){const wp=waterNear(h);if(wp){a.obj='return';setDest(a,wp[0],wp[1],2);}}else if(!h||h.civ!==c.id){const np=c.cities.map(id=>G.cities[id]).find(x=>x.port);if(np)a.home=np.id;else removeArmy(a);}}
}

/* ---------- diplomacy & grand strategy ---------- */
function diplomacy(c){
  updateOpinions(c);
  const w=PERS[c.pers].w;const dip=w.dip*(1+traitSum(c,'dip'));
  for(const k of knownCivs(c)){const o=G.civs[k];if(atWar(c.id,o.id))continue;const r=relOf(c,o),ro=relOf(o,c);
    const border=(c.bd[k]||0)>0;
    if(!(r.t&REL.TRADE)&&r.op>-5&&ro.op>-12&&(border||(c.cities.some(id=>G.cities[id].port)&&o.cities.some(id=>G.cities[id].port)))&&R()<.25*w.trade){
      setTreaty(c,o,REL.TRADE,true);makeTradeRoute(c,o);
      logEv('trade',c.cities.length+o.cities.length>=10?2:1,`${CN(c)} and ${CN(o)} opened trade.`,{civs:[c.id,o.id]});}
    if(!(r.t&REL.NAP)&&border&&r.op>25&&ro.op>15&&R()<.15*dip){setTreaty(c,o,REL.NAP,true);logEv('diplomacy',1,`${CN(c)} and ${CN(o)} signed a non-aggression pact.`,{civs:[c.id,o.id]});}
    if(!(r.t&(REL.DEF|REL.ALLY))&&r.op>45&&ro.op>35&&R()<.12*dip){setTreaty(c,o,REL.DEF,true);logEv('diplomacy',2,`${CN(c)} and ${CN(o)} formed a defensive alliance.`,{civs:[c.id,o.id]});}
    else if(r.t&REL.DEF&&!(r.t&REL.ALLY)&&r.op>65&&ro.op>55&&R()<.1*dip){setTreaty(c,o,REL.ALLY,true);logEv('diplomacy',2,`${CN(c)} and ${CN(o)} sealed a full alliance.`,{civs:[c.id,o.id]});}
    if(r.t&(REL.ALLY|REL.DEF)&&r.op<-5&&R()<.3){setTreaty(c,o,REL.ALLY|REL.DEF,false);addMem(o,c,'abandoned',-15,30);logEv('diplomacy',1,`${CN(c)} broke off its alliance with ${CN(o)}.`,{civs:[c.id,o.id]});}
    const pr=(o.power+1)/(c.power+1);
    if(!r.rival&&border&&pr>.55&&pr<1.8&&r.op<-28&&R()<.2){r.rival=1;ro.rival=1;logEv('diplomacy',1,`${CN(c)} and ${CN(o)} became bitter rivals.`,{civs:[c.id,o.id]});}
    else if(r.rival&&r.op>0){r.rival=0;ro.rival=0;}
    if(border&&r.op<-12&&R()<.04)logEv('diplomacy',1,`A border dispute flared between ${CN(c)} and ${CN(o)}.`,{civs:[c.id,o.id]}),addMem(c,o,'border dispute',-8,20);
    // secretly arm restless subjects of rivals
    if(r.op<-20&&c.st.gold>40&&R()<.35*w.agg){const hot=o.cities.map(id=>G.cities[id]).filter(ct=>ct.unrest>40&&ct.culture!==o.culture).sort((a,b)=>b.unrest-a.unrest)[0];
      if(hot){const g=Math.min(c.st.gold*.15,20+c.era*5);c.st.gold-=g;hot.support[c.id]=(hot.support[c.id]||0)+g;}}
    // demand submission from a much weaker neighbour
    if(border&&o.overlord<0&&c.overlord<0&&o.cities.length<=3&&(c.power+1)/(o.power+alliesPower(o)+1)>5&&w.agg>1&&R()<.08){
      if(ro.op>-25&&R()<.5){o.overlord=c.id;o.subType='vassal';o.subSince=G.year;c.subjects.push(o.id);logEv('diplomacy',2,`${CN(o)} bowed to ${CN(c)} and became its vassal.`,{civs:[c.id,o.id]});}
      else if(!atWar(c.id,o.id)&&r.truce<=G.year)declareWar(c,o,'subjugation');
    }
  }
  // annex loyal vassals of the same people
  for(const s of c.subjects){const o=G.civs[s];if(o&&o.subType==='vassal'&&o.culture===c.culture&&G.year-o.subSince>50&&relOf(o,c).op>40&&R()<.05){
    const nm=o.name;for(const id of o.cities.slice())transferCity(G.cities[id],c,'annexation');logEv('diplomacy',2,`[[c${o.id}|${nm}]] was peacefully annexed by ${CN(c)}.`,{civs:[c.id,o.id]});}}
}
function considerWar(c){
  if(c.overlord>=0){libertyCheck(c);if(c.subType==='vassal')return;}
  const w=PERS[c.pers].w;const agg=w.agg*(1+traitSum(c,'agg'));
  if(Object.keys(c.enemies).length>=2||c.exh>35||(c.stab<25&&agg<1.5)||c.era===0&&c.cities.length<2)return;
  if(G.year-c.lastWarY<12/agg)return;
  const myP=c.power||civPower(c);if(myP<1)return;
  const mode=navalRange(c)>0?1:0;const cap=G.cities[c.capital];if(!cap)return;
  let best=null,bs=0,bg='conquest',bt=-1;
  for(const k of knownCivs(c)){const o=G.civs[k];if(atWar(c.id,o.id)||o.overlord===c.id||c.overlord===o.id)continue;
    const r=relOf(c,o);if(r.truce>G.year)continue;
    const border=(c.bd[k]||0)>0;
    if(!border){if(!mode)continue;const oc=G.cities[o.capital];if(!oc||dist(cap.x,cap.y,oc.x,oc.y)>navalRange(c)*1.5+60)continue;}
    const theirP=(o.power||1)+alliesPower(o)*.6;const ratio=myP/(theirP+1);
    if(ratio<1.2)continue;
    let d=agg*Math.min(3,ratio-.8)*(1+Math.max(0,-r.op)/40)*(border?1:.55);
    let goal='conquest',tgt=-1;
    if(r.claims){d*=1+r.claims*.5;goal='reconquest';}
    // liberation of a people we are fond of
    for(const id of o.cities){const ct=G.cities[id];if(ct.status!=='occupied'&&ct.formerCap<0)continue;const fc=G.civs[ct.formerCap]||null;
      const kin=G.civs.find(x=>x.alive&&x!==o&&x.culture===ct.culture);const fond=(kin&&relOf(c,kin).op>35)||(fc&&!fc.alive&&w.dip>1.2);
      if(fond){d*=1.3*w.dip;goal='liberation';tgt=id;break;}}
    if(o.cities.length<=2&&ratio>3)goal=goal==='conquest'?'subjugation':goal;
    if(c.gov==='theocracy'&&o.religion!==c.religion){d*=1.3;if(goal==='conquest')goal='holy';}
    for(const s of['iron','coal','gold','oil'])if(!hasAccess(c,s)&&o.st[s]>10){d*=1.2;break;}
    if(r.t&REL.NAP)d*=.35;if(r.t&(REL.DEF|REL.ALLY))d*=.15;
    if(r.rival)d*=1.5;
    if(r.t&REL.TRADE)d*=.7;
    if(d>bs){bs=d;best=o;bg=goal;bt=tgt;}
  }
  if(best&&bs*Math.min(1.3,.45+c.era*.13)>1.35&&R()<.22)declareWar(c,best,bg,bt);
}
function libertyCheck(c){
  const o=G.civs[c.overlord];if(!o||!o.alive){freeSubject(c,'gone');return;}
  const ratio=(c.power+1)/(o.power+1);const r=relOf(c,o);
  c.liberty=clamp(ratio*60+(c.culture!==o.culture?15:0)-r.op*.4+(Object.keys(o.enemies).length?15:0)+(c.subType==='vassal'?10:0),0,100);
  if(c.liberty>80&&G.year-c.subSince>15&&R()<.12){logEv('independence',2,`${CN(c)} rose up against its overlord ${CN(o)}.`,{civs:[c.id,o.id]});declareWar(c,o,'independence',-1,{quiet:true});}
}
function colonialPolicy(c){
  const w=PERS[c.pers].w;
  const cols=c.cities.map(id=>G.cities[id]).filter(ct=>ct.status!=='core');
  c.tax=clamp(.4+(c.st.gold<0?.18:0)-(c.stab<30?.1:0)+traitSum(c,'gold'),.15,.8);
  if(!cols.length){c.ext=clamp(.2+w.ext*.3,.05,.9);return;}
  const avgU=cols.reduce((s,x)=>s+x.unrest,0)/cols.length;
  const cruel=c.leader&&c.leader.traits.includes('cruel');
  const tgt=clamp(.18+w.ext*.32+traitSum(c,'ext')+(c.st.gold<0?.15:0)-(avgU>60&&!cruel?.18:0),.05,.95);
  c.ext+=(tgt-c.ext)*.3;
  const lib=['democracy','constmon','republic'].includes(c.gov)||w.dip>1.5;
  for(const ct of cols){
    if(ct.status==='colony'&&ct.unrest>72&&!cruel&&R()<.2*w.dip){ct.status='autonomous';ct.statusSince=G.year;logEv('colony',1,`${CN(c)} granted self-rule to ${TN(ct)}.`,{civs:[c.id],city:ct.id,x:ct.x,y:ct.y});}
    if(ct.status!=='occupied'&&ct.unrest>82&&ct.rebelArmy<0&&lib&&ct.pop>1200&&R()<.12){grantIndependence(ct);break;}
  }
}
function aiThink(c){

/* ---------- trade ---------- */
function makeTradeRoute(c,o){
  let best=null,bd=1e9;
  const ca=c.cities.map(id=>G.cities[id]).filter(x=>x.tier>=1).slice(0,40),cb=o.cities.map(id=>G.cities[id]).filter(x=>x.tier>=1).slice(0,40);
  for(const a of ca)for(const b of cb){let d=dist(a.x,a.y,b.x,b.y);const sea=a.lm!==b.lm;if(sea&&!(a.port&&b.port))continue;if(sea)d*=.8;if(d<bd){bd=d;best=[a,b,sea];}}
  if(best)addRoute(best[0],best[1],best[2]);
}
function addRoute(A,B,sea){
  if(G.routes.some(r=>(r.a===A.id&&r.b===B.id)||(r.a===B.id&&r.b===A.id)))return null;
  let pts;
  if(sea){const wa=waterNear(A),wb=waterNear(B);if(!wa||!wb)return null;const p=findPath(wa[0]+.5,wa[1]+.5,wb[0]+.5,wb[1]+.5,2,0);if(!p)return null;pts=[A.x+.5,A.y+.5,wa[0]+.5,wa[1]+.5].concat(p,[B.x+.5,B.y+.5]);}
  else{const p=findPath(A.x+.5,A.y+.5,B.x+.5,B.y+.5,0,0);if(!p)return null;pts=[A.x+.5,A.y+.5].concat(p);}
  let len=0;for(let k=2;k<pts.length;k+=2)len+=Math.hypot(pts[k]-pts[k-2],pts[k+1]-pts[k-1]);
  const r={id:G.nextRoute++,a:A.id,b:B.id,ca:A.civ,cb:B.civ,sea,pts,len,since:G.year,val:0};G.routes.push(r);return r;
}
function routesMonth(){
  for(const ct of G.cities)ct.trade=0;
  G.routes=G.routes.filter(r=>{const A=G.cities[r.a],B=G.cities[r.b];
    if(!A||!B||!A.alive||!B.alive||A.civ!==r.ca||B.civ!==r.cb)return false;
    if(r.ca!==r.cb){const ca=G.civs[r.ca],cb=G.civs[r.cb];if(atWar(r.ca,r.cb)||!(relOf(ca,cb).t&REL.TRADE))return false;}
    const ea=Math.min(G.civs[r.ca].era,G.civs[r.cb].era);
    let v=(Math.sqrt(A.pop)+Math.sqrt(B.pop))*.006*E_WEALTH[ea]*(r.sea?1.25:1)*(1+r.len/250)*(1+G.civs[r.ca].m.trade*.5);
    if((A.blk&&G.tick-A.blk<3)||(B.blk&&G.tick-B.blk<3))v*=.35;
    r.val=v;A.trade+=v*(GOVS[G.civs[r.ca].gov].trade||1);B.trade+=v*(GOVS[G.civs[r.cb].gov].trade||1);
    // plague travels with merchants
    if(A.plague>0&&!B.plague&&R()<.04)B.plague=ri(12,30);else if(B.plague>0&&!A.plague&&R()<.04)A.plague=ri(12,30);
    return true;});
}
function internalRoutes(c){

  const cap=G.cities[c.capital];if(!cap||!cap.port)return;
  for(const id of c.cities){const ct=G.cities[id];if(ct.status==='core'||!ct.port||ct.tier<1||ct.lm===cap.lm)continue;
    if(!G.routes.some(r=>(r.a===cap.id&&r.b===ct.id)||(r.a===ct.id&&r.b===cap.id))&&R()<.3){addRoute(cap,ct,true);break;}}
}

const FX=[];   // transient visual effects (not saved)

function citiesNear(x,y,r){return G.cities.filter(ct=>ct.alive&&Math.abs(ct.x-x)<=r&&Math.abs(ct.y-y)<=r&&dist(ct.x,ct.y,x,y)<=r);}
function doPlague(ct,quiet){if(!ct||ct.plague>0)return;ct.plague=ri(18,40);
  for(const o of citiesNear(ct.x,ct.y,14))if(o!==ct&&R()<.5)o.plague=ri(10,30);
  if(!quiet)logEv('disaster',ct.pop>3000?3:2,`A plague broke out in ${TN(ct)}.`,{civs:[ct.civ],city:ct.id,x:ct.x,y:ct.y});fx('plague',ct.x,ct.y,{life:6,r:10});}
function doFamine(x,y,r){const cs=citiesNear(x,y,r);for(const ct of cs)ct.famine=ri(24,48);
  if(cs.length){const c=G.civs[cs[0].civ];logEv('disaster',cs.length>3?2:1,`Drought and famine struck the lands around ${TN(cs[0])}.`,{civs:[...new Set(cs.map(x=>x.civ))],city:cs[0].id,x,y});}
  fx('drought',x,y,{life:5,r});}

function scorch(x,y,r,fn){for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const d=Math.hypot(dx,dy);if(d>r)continue;fn(ny*W+nx,d/r,nx,ny);}terrainChanged(x-r,y-r,x+r,y+r);}

function doFire(x,y,r){scorch(x,y,r,(i,f)=>{if(TER[ter[i]].wood>.3&&R()<1-f*.5){ter[i]=T.PLAINS;moist[i]=Math.max(0,moist[i]-30);if(impr[i]===IM.LUMBER)impr[i]=0;}});

function destroyCity(ct,why,cat='disaster',imp=2){

function naturalDisasters(){
  const f=SET.sim.disasters;if(!f)return;const sc=Math.sqrt(N/164000);
  const live=G.cities.filter(c=>c.alive);if(!live.length)return;
  if(R()<.03*f*sc){const big=live.filter(c=>c.tier>=3);if(big.length)doPlague(pick(big));}
  if(R()<.025*f*sc){const ct=pick(live);doFamine(ct.x,ct.y,ri(8,18));}
  if(R()<.015*f*sc){for(let k=0;k<50;k++){const i=Math.floor(R()*N);if(ter[i]===T.MOUNTAIN||ter[i]===T.HILLS){doQuake(i%W,(i/W)|0,ri(8,16));break;}}}

function spawnTribe(tile,o={}){
  const cu=newCulture(null);const rl=newReligion(cu.id);cu.rel=rl.id;
  const c=makeCiv({culture:cu.id,religion:rl.id,gov:o.gov||'tribe',origin:{t:o.origin||'tribe',y:G.year},techs:o.techs||null});
  if(o.techs){recalcMult(c);}
  const ct=foundCity(c,tile,{pop:o.pop||ri(25,50)});
  c.st.food=20+ct.pop*.3;
  civYear(c);
  const lm=landmasses[ct.lm];
  if(!o.quiet)logEv('found',o.imp!=null?o.imp:(G.year<3?1:2),`The ${CN(c)} emerged ${lm&&lm.name?`on ${lm.name}`:'in the wilds'}, near ${TN(ct)}.`,{civs:[c.id],city:ct.id,x:ct.x,y:ct.y});
  return c;
}
function spawnTribeRandom(){
  for(let k=0;k<80;k++){const i=Math.floor(R()*N);if(isWater(ter[i])||tOwn[i]||TER[ter[i]].hab<.55)continue;const x=i%W,y=(i/W)|0;
    if(!freeSite(x,y,8))continue;const newWorld=G.cradle&&!G.cradle.includes(lmass[i]);if(newWorld&&R()<.7)continue;let ok=true;for(const ct of G.cities)if(ct.alive&&Math.abs(ct.x-x)<14&&Math.abs(ct.y-y)<14){ok=false;break;}
    if(!ok)continue;
    // learn from the world a little: newcomers are not always primitive
    let avg=0,n=0;for(const c of G.civs)if(c.alive){avg+=c.nt;n++;}avg=n?avg/n:0;
    const techs=new Array(TECHS.length).fill(0);const kn=Math.floor(avg*(newWorld?.25:.45));for(let t=0;t<kn;t++)techs[t]=1;
    spawnTribe(i,{techs:kn?techs:null});return;}
}
function snapshot(){
  const f=Math.max(1,Math.ceil(W/256));const sw=Math.ceil(W/f),sh=Math.ceil(H/f);const d=new Uint16Array(sw*sh);
  for(let y=0;y<sh;y++)for(let x=0;x<sw;x++)d[y*sw+x]=tOwn[Math.min(H-1,y*f)*W+Math.min(W-1,x*f)];
  G.snaps.push({y:G.year,w:sw,h:sh,d});
}
let CLAIMS=new Map();
function computeClaims(){CLAIMS=new Map();for(const ct of G.cities){if(!ct.alive||!ct.prev.length)continue;const seen=new Set();for(const p of ct.prev){if(seen.has(p.c)||p.c===ct.civ)continue;seen.add(p.c);const o=G.civs[p.c];if(!o||!o.alive||o.culture!==ct.culture)continue;let m=CLAIMS.get(o.id);if(!m){m={};CLAIMS.set(o.id,m);}m[ct.civ]=(m[ct.civ]||0)+1;}}}
function worldYear(){
  computeClaims();
  if(R()<.035*Math.sqrt(N/80000)*SET.sim.tribes*(G.year<300?1:G.year<900?.5:.25))spawnTribeRandom();
  if(G.year%25===0||!G.snaps.length)snapshot();
  if(G.year%5===0){let pop=0,cities=0,wars=0,civs=0;for(const c of G.civs)if(c.alive){civs++;pop+=c.pop;}for(const ct of G.cities)if(ct.alive)cities++;for(const w of G.wars)if(w.active)wars++;
    G.wstats.push([G.year,Math.round(pop),civs,wars,cities]);}
  naturalDisasters();
  for(const c of G.civs)if(c.alive&&(G.year+c.id)%3===0)internalRoutes(c);
}

/* ---------- the tick ---------- */
let ALIVE=[],REBELS=[],ARMS_BY=new Map();
function simTick(){
  ALIVE=G.civs.filter(c=>c.alive);REBELS=G.armies.filter(a=>a.rebel);ARMS_BY.clear();for(const a of G.armies){if(a.civ<0||a.type!=='army')continue;let l=ARMS_BY.get(a.civ);if(!l){l=[];ARMS_BY.set(a.civ,l);}l.push(a);}
  G.tick++;G.month++;let ny=false;if(G.month>=12){G.month=0;G.year++;ny=true;}
  PF.budget=(SET.sim.path>=2?6:3)+Math.floor(G.armies.length/200);
  let di=SET.sim.pop>=2?Math.max(1,SET.sim.distInt>>1):SET.sim.distInt;if(SET.sim.distInt>1)di=Math.max(di,Math.min(8,Math.ceil(G.cities.length/500)));
  const cs=G.cities;
  for(let k=0;k<cs.length;k++){const ct=cs[k];if(!ct.alive)continue;const iv=(ct.vis&&SET.sim.pop>0)?1:di;if(iv===1||(G.tick+ct.id)%iv===0)updateCity(ct,iv);}
  routesMonth();
  for(const c of G.civs)c._sold=0;for(const a of G.armies)if(a.civ>=0&&a.type!=='settlers'&&G.civs[a.civ])G.civs[a.civ]._sold+=a.n;
  const ti=SET.sim.think;
  for(let k=0;k<G.civs.length;k++){const c=G.civs[k];if(!c.alive)continue;
    if(c.vis||(G.tick+c.id)%2===0)civMonth(c,c.vis?1:2);
    if((G.tick+c.id)%12===0){civYear(c);checkStrife(c);}
    const iv=c.vis?ti:ti*(SET.sim.ai>=2?1:2);
    if((G.tick+c.id*7)%iv===0)aiThink(c);
  }
  buildHash();
  const arr=G.armies.slice();
  for(const a of arr){if(!AMAP.has(a.id))continue;if(G.tick>=a.next)armyThink(a);if(!AMAP.has(a.id))continue;armyStep(a);armyUpkeep(a);}
  for(const a of G.armies)if(a.type==='fleet'&&a.obj==='blockade'&&!a.path){const ct=G.cities[a.tgt];if(ct&&dist(a.x,a.y,ct.x,ct.y)<4)ct.blk=G.tick;}
  buildHash();
  detectBattles();resolveBattles();resolveSieges();
  if(ny)worldYear();
}

function eraUrban(ct){const c=ct?G.civs[ct.civ]:null;const e=c?c.era:0;return[[128,104,78],[136,112,84],[168,140,100],[176,160,138],[160,142,120],[196,188,172],[150,110,96],[176,182,190]][e];}
function tileColor(i){

function cityBuildings(ct){
  // deterministic list of special buildings for this city
  const c=G.civs[ct.civ];const era=c?c.era:0;const t=ct.tier;const b=[];
  if(t===0){b.push('fire');return b;}
  b.push(ct.capital?'palace':'hall');
  if(t>=2&&era>=1)b.push('market');
  if(t>=2)b.push('temple');
  if(t>=2&&(ct.spec==='fort'||ct.walls>=1))b.push('barracks');
  b.push('granary');
  if(t>=2&&era>=2)b.push('workshop');
  if(t>=4&&era>=5)b.push('university');
  if(era>=6&&(ct.spec==='ind'||t>=4))b.push('factory');
  if(era>=6&&t>=4)b.push('factory');
  return b;
}
function drawCityDetailed(g,ct,sx,sy,z){
  const c=G.civs[ct.civ];const era=c?c.era:0;const col=c?c.col:[200,200,200];
  const blds=cityBuildings(ct);
  const s=Math.min(z*.62,40);
  // walls
  if(ct.walls>0&&ct.urb.length&&ct.tier>=2){
    let rr=0;for(const i of ct.urb)rr+=Math.hypot(i%W-ct.x,((i/W)|0)-ct.y);rr=(Math.min(4,rr/ct.urb.length*1.3)+.7)*z;
    g.strokeStyle=ct.walls>=2||era>=3?'rgba(186,176,160,.9)':'rgba(120,88,52,.9)';g.lineWidth=Math.max(1.2,z*.06*(1+ct.walls*.5));
    g.beginPath();g.arc(sx,sy,rr,0,TAU);g.stroke();
    g.fillStyle=g.strokeStyle;const nt=6+ct.walls*2;const ts=z*(.1+ct.walls*.04);for(let k=0;k<nt;k++){const a=k/nt*TAU;g.fillRect(sx+Math.cos(a)*rr-ts,sy+Math.sin(a)*rr-ts,ts*2,ts*2);}
  }
  // tiles back-to-front
  const list=ct.urb.map((i,k)=>[i,k]).sort((a,b)=>a[0]-b[0]);
  for(const[i,k]of list){
    const x=i%W,y=(i/W)|0;const px=(x+.5-cam.x)*z+VW/2,py=(y+.5-cam.y)*z+VH/2;
    if(px<-z||py<-z||px>VW+z||py>VH+z*2)continue;
    const kk=ct.urb.indexOf(i);
    if(kk<blds.length&&GFX.buildings>=1){drawBuilding(g,blds[kk],px,py+z*.3,s,era,col,i);continue;}
    const dens=Math.min(4,1+(ct.tier>=3?1:0)+(ct.tier>=4?1:0)+(era>=6?1:0));
    const pos=[[0,0],[-.25,-.2],[.25,.15],[.22,-.25]];
    const order=[1,3,0,2].slice(0,dens);
    for(const q of order){const p=pos[q];drawBuilding(g,'house',px+p[0]*z,py+p[1]*z+z*.32,s*(dens>2?.55:.7),era,col,i*7+q);}
  }
  if(ct.port){const wp=waterNear(ct);if(wp){const px=(wp[0]+.5-cam.x)*z+VW/2,py=(wp[1]+.5-cam.y)*z+VH/2;drawBuilding(g,'dock',px,py,s,era,col,1);drawShip(g,px+z*.2,py+z*.1,z*.35,col,era,0,false);}}
  // industrial smoke
  if(era>=6&&ct.tier>=3&&GFX.particles&&R()<.15)puff(ct.x+.5+rf(-1,1),ct.y+rf(-.5,.5),'smoke');
}

  else{g.strokeStyle='#3a2a1a';g.lineWidth=Math.max(1,s*.06);g.beginPath();g.moveTo(x,y-s*.1);g.lineTo(x,y-s*.95);g.stroke();
    g.fillStyle=war?rgbS(col):'#efe8d8';g.beginPath();g.moveTo(x+s*.03,y-s*.9);g.quadraticCurveTo(x+s*.55,y-s*.55,x+s*.03,y-s*.2);g.fill();

/* ---------- particles ---------- */
const PT=[];
function puff(x,y,kind,o={}){if(PT.length>1500||!GFX.particles)return;PT.push({x,y,vx:o.vx!=null?o.vx:rf(-.05,.05),vy:o.vy!=null?o.vy:rf(-.35,-.15),t:0,life:o.life||rf(1.5,3),k:kind,s:o.s||rf(.15,.35)});}
function drawParticles(g,dt){
  const z=cam.z;
  for(let i=PT.length-1;i>=0;i--){const p=PT[i];p.t+=dt;if(p.t>p.life){PT[i]=PT[PT.length-1];PT.pop();continue;}
    p.x+=p.vx*dt;p.y+=p.vy*dt;const f=p.t/p.life;const[sx,sy]=w2s(p.x,p.y);if(sx<-50||sy<-50||sx>VW+50||sy>VH+50)continue;
    if(p.k==='smoke'){g.fillStyle=`rgba(70,70,76,${(1-f)*.45})`;g.beginPath();g.arc(sx,sy,(p.s+f*.6)*z,0,TAU);g.fill();}
    else if(p.k==='fire'){g.fillStyle=`rgba(255,${160-f*120|0},40,${1-f})`;g.beginPath();g.arc(sx,sy,p.s*z*(1-f*.5),0,TAU);g.fill();}
    else if(p.k==='spark'){g.fillStyle=`rgba(255,230,150,${1-f})`;g.fillRect(sx,sy,2,2);}
    else if(p.k==='dust'){g.fillStyle=`rgba(190,170,130,${(1-f)*.4})`;g.beginPath();g.arc(sx,sy,(p.s+f*.5)*z,0,TAU);g.fill();}

/* ---------- armies ---------- */
function armyColor(a){if(a.rebel)return a.col||[30,30,34];const c=G.civs[a.civ];return c?c.col:[200,200,200];}
function drawArmies(g,alpha){
  const z=cam.z;const[wx0,wy0]=s2w(-40,-40),[wx1,wy1]=s2w(VW+40,VH+40);
  for(const a of G.armies){
    const x=lerp(a.px,a.x,alpha),y=lerp(a.py,a.y,alpha);
    if(x<wx0||x>wx1||y<wy0||y>wy1)continue;
    const[sx,sy]=w2s(x,y);const col=armyColor(a);const sel=SEL&&SEL.t==='army'&&SEL.id===a.id;
    const water=a.type==='fleet'||isWater(ter[idx(clamp(x|0,0,W-1),clamp(y|0,0,H-1))]);
    const moving=!!a.path&&!a.battle;const dir=moving&&a.path?Math.sign(a.path[a.pi]-a.x)||1:1;
    if(sel&&a.path){g.strokeStyle='rgba(255,230,160,.7)';g.setLineDash([4,4]);g.lineWidth=1.5;g.beginPath();g.moveTo(sx,sy);for(let k=a.pi;k<a.path.length;k+=2){const[px,py]=w2s(a.path[k],a.path[k+1]);g.lineTo(px,py);}g.stroke();g.setLineDash([]);}
    if(a.type==='settlers'){
      if(z<3){g.fillStyle=rgbS(col);g.fillRect(sx-2,sy-2,4,4);continue;}
      const s=Math.min(z*.55,22);if(water){drawShip(g,sx,sy,s,col,armyEra(a),dir,false);continue;}
      const bob=moving?Math.abs(Math.sin(TIME*6))*s*.06:0;
      g.fillStyle='#6b4a2e';g.fillRect(sx-s*.5,sy-s*.25-bob,s,s*.3);g.fillStyle='#efe6d2';g.beginPath();g.arc(sx,sy-s*.25-bob,s*.45,Math.PI,0);g.fill();
      g.fillStyle='#3a2a1a';g.beginPath();g.arc(sx-s*.32,sy+s*.08,s*.14,0,TAU);g.arc(sx+s*.32,sy+s*.08,s*.14,0,TAU);g.fill();
      if(z>=6){g.fillStyle='#7a5a3a';g.beginPath();g.ellipse(sx+s*.85,sy-s*.05,s*.28,s*.14,0,0,TAU);g.fill();}
      continue;}
    if(z<2.4){
      const r=clamp(Math.sqrt(a.n)/6,2.5,7);
      g.fillStyle=rgbS(col);g.strokeStyle=a.rebel?'#ff5a3a':'rgba(0,0,0,.8)';g.lineWidth=1.2;
      if(a.type==='fleet'){g.beginPath();g.moveTo(sx-r,sy);g.lineTo(sx+r,sy);g.lineTo(sx+r*.6,sy+r*.7);g.lineTo(sx-r*.6,sy+r*.7);g.closePath();g.fill();g.stroke();}
      else{g.beginPath();g.moveTo(sx-r,sy-r);g.lineTo(sx+r,sy-r);g.lineTo(sx+r,sy+r*.3);g.lineTo(sx,sy+r*1.2);g.lineTo(sx-r,sy+r*.3);g.closePath();g.fill();g.stroke();}
      if(sel){g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.arc(sx,sy,r+4,0,TAU);g.stroke();}
      continue;}
    const s=Math.min(z*.5,20);
    if(water){
      const ships=a.type==='fleet'?clamp(Math.ceil(a.u.ship/10),1,5):clamp(Math.ceil(a.n/400),1,3);
      for(let k=0;k<ships;k++)drawShip(g,sx+(k%3-1)*s*1.1,sy+Math.floor(k/3)*s*.8-(k%2)*s*.3,s*1.1,col,armyEra(a),dir,a.type==='fleet');
    }else{
      // formation of soldiers
      const era=armyEra(a);const cnt=clamp(Math.ceil(Math.sqrt(a.n)/2.2),2,z>=8?16:9);const cols=Math.ceil(Math.sqrt(cnt*1.6));
      const sp=s*.42;const cavN=a.n?Math.round(cnt*a.u.cav/a.n):0;const sgN=a.u.siege>0?1:0;
      for(let k=0;k<cnt;k++){const r=Math.floor(k/cols),c2=k%cols;const ox=(c2-(cols-1)/2)*sp,oy=(r-1)*sp*.8;
        const bob=moving&&GFX.anim?Math.sin(TIME*10+k*1.7)*s*.05:0;const fx=sx+ox,fy=sy+oy-bob;
        if(k<sgN&&era>=3){g.fillStyle='#6b4a2e';g.fillRect(fx-s*.25,fy-s*.1,s*.5,s*.15);g.strokeStyle='#4a3420';g.lineWidth=Math.max(1,s*.06);g.beginPath();g.moveTo(fx-s*.2,fy-s*.05);g.lineTo(fx+s*.25,fy-s*.4);g.stroke();continue;}
        if(k>=cnt-cavN){g.fillStyle=era>=7?'#5a6048':'#6b4a2e';g.beginPath();g.ellipse(fx,fy,s*.2,s*.1,0,0,TAU);g.fill();g.fillRect(fx+s*.12*dir,fy-s*.2,s*.06,s*.14);g.fillStyle=rgbS(col);g.fillRect(fx-s*.05,fy-s*.28,s*.1,s*.16);g.fillStyle='#e8c8a0';g.fillRect(fx-s*.04,fy-s*.36,s*.08,s*.07);continue;}
        g.fillStyle=rgbS(col,.8);g.fillRect(fx-s*.07,fy-s*.02,s*.05,s*.12);g.fillRect(fx+s*.02,fy-s*.02,s*.05,s*.12);
        g.fillStyle=rgbS(col);g.fillRect(fx-s*.08,fy-s*.22,s*.16,s*.2);g.fillStyle='#e8c8a0';g.fillRect(fx-s*.055,fy-s*.32,s*.11,s*.1);
        g.strokeStyle=era>=5?'#333':'#a9a9a9';g.lineWidth=Math.max(1,s*.04);g.beginPath();g.moveTo(fx+s*.1*dir,fy);g.lineTo(fx+s*.1*dir,fy-s*.42);g.stroke();
